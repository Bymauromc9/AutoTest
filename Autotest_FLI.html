ad\">\u003cspan class=\"card-num\">Solución 1.4.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-1-4-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>A″ X B′ ⇒ B′ X A″ (RT1) ⇒ B′ X A′ (RT4).\u003c/li>\n\u003cli>Inicial: «el nieto quiere a la hija». Final: «la hija quiere al hijo».\u003c/li>\n\u003cli>La derivación sigue siendo correcta: sólo depende de las reglas (la forma). Lo que cambia es el significado: «el nieto conoce a la hija». El cálculo es independiente de la interpretación; el sentido no.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"1\" id=\"s-1-4-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 1.4.3\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-1-4-3\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Procedimiento\u003c/th>\n\u003cth>Método\u003c/th>\n\u003cth>Se apoya en\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Tabla de verdad\u003c/td>\n\u003ctd>Semántico\u003c/td>\n\u003ctd>La verdad de los hechos (interpretaciones)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Aplicar modus ponens\u003c/td>\n\u003ctd>Sintáctico\u003c/td>\n\u003ctd>La estructura del lenguaje (reglas de inferencia)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Buscar una interpretación que haga F una implicación\u003c/td>\n\u003ctd>Semántico\u003c/td>\n\u003ctd>La verdad de los hechos\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Reescribir con De Morgan\u003c/td>\n\u003ctd>Sintáctico\u003c/td>\n\u003ctd>La estructura del lenguaje (equivalencias como patrones)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"1\" id=\"s-1-4-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 1.4.4\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-1-4-4\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Con l: «hoy es lunes»: (l ∨ ¬l) ∧ ¬(l ∧ ¬l). Aparecen el tercio excluido (l ∨ ¬l) y la no contradicción (¬(l ∧ ¬l)). Es siempre V: l ∨ ¬l vale V en las dos interpretaciones; l ∧ ¬l vale siempre F, así que su negación vale siempre V; y V ∧ V = V. Es una tautología.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003c/section>\u003csection class=\"tema sols\" id=\"sol-2\">\u003cheader class=\"tema-head\">\u003cp class=\"eyebrow\">Soluciones · Tema 2\u003c/p>\u003ch2>Lógica proposicional (L0)\u003c/h2>\u003c/header>\u003csection class=\"topic\" id=\"s-2-1\">\u003ch3>\u003cspan class=\"tnum\">2.1\u003c/span>\u003cspan>Sintaxis\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-1-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.1.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-1-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>Sí: (¬(p ∧ q)) → r.\u003c/li>\n\u003cli>No: dentro del paréntesis ∨ no tiene fbf a su derecha, y q queda fuera sin conectiva.\u003c/li>\n\u003cli>No: ¬ va seguido de una conectiva binaria, y ∧ no tiene fbf a su izquierda.\u003c/li>\n\u003cli>Sí: (¬¬p) ↔ (q ∨ ¬r).\u003c/li>\n\u003cli>No: se abren dos paréntesis y sólo se cierra uno.\u003c/li>\n\u003cli>Sí: (p ∧ ¬(q → r)) ∨ s (∧ y ∨ tienen igual prioridad, de izquierda a derecha).\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-1-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.1.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-1-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Fórmula\u003c/th>\n\u003cth>Con paréntesis\u003c/th>\n\u003cth>Conectiva principal\u003c/th>\n\u003cth>Nº conectivas\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>¬p ∨ q ∧ r → s\u003c/td>\n\u003ctd>(((¬p) ∨ q) ∧ r) → s\u003c/td>\n\u003ctd>→\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>p → q ↔ ¬r ∨ s\u003c/td>\n\u003ctd>(p → q) ↔ ((¬r) ∨ s)\u003c/td>\n\u003ctd>↔\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>p → q → r ∧ ¬p\u003c/td>\n\u003ctd>(p → q) → (r ∧ (¬p))\u003c/td>\n\u003ctd>el segundo →\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>¬(p ∧ q) ∨ ¬r ↔ p\u003c/td>\n\u003ctd>((¬(p ∧ q)) ∨ (¬r)) ↔ p\u003c/td>\n\u003ctd>↔\u003c/td>\n\u003ctd>5\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-1-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.1.3\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-1-3\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>p y ¬q: literal y cláusula (un literal es una cláusula de un solo literal). p ∨ ¬q ∨ r: cláusula. ¬(p ∨ q): ninguna. p ∧ q: ninguna (es una FNC de dos cláusulas). ¬¬p: ninguna; es equivalente al literal p, pero sintácticamente no es un literal.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-1-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.1.4\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-1-4\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Conectiva principal ↔ (menor prioridad, fuera de paréntesis). Se lee (¬(p → q) ∨ r) ↔ (q ∧ ¬s).\u003c/p>\u003cul>\n\u003cli>↔\u003cul>\n\u003cli>∨ : ¬(p → q) ∨ r\u003cul>\n\u003cli>¬ : ¬(p → q)\u003cul>\n\u003cli>→ : p → q (hojas p, q)\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>r\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>∧ : q ∧ ¬s\u003cul>\n\u003cli>q\u003c/li>\n\u003cli>¬ : ¬s (hoja s)\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\u003cp>Tiene 6 nodos internos: 6 conectivas.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"s-2-2\">\u003ch3>\u003cspan class=\"tnum\">2.2\u003c/span>\u003cspan>Formalización\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-2-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.2.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-2-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>p ∧ ¬q\u003c/li>\n\u003cli>¬p ∧ ¬q\u003c/li>\n\u003cli>r → ¬p\u003c/li>\n\u003cli>r → ¬p (la condición necesaria va en el consecuente; es la misma fórmula que el 3)\u003c/li>\n\u003cli>p → s\u003c/li>\n\u003cli>¬p → r (≡ r ∨ p)\u003c/li>\n\u003cli>(r ∨ s) ∧ ¬(r ∧ s)\u003c/li>\n\u003cli>(p ∧ q) → (s ∧ ¬r)\u003c/li>\n\u003cli>r ↔ (¬p ∧ ¬q)\u003c/li>\n\u003cli>¬(q → s) (≡ q ∧ ¬s: hace frío y no me quedo en casa)\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-2-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.2.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-2-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>a) No es cierto que llueva o haga frío (equivale a «ni llueve ni hace frío»). b) Si me quedo en casa, es que llueve o hace frío. c) No salgo a correr si y sólo si me quedo en casa. d) Si llueve me quedo en casa, y si no llueve salgo a correr.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-2-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.2.3\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-2-3\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>Lo correcto es a → e. «Sólo si» marca el consecuente.\u003c/li>\n\u003cli>Lo correcto es m → b. La condición necesaria va en el consecuente.\u003c/li>\n\u003cli>Lo correcto es ¬l → f (≡ f ∨ l). Lo que escribió (f → ¬l) dice «si voy a la fiesta, no llueve».\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-2-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.2.4\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-2-4\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Premisas: s → ¬w; ¬w → c; ¬c. Conclusión: ¬s. Razonamiento: {s → ¬w, ¬w → c, ¬c} ⊨ ¬s.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"s-2-3\">\u003ch3>\u003cspan class=\"tnum\">2.3\u003c/span>\u003cspan>Evaluación\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-3-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.3.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-3-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Con ν(p) = V, ν(q) = F, ν(r) = F:\u003c/p>\u003col>\n\u003cli>¬p ∨ q = F ∨ F = F; F → F = \u003cspan class=\"chip tv-v\">V\u003c/span>.\u003c/li>\n\u003cli>Se lee (p → q) → r: V → F = F; F → F = \u003cspan class=\"chip tv-v\">V\u003c/span>.\u003c/li>\n\u003cli>p ↔ q = F, su negación V; r ∨ ¬p = F ∨ F = F; V ∧ F = \u003cspan class=\"chip tv-f\">F\u003c/span>.\u003c/li>\n\u003cli>p ∧ q = F; ¬r = V; ¬r ↔ q = V ↔ F = F; F ∨ F = \u003cspan class=\"chip tv-f\">F\u003c/span>.\u003c/li>\n\u003cli>Se lee ¬(p ∨ r) ↔ (q ∧ ¬p): ¬(V) = F; F ∧ F = F; F ↔ F = \u003cspan class=\"chip tv-v\">V\u003c/span>.\u003c/li>\n\u003cli>Se lee (p ∧ ¬q) → r: V ∧ V = V; V → F = \u003cspan class=\"chip tv-f\">F\u003c/span>.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-3-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.3.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-3-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Difieren cuando ν(p) = F y ν(r) = F, con q cualquiera: (F, V, F) y (F, F, F). Ahí (p → q) → r = V → F = F, mientras que p → (q → r) = V (antecedente falso). La implicación no es asociativa: el orden de agrupación importa.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-3-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.3.3\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-3-3\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>Una implicación sólo es F con antecedente V y consecuente F: ν(p) = V, ν(q) = V, ν(r) = F.\u003c/li>\n\u003cli>Una disyunción F tiene ambos miembros F: ¬p = F, así que ν(p) = V; q ↔ r = F con r = V, así que ν(q) = F.\u003c/li>\n\u003cli>Con q = F, la única forma de que p → q sea V es ν(p) = F (es el modus tollens).\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-3-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.3.4\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-3-4\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Con s: «apruebo el parcial» y c: «me invito a cenar», la frase es s → c. Sólo la incumplo si apruebo y no me invito (s = V, c = F). Si no apruebo, la cumplo me invite o no (antecedente falso).\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"s-2-4\">\u003ch3>\u003cspan class=\"tnum\">2.4\u003c/span>\u003cspan>Tablas de verdad y clasificación\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-4-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.4.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-4-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>(p → q) ∧ (p ∧ ¬q): contradicción (insatisfacible y falseable).\u003c/li>\n\u003c/ol>\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>p\u003c/th>\n\u003cth>q\u003c/th>\n\u003cth>p → q\u003c/th>\n\u003cth>¬q\u003c/th>\n\u003cth>p ∧ ¬q\u003c/th>\n\u003cth>fórmula\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\u003col>\n\u003cli>(p → q) ∨ (q → p): tautología (y satisfacible).\u003c/li>\n\u003c/ol>\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>p\u003c/th>\n\u003cth>q\u003c/th>\n\u003cth>p → q\u003c/th>\n\u003cth>q → p\u003c/th>\n\u003cth>fórmula\u003c/th>\n\u003c/tr>\n\u003c/thead> \">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\u003col>\n\u003cli>(p ↔ q) ∧ (q ↔ ¬p): contradicción. La primera exige p = q y la segunda q ≠ p.\u003c/li>\n\u003c/ol>\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>p\u003c/th>\n\u003cth>q\u003c/th>\n\u003cth>p ↔ q\u003c/th>\n\u003cth>¬p\u003c/th>\n\u003cth>q ↔ ¬p\u003c/th>\n\u003cth>fórmula\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-4-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.4.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-4-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>a) n = 4 átomos → 2⁴ = 16 filas. Conectivas: ∧, ¬ (de p ∧ q), ¬ (de s), →, ∨ = 5. Columnas: 4 + 5 = 9. b) n = 2 → 4 filas. Conectivas: →, ¬, ↔ = 3. Columnas: 2 + 3 = 5.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-4-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.4.3\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-4-3\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Para que sea F, el consecuente q ∨ s debe ser F: q = F y s = F. Para que el antecedente sea V, p → q exige p = F y r → s exige r = F. Pero entonces p ∨ r = F y el antecedente es F. Ninguna fila la hace falsa: es tautología (es el dilema constructivo).\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-4-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.4.4\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-4-4\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>V. α tiene filas V y filas F; ¬α las intercambia, así que también tiene de ambas.\u003c/li>\n\u003cli>F. p es satisfacible y ¬p también. Sólo es cierto si α es tautología.\u003c/li>\n\u003cli>F. Las contingentes también son falseables (por ejemplo, p).\u003c/li>\n\u003cli>V. Una tautología no tiene ninguna fila F.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"s-2-5\">\u003ch3>\u003cspan class=\"tnum\">2.5\u003c/span>\u003cspan>Satisfacibilidad de conjuntos\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-5-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.5.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-5-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>Γ₁ es insatisfacible. p y ¬r obligan a ν(p) = V y ν(r) = F; p → q obliga a ν(q) = V; y entonces q → r = V → F = F.\u003c/li>\n\u003cli>Γ₂ es satisfacible. Si r = F: ¬p ∨ r obliga a p = F, ¬q ∨ r obliga a q = F, y p ∨ q = F. Por tanto r = V, y ¬r ∨ p obliga a p = V. Con p = V y r = V todas son V, sea cual sea q. Modelos: (p, q, r) = (V, V, V) y (V, F, V).\u003c/li>\n\u003cli>Γ₃ es insatisfacible. p ↔ q y q ↔ r obligan a que p, q y r tengan el mismo valor; p ↔ ¬r exige que p y r sean distintos.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-5-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.5.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-5-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>¬p obliga a p = F, y p ∨ q a q = V. Modelo único: ν(p) = F, ν(q) = V.\u003c/li>\n\u003cli>Con ¬q el conjunto es insatisfacible: ningún modelo hace V a la vez q y ¬q.\u003c/li>\n\u003cli>Con p ∨ ¬p (tautología) sigue siendo satisfacible y con el mismo modelo.\u003c/li>\n\u003cli>{p ∨ q, ¬q} es satisfacible: ν(p) = V, ν(q) = F. Quitar una fbf puede devolver la satisfacibilidad.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-5-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.5.3\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-5-3\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>F. {p, ¬p}: cada fbf es satisfacible, pero el conjunto no.\u003c/li>\n\u003cli>V. Ninguna interpretación hace V a la contradicción.\u003c/li>\n\u003cli>F. Añadir fbf nunca añade modelos.\u003c/li>\n\u003cli>V. No hay ninguna fórmula que incumplir.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"s-2-6\">\u003ch3>\u003cspan class=\"tnum\">2.6\u003c/span>\u003cspan>Equivalencia lógica\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-6-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.6.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-6-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>¬(p → q) ≡ ¬(¬p ∨ q) (interdefinición) ≡ ¬¬p ∧ ¬q (De Morgan) ≡ p ∧ ¬q (doble negación).\u003c/li>\n\u003cli>p → (q → r) ≡ (p ∧ q) → r (exportación) ≡ (q ∧ p) → r (conmutativa) ≡ q → (p → r) (exportación).\u003c/li>\n\u003cli>(p → r) ∧ (q → r) ≡ (¬p ∨ r) ∧ (¬q ∨ r) (interdefinición) ≡ (¬p ∧ ¬q) ∨ r (distributiva de ∨ sobre ∧, de derecha a izquierda) ≡ ¬(p ∨ q) ∨ r (De Morgan) ≡ (p ∨ q) → r (interdefinición).\u003c/li>\n\u003cli>¬(p ∨ (¬p ∧ q)) ≡ ¬((p ∨ ¬p) ∧ (p ∨ q)) (distributiva) ≡ ¬(V ∧ (p ∨ q)) (epistemológica) ≡ ¬(p ∨ q) (neutro) ≡ ¬p ∧ ¬q (De Morgan).\u003c/li>\n\u003cli>(p → q) ∧ (p → ¬q) ≡ (¬p ∨ q) ∧ (¬p ∨ ¬q) (interdefinición) ≡ ¬p ∨ (q ∧ ¬q) (distributiva) ≡ ¬p ∨ F (epistemológica) ≡ ¬p (neutro).\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-6-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.6.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-6-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>Incorrecta. Contraejemplo ν(p) = V, ν(q) = F, ν(r) = F: izquierda (V ∨ F) → F = F; derecha (V → F) ∨ (F → F) = F ∨ V = V. (También falla en p = F, q = V, r = F.)\u003c/li>\n\u003cli>Correcta. (p → q) ∧ (p → r) ≡ (¬p ∨ q) ∧ (¬p ∨ r) ≡ ¬p ∨ (q ∧ r) ≡ p → (q ∧ r).\u003c/li>\n\u003cli>Incorrecta. ¬p ↔ ¬q ≡ p ↔ q, que es justo la negación de la izquierda: difieren en todas las interpretaciones. Contraejemplo p = V, q = V: izquierda ¬(V) = F; derecha F ↔ F = V.\u003c/li>\n\u003cli>Correcta. ¬(p ↔ q) ≡ ¬((¬p ∨ q) ∧ (p ∨ ¬q)) ≡ (p ∧ ¬q) ∨ (¬p ∧ q). Y p ↔ ¬q ≡ (¬p ∨ ¬q) ∧ (p ∨ q) ≡ (¬p ∧ p) ∨ (¬p ∧ q) ∨ (¬q ∧ p) ∨ (¬q ∧ q) ≡ (¬p ∧ q) ∨ (p ∧ ¬q). Coinciden (ambas son V cuando p y q difieren).\u003c/li>\n\u003cli>Incorrecta. Contraejemplo p = V, q = F, r = F: izquierda F → F = V; derecha (V → F) ∧ (F → F) = F. Lo correcto es (p ∧ q) → r ≡ (p → r) ∨ (q → r).\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-6-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.6.3\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-6-3\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>a) p ∧ q ≡ ¬(¬p ∨ ¬q). b) p ↔ q ≡ (¬p ∨ q) ∧ (¬q ∨ p) ≡ ¬(¬(¬p ∨ q) ∨ ¬(¬q ∨ p)). c) p → (q ∧ r) ≡ ¬p ∨ (q ∧ r) ≡ ¬p ∨ ¬(¬q ∨ ¬r).\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-6-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.6.4\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-6-4\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>a) ¬(¬p ∧ q) ≡ p ∨ ¬q (De Morgan, doble negación); (p ∨ ¬q) ∧ (p ∨ q) ≡ p ∨ (¬q ∧ q) ≡ p ∨ F ≡ \u003cstrong>p\u003c/strong>. b) (p ∧ q) ∨ (p ∧ ¬q) ≡ p ∧ (q ∨ ¬q) ≡ p; después p ∨ (¬p ∧ q) ≡ (p ∨ ¬p) ∧ (p ∨ q) ≡ \u003cstrong>p ∨ q\u003c/strong>.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"s-2-7\">\u003ch3>\u003cspan class=\"tnum\">2.7\u003c/span>\u003cspan>Consecuencia lógica\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-7-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.7.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-7-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>1 Modus tollens. 2 Silogismo disyuntivo. 3 Falacia de afirmación del consecuente (contraejemplo p = F, q = V). 4 Falacia de negación del antecedente (contraejemplo p = F, q = V). 5 Simplificación. 6 Prueba por casos. 7 Ley de inconsistencia. 8 Introducción de la equivalencia.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-7-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.7.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-7-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>No válido. Para que r → p sea F: r = V, p = F. Entonces p → q y q → r son V con cualquier q. Contraejemplos (p, q, r): (F, V, V) y (F, F, V).\u003c/li>\n\u003cli>Válido. Si r = F: p → r obliga a p = F, q → r obliga a q = F, y p ∨ q = F. No hay fila con premisas V y conclusión F.\u003c/li>\n\u003cli>Válido. Con ¬q y ¬r, q ∨ r = F; para que p → (q ∨ r) sea V, p = F. Luego ¬p es V.\u003c/li>\n\u003cli>No válido. Contraejemplo p = V, q = F, r = F: (V ∧ F) → F = V, ¬r = V, pero ¬p = F. Lo único que se deduce es ¬(p ∧ q).\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-7-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.7.3\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-7-3\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>D = ((p ↔ q) ∧ q) → p; R = (p ↔ q) ∧ q ∧ ¬p.\u003c/p>\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>p\u003c/th>\n\u003cth>q\u003c/th>\n\u003cth>p ↔ q\u003c/th>\n\u003cth>premisas\u003c/th>\n\u003cth>D (directo)\u003c/th>\n\u003cth>R (refutación)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\u003cp>D es tautología y R contradicción: el razonamiento es válido.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-7-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.7.4\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-7-4\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>1 V (ley de inconsistencia: nunca hay fila con premisas V). 2 V (α ≡ β ⟺ α ⊨ β y β ⊨ α). 3 F (monotonía: añadir premisas no estropea un razonamiento válido). 4 V.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic integ\" id=\"s-2-8\">\u003ch3>\u003cspan class=\"tnum\">2.8\u003c/span>\u003cspan>Integradores\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-8-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.8.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-8-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>a) h → a; a → c («la alarma suena sólo si hay corriente»); ¬c ⊨ ¬h. b) Tabla del planteamiento directo D = (h → a) ∧ (a → c) ∧ ¬c → ¬h:\u003c/p>\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>h\u003c/th>\n\u003cth>a\u003c/th>\n\u003cth>c\u003c/th>\n\u003cth>h → a\u003c/th>\n\u003cth>a → c\u003c/th>\n\u003cth>¬c\u003c/th>\n\u003cth>premisas\u003c/th>\n\u003cth>¬h\u003c/th>\n\u003cth>D\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\u003cp>Contingente (satisfacible y falseable). b) p → q ≡ ¬p ∨ q y ¬p → r ≡ ¬¬p ∨ r ≡ p ∨ r (interdefinición y doble negación). c) Sí. En las 4 filas donde α es V (VVV, VVF, FVV, FFV), q ∨ r también es V. Es una prueba por casos: si p, entonces q; si ¬p, entonces r.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-8-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.8.3\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-8-3\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>a) p = V y q = F; para que p → (q ∨ r) sea V hace falta q ∨ r = V, luego r = V. Modelo único: (V, F, V). b) Sí: el único modelo hace V a r. c) No, Γ ∪ {¬r} es insatisfacible. d) Es la refutación: Γ ⊨ r si y sólo si Γ ∪ {¬r} es insatisfacible.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-8-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.8.4\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-8-4\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>a) Por contraposición, ¬q → ¬p ≡ p → q, así que la fórmula equivale a (p → q) ↔ (p → q), de la forma α ↔ α: siempre V. b) La frase es d → c. (i) ¬c → ¬d: equivalente (contraposición). (ii) c → d: no equivalente, es la recíproca (contraejemplo d = F, c = V: la original es V y la recíproca F). (iii) ¬d ∨ c: equivalente (interdefinición).\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-8-5\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.8.5\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-8-5\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>a) a ↔ ¬b; b ↔ ¬c; c ↔ (¬a ∧ ¬b). b) Si a = V: b = F, y de b ↔ ¬c sale c = V; pero c ↔ (¬a ∧ ¬b) = V ↔ (F ∧ V) = V ↔ F = F. Falla. Si a = F: b = V, c = F; y c ↔ (¬a ∧ ¬b) = F ↔ (V ∧ F) = F ↔ F = V. Modelo único: a = F, b = V, c = F. c) Sólo Benito dice la verdad.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"2\" id=\"s-2-8-6\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 2.8.6\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-2-8-6\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>a) Válido. b) SH(s → ¬w, ¬w → c) da s → c; MT(s → c, ¬c) da ¬s. También puede hacerse con dos MT: de ¬w → c y ¬c sale w (¬¬w); de s → ¬w y w sale ¬s. c) s → ¬w ≡ w → ¬s: «si la web carga, el servidor no está caído».\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003c/section>\u003csection class=\"tema sols\" id=\"sol-3\">\u003cheader class=\"tema-head\">\u003cp class=\"eyebrow\">Soluciones · Tema 3\u003c/p>\u003ch2>Razonamientos\u003c/h2>\u003c/header>\u003csection class=\"topic\" id=\"s-3-1\">\u003ch3>\u003cspan class=\"tnum\">3.1\u003c/span>\u003cspan>Validez semántica\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"3\" id=\"s-3-1-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 3.1.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-3-1-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>a) Directo: D = (p → q) ∧ (¬q ∨ r) → (p → r). Refutación: R = (p → q) ∧ (¬q ∨ r) ∧ ¬(p → r). b)\u003c/p>\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>p\u003c/th>\n\u003cth>q\u003c/th>\n\u003cth>r\u003c/th>\n\u003cth>p → q\u003c/th>\n\u003cth>¬q ∨ r\u003c/th>\n\u003cth>premisas\u003c/th>\n\u003cth>p → r\u003c/th>\n\u003cth>D\u003c/th>\n\u003cth>R\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\u003cp>D es tautología y R es contradicción: VÁLIDO. Fíjate en que ¬q ∨ r ≡ q → r, así que es un silogismo hipotético.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"3\" id=\"s-3-1-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 3.1.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-3-1-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>a) No es válido. b) Contraejemplo ν(p) = F, ν(q) = V, ν(r) = F: p ∨ q = V y p → r = V, pero r = F. En esa fila D = (V ∧ V) → F = F y R = V ∧ V ∧ ¬F = V. D y R son siempre una la negación de la otra.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"3\" id=\"s-3-1-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 3.1.3\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-3-1-3\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>F. La validez sólo dice que, si las premisas fueran V, la conclusión lo sería.\u003c/li>\n\u003cli>V. La conclusión nunca es F, así que no existe contraejemplo.\u003c/li>\n\u003cli>F. Si las premisas son insatisfacibles, el razonamiento es válido con cualquier conclusión.\u003c/li>\n\u003cli>V. Puede ser F en filas donde alguna premisa es F.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"s-3-2\">\u003ch3>\u003cspan class=\"tnum\">3.2\u003c/span>\u003cspan>Deducción natural\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"3\" id=\"s-3-2-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 3.2.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-3-2-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>4: Simp(1). 5: Simp(1). 6: MP(2,4). 7: MP(3,5). 8: Comb(6,7).\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"3\" id=\"s-3-2-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 3.2.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-3-2-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>\n\u003col>\n\u003cli>¬p MT(1,2); 5. r SD(3,4).\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\n\u003col>\n\u003cli>¬p SD(2,3) (de ¬p ∨ r y ¬r); 5. q SD(1,4).\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\n\u003col>\n\u003cli>p ∧ q Comb(2,3); 5. r MP(1,4).\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\n\u003col>\n\u003cli>¬p MT(1,4); 6. r SD(3,5); 7. s MP(2,6).\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\n\u003col>\n\u003cli>¬p ∨ ¬¬q De Morgan(1); 4. ¬p ∨ q Doble negación(3); 5. ¬p SD(4,2). Alternativa: 3. p → q Interdefinición(1), porque ¬(α ∧ ¬β) ≡ α → β; 4. ¬p MT(3,2).\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\n\u003col>\n\u003cli>p → q Eliminación de la equivalencia(1); 4. ¬p MT(3,2).\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"3\" id=\"s-3-2-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 3.2.3\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-3-2-3\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>El paso 3 no es MP: MP necesita el antecedente p, no el consecuente q. Es la falacia de afirmación del consecuente. Contraejemplo ν(p) = F, ν(q) = V: premisas V, conclusión F.\u003c/li>\n\u003cli>SD exige la negación de un disyuntivo ({α ∨ β, ¬α} ⊨ β). Con p no se puede concluir nada sobre q, porque ∨ es inclusiva. Contraejemplo ν(p) = V, ν(q) = V: premisas V, ¬q = F.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"s-3-3\">\u003ch3>\u003cspan class=\"tnum\">3.3\u003c/span>\u003cspan>Teorema de la deducción\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"3\" id=\"s-3-3-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 3.3.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-3-3-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Nº\u003c/th>\n\u003cth>Fórmula\u003c/th>\n\u003cth>Justificación\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>p → (q → r)\u003c/td>\n\u003ctd>Premisa\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>q\u003c/td>\n\u003ctd>Supuesto\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>p\u003c/td>\n\u003ctd>Supuesto\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>q → r\u003c/td>\n\u003ctd>MP(1,3)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>r\u003c/td>\n\u003ctd>MP(4,2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>p → r\u003c/td>\n\u003ctd>Teorema de la deducción (3–5)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>q → (p → r)\u003c/td>\n\u003ctd>Teorema de la deducción (2–6)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"3\" id=\"s-3-3-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 3.3.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-3-3-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Nº\u003c/th>\n\u003cth>Fórmula\u003c/th>\n\u003cth>Justificación\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>¬q → ¬p\u003c/td>\n\u003ctd>Premisa\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>p\u003c/td>\n\u003ctd>Supuesto\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>¬¬p\u003c/td>\n\u003ctd>Doble negación(2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>¬¬q\u003c/td>\n\u003ctd>MT(1,3)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>q\u003c/td>\n\u003ctd>Doble negación(4)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>p → q\u003c/td>\n\u003ctd>Teorema de la deducción (2–5)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"3\" id=\"s-3-3-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 3.3.3\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-3-3-3\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>{p, p → q} ⊢ q ⟺ {p} ⊢ (p → q) → q ⟺ ⊢ p → ((p → q) → q). Los paréntesis interiores son obligatorios: p → (p → q) → q se leería (p → (p → q)) → q, que es otra fórmula.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"s-3-4\">\u003ch3>\u003cspan class=\"tnum\">3.4\u003c/span>\u003cspan>Solidez, completitud, teorías\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"3\" id=\"s-3-4-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 3.4.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-3-4-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>1 sólido (correcto); 2 completo; 3 teoría; 4 consistente; 5 semidecidible; 6 decidible.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"3\" id=\"s-3-4-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 3.4.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-3-4-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>V. Solidez: si ⊢ β entonces ⊨ β.\u003c/li>\n\u003cli>F. Eso es la solidez; la completitud dice que toda tautología es teorema.\u003c/li>\n\u003cli>F. Es sólida y completa.\u003c/li>\n\u003cli>F. L0 es decidible: la tabla de verdad siempre termina.\u003c/li>\n\u003cli>F. L1 es semidecidible.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"3\" id=\"s-3-4-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 3.4.3\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-3-4-3\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>a) S₁ no es sólido: su regla es la falacia de afirmación del consecuente. Deriva p de {p → q, q}, pero con p = F, q = V las premisas son V y p es F. b) S₂ es sólido: MP es una implicación lógica, así que todo lo derivado es consecuencia lógica. c) S₂ no es completo: {p} ⊨ p ∨ q, pero con la premisa p sola no hay ninguna implicación a la que aplicar MP, así que no se puede derivar p ∨ q (haría falta la regla de adición).\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"3\" id=\"s-3-4-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 3.4.4\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-3-4-4\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>No es consistente: 1. p (axioma); 2. p → q (axioma); 3. q → ¬p (axioma); 4. q MP(2,1); 5. ¬p MP(3,4). Se derivan p y ¬p.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic integ\" id=\"s-3-5\">\u003ch3>\u003cspan class=\"tnum\">3.5\u003c/span>\u003cspan>Integradores\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"3\" id=\"s-3-5-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 3.5.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-3-5-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>{c → t, (t ∧ a) → d, a, c} ⊢ d.\u003c/li>\n\u003cli>\n\u003col>\n\u003cli>t MP(1,4); 6. t ∧ a Comb(5,3); 7. d MP(2,6).\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>Supongamos d = F con premisas V: c = V y a = V; c → t obliga a t = V; entonces (t ∧ a) → d = V → F = F. Contradicción: no hay contraejemplo, el razonamiento es válido.\u003c/li>\n\u003cli>La solidez: si ⊢ d, entonces ⊨ d.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"3\" id=\"s-3-5-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 3.5.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-3-5-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>a) Premisas l → m y m; conclusión l. b) ν(l) = F, ν(m) = V: premisas V, conclusión F (la calle puede estar mojada por otra causa). c) Por solidez, ⊢ implica ⊨. Como el razonamiento no es válido, no puede existir una demostración en un sistema sólido (contrarrecíproco de la solidez).\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"3\" id=\"s-3-5-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 3.5.3\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-3-5-3\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>a) 3. p → r SH(1,2); 4. ¬r → ¬p Contraposición(3). Con supuestos: suponer ¬r; ¬q MT(2); ¬p MT(1); teorema de la deducción. b) Para que ¬r → ¬p sea F: ¬r = V y ¬p = F, es decir r = F y p = V. p → q obliga a q = V; entonces q → r = V → F = F. Contradicción: es válido.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"3\" id=\"s-3-5-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 3.5.4\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-3-5-4\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>a) 5. q SD(1,2); 6. r MP(3,5); 7. r ∧ ¬r Comb(6,4). Se ha derivado una contradicción: ℱ es inconsistente. b)\u003c/p>\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>p\u003c/th>\n\u003cth>q\u003c/th>\n\u003cth>r\u003c/th>\n\u003cth>p ∨ q\u003c/th>\n\u003cth>¬p\u003c/th>\n\u003cth>q → r\u003c/th>\n\u003cth>¬r\u003c/th>\n\u003cth>conjunción\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-v\">V\u003c/td>\n\u003ctd class=\"tv tv-f\">F\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\u003cp>Ninguna fila hace V a todas: ℱ es insatisfacible. c) En un sistema sólido y completo, como la deducción natural, inconsistente ⟺ insatisfacible. Por solidez, si se derivan β y ¬β, ningún modelo puede hacer V a ℱ. Por completitud, si ℱ es insatisfacible, ℱ ⊨ β ∧ ¬β (ley de inconsistencia) y eso se puede derivar.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003c/section>\u003csection class=\"tema sols\" id=\"sol-4\">\u003cheader class=\"tema-head\">\u003cp class=\"eyebrow\">Soluciones · Tema 4\u003c/p>\u003ch2>Problema SAT en L0\u003c/h2>\u003c/header>\u003csection class=\"topic\" id=\"s-4-1\">\u003ch3>\u003cspan class=\"tnum\">4.1\u003c/span>\u003cspan>SAT y técnicas\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-1-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.1.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-1-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>V.\u003c/li>\n\u003cli>F. Está en P (hay algoritmos deterministas polinómicos).\u003c/li>\n\u003cli>V.\u003c/li>\n\u003cli>F. No son completos: pueden no encontrar un modelo aunque exista.\u003c/li>\n\u003cli>V.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-1-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.1.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-1-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Técnica\u003c/th>\n\u003cth>¿Necesita forma clausal?\u003c/th>\n\u003cth>¿Da modelos?\u003c/th>\n\u003cth>¿Decide tautología directamente?\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Tabla de verdad\u003c/td>\n\u003ctd>No\u003c/td>\n\u003ctd>Sí\u003c/td>\n\u003ctd>Sí (todas las filas V)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DPLL\u003c/td>\n\u003ctd>Sí\u003c/td>\n\u003ctd>Sí\u003c/td>\n\u003ctd>Sólo si la regla de la tautología inicial deja ∅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Resolución\u003c/td>\n\u003ctd>Sí\u003c/td>\n\u003ctd>No\u003c/td>\n\u003ctd>No\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Árbol semántico\u003c/td>\n\u003ctd>No\u003c/td>\n\u003ctd>Sí\u003c/td>\n\u003ctd>Sí (todas las hojas \u003cspan class=\"mark ok\">ÉXITO\u003c/span>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tableau\u003c/td>\n\u003ctd>No\u003c/td>\n\u003ctd>Sí (hojas abiertas)\u003c/td>\n\u003ctd>No: hay que cerrar el tableau de ¬α\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"s-4-2\">\u003ch3>\u003cspan class=\"tnum\">4.2\u003c/span>\u003cspan>FNC\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-2-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.2.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-2-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>(p → q) → r ≡ ¬(¬p ∨ q) ∨ r (eliminar →) ≡ (¬¬p ∧ ¬q) ∨ r (De Morgan) ≡ (p ∧ ¬q) ∨ r (doble negación) ≡ \u003cstrong>(p ∨ r) ∧ (¬q ∨ r)\u003c/strong> (distributiva). Forma clausal {{p, r}; {¬q, r}}. No es tautología (p = F, r = F la hace F).\u003c/li>\n\u003cli>p ↔ (q ∧ r) ≡ (¬p ∨ (q ∧ r)) ∧ (p ∨ ¬(q ∧ r)) (eliminar ↔) ≡ (¬p ∨ (q ∧ r)) ∧ (p ∨ ¬q ∨ ¬r) (De Morgan) ≡ \u003cstrong>(¬p ∨ q) ∧ (¬p ∨ r) ∧ (p ∨ ¬q ∨ ¬r)\u003c/strong> (distributiva). Forma clausal {{¬p, q}; {¬p, r}; {p, ¬q, ¬r}}. No es tautología (p = V, q = F).\u003c/li>\n\u003cli>¬(p ∨ q) ∨ (r ∧ ¬p) ≡ (¬p ∧ ¬q) ∨ (r ∧ ¬p) (De Morgan) ≡ (¬p ∨ r) ∧ (¬p ∨ ¬p) ∧ (¬q ∨ r) ∧ (¬q ∨ ¬p) (distributiva, todos con todos) ≡ (¬p ∨ r) ∧ ¬p ∧ (¬q ∨ r) ∧ (¬q ∨ ¬p) (idempotencia) ≡ \u003cstrong>¬p ∧ (¬q ∨ r)\u003c/strong> (¬p subsume a ¬p ∨ r y a ¬q ∨ ¬p). Forma clausal {{¬p}; {¬q, r}}. No es tautología.\u003c/li>\n\u003cli>Se lee ((p ∧ q) ∨ (¬p ∧ ¬q)) → ¬r ≡ ¬((p ∧ q) ∨ (¬p ∧ ¬q)) ∨ ¬r (eliminar →) ≡ ((¬p ∨ ¬q) ∧ (p ∨ q)) ∨ ¬r (De Morgan y doble negación) ≡ \u003cstrong>(¬p ∨ ¬q ∨ ¬r) ∧ (p ∨ q ∨ ¬r)\u003c/strong> (distributiva). Forma clausal {{¬p, ¬q, ¬r}; {p, q, ¬r}}. No es tautología (p = q = r = V).\u003c/li>\n\u003cli>(p → q) ∨ (q → p) ≡ ¬p ∨ q ∨ ¬q ∨ p ≡ V (literales opuestos). Forma clausal {{¬p, q, ¬q, p}}: la regla de la tautología la elimina y queda ∅. \u003cspan class=\"chip ok\">Es tautología.\u003c/span>\u003c/li>\n\u003cli>¬((¬p ∨ q) ∧ (¬q ∨ p)) ≡ (p ∧ ¬q) ∨ (q ∧ ¬p) (De Morgan, doble negación) ≡ (p ∨ q) ∧ (p ∨ ¬p) ∧ (¬q ∨ q) ∧ (¬q ∨ ¬p) (distributiva) ≡ \u003cstrong>(p ∨ q) ∧ (¬p ∨ ¬q)\u003c/strong> (opuestos y constantes). Forma clausal {{p, q}; {¬p, ¬q}}. No es tautología (p = q = V).\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-2-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.2.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-2-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>Todas las cláusulas son triviales: tautología (la regla de la tautología deja ∅).\u003c/li>\n\u003cli>Insatisfacible: {p} obliga a p = V, entonces {¬p, q} obliga a q = V, que choca con {¬q}.\u003c/li>\n\u003cli>Satisfacible (p = F, q = V) y falseable: ni tautología ni contradicción.\u003c/li>\n\u003cli>{} = ∅ es satisfacible (no hay nada que cumplir); {□} es insatisfacible (contiene la cláusula vacía).\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"s-4-3\">\u003ch3>\u003cspan class=\"tnum\">4.3\u003c/span>\u003cspan>Propagación\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-3-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.3.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-3-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>ξ(p) = {{r}; {¬q, ¬r}; {q, r, s}}. Se elimina {p, q} y se borra ¬p de {¬p, r}.\u003c/li>\n\u003cli>ξ(p, r) = {{¬q}}. Se eliminan {r} y {q, r, s}, y se borra ¬r de {¬q, ¬r}.\u003c/li>\n\u003cli>ξ(p, r, ¬q) = ∅: satisfacible, con modelo ν(p) = V, ν(r) = V, ν(q) = F (s cualquiera).\u003c/li>\n\u003cli>ξ(p, ¬r) = {□; {q, s}}: {r} pierde su único literal. Contiene □: no hay modelo con p = V y r = F.\u003c/li>\n\u003cli>ξ(¬p) = {{q}; {¬q, ¬r}; {q, r, s}}; ξ(¬p, q) = {{¬r}}; ξ(¬p, q, ¬r) = ∅. Modelo: ν(p) = F, ν(q) = V, ν(r) = F.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-3-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.3.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-3-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Con ν(p) = F, ν(q) = F, ν(r) = V, ν(s) = V: ξ es F (falla {p, q}) pero ξ(p) es V. Tienen valores distintos, luego ξ ≢ ξ(p). Pero cualquier modelo de ξ(p), ampliado con ν(p) = V, es modelo de ξ: se conserva la satisfacibilidad.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"s-4-4\">\u003ch3>\u003cspan class=\"tnum\">4.4\u003c/span>\u003cspan>DPLL\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-4-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.4.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-4-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Sin tautologías, unitarias, puros (p y q aparecen con los dos signos) ni subsumidas. Ramificación por p:\u003c/p>\u003cul>\n\u003cli>Rama p: ξ(p) = {{q}; {¬q}} → unitaria q → {□}. Backtracking.\u003c/li>\n\u003cli>Rama ¬p: ξ(¬p) = {{q}; {¬q}} → unitaria q → {□}.\u003c/li>\n\u003c/ul>\u003cp>Las dos ramas de la primera ramificación acaban en □: \u003cspan class=\"chip bad\">INSATISFACIBLE\u003c/span>.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-4-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.4.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-4-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Sin tautologías, unitarias, puros ni subsumidas. Ramificación por p:\u003c/p>\u003cul>\n\u003cli>Rama p: ξ(p) = {{q, ¬r}; {r}; {¬q, ¬r}} → unitaria r: {{q}; {¬q}} → unitaria q → {□}. Backtracking.\u003c/li>\n\u003cli>Rama ¬p: ξ(¬p) = {{¬q}; {q, ¬r}; {q, r}} → unitaria ¬q: {{¬r}; {r}} → unitaria ¬r → {□}.\u003c/li>\n\u003c/ul>\u003cp>\u003cspan class=\"chip bad\">INSATISFACIBLE.\u003c/span> Interpretación: las tres primeras cláusulas dicen q → p, r → q y p → r (las tres tienen el mismo valor); la cuarta exige alguna V y la quinta alguna F.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-4-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.4.3\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-4-3\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>Tautología: se elimina {p, ¬p, r}. Queda {{q, r}; {q, r, ¬s}; {¬q, s}; {¬r, ¬s}; {s, t}}.\u003c/li>\n\u003cli>No hay unitarias.\u003c/li>\n\u003cli>Literal puro t (no aparece ¬t): ξ(t) = {{q, r}; {q, r, ¬s}; {¬q, s}; {¬r, ¬s}}.\u003c/li>\n\u003cli>Inclusión: {q, r} ⊆ {q, r, ¬s}, se elimina {q, r, ¬s}. Queda {{q, r}; {¬q, s}; {¬r, ¬s}}.\u003c/li>\n\u003cli>Sin unitarias ni puros: ramificación por q. ξ(t, q) = {{s}; {¬r, ¬s}} → unitaria s: {{¬r}} → unitaria ¬r: ∅.\u003c/li>\n\u003c/ol>\u003cp>\u003cspan class=\"chip ok\">SATISFACIBLE\u003c/span>, modelo ν(t) = V, ν(q) = V, ν(s) = V, ν(r) = F (p cualquiera). Comprobación en las originales: {p, ¬p, r} V; {q, r} V por q; {q, r, ¬s} V por q; {¬q, s} V por s; {¬r, ¬s} V por ¬r; {s, t} V. Correcto.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-4-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.4.4\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-4-4\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Sin tautologías, unitarias, puros ni subsumidas. Ramificación por p:\u003c/p>\u003cul>\n\u003cli>Rama p: ξ(p) = {{r}; {¬r}; {q, s}; {¬q, ¬s}} → unitaria r → {□; {q, s}; {¬q, ¬s}}. Rama fallida, backtracking.\u003c/li>\n\u003cli>Rama ¬p: ξ(¬p) = {{q}; {q, s}; {¬q, ¬s}} → unitaria q: {{¬s}} → unitaria ¬s: ∅.\u003c/li>\n\u003c/ul>\u003cp>\u003cspan class=\"chip ok\">SATISFACIBLE\u003c/span>, modelo ν(p) = F, ν(q) = V, ν(s) = F (r cualquiera). Llegar a □ en la rama p no permitía concluir nada.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"s-4-5\">\u003ch3>\u003cspan class=\"tnum\">4.5\u003c/span>\u003cspan>Resolución\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-5-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.5.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-5-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Nº\u003c/th>\n\u003cth>Cláusula\u003c/th>\n\u003cth>Origen\u003c/th>\n\u003cth>Simplificación\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>{p, q}\u003c/td>\n\u003ctd>Inicial\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>{¬p, r}\u003c/td>\n\u003ctd>Inicial\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>{¬q, r}\u003c/td>\n\u003ctd>Inicial\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>{¬r}\u003c/td>\n\u003ctd>Inicial\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>{¬p}\u003c/td>\n\u003ctd>Rᵣ(2, 4)\u003c/td>\n\u003ctd>Subsumida(2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>{¬q}\u003c/td>\n\u003ctd>Rᵣ(3, 4)\u003c/td>\n\u003ctd>Subsumida(3); r ya no aparece: Puro(¬r) en 4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>{q}\u003c/td>\n\u003ctd>Rₚ(1, 5)\u003c/td>\n\u003ctd>Subsumida(1)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8\u003c/td>\n\u003ctd>□\u003c/td>\n\u003ctd>R_q(6, 7)\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\u003cp>\u003cspan class=\"chip bad\">INSATISFACIBLE.\u003c/span> Grafo de refutación: nivel 0 = cláusulas 1 a 4; nivel 1 = {¬p} (de 2 y 4) y {¬q} (de 3 y 4); nivel 2 = {q} (de 1 y {¬p}); nivel 3 = □ (de {q} y {¬q}). En saturación estricta también salen en el nivel 1 {q, r} = Rₚ(1, 2) y {p, r} = R_q(1, 3), que quedan subsumidas después por {q} y {p}; no cambian el resultado.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-5-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.5.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-5-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Nº\u003c/th>\n\u003cth>Cláusula\u003c/th>\n\u003cth>Origen\u003c/th>\n\u003cth>Simplificación\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>{p, q}\u003c/td>\n\u003ctd>Inicial\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>{¬p, q}\u003c/td>\n\u003ctd>Inicial\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>{¬q, r}\u003c/td>\n\u003ctd>Inicial\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>{¬r, s}\u003c/td>\n\u003ctd>Inicial\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>{q}\u003c/td>\n\u003ctd>Rₚ(1, 2)\u003c/td>\n\u003ctd>Subsumida(1), Subsumida(2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>{r}\u003c/td>\n\u003ctd>R_q(5, 3)\u003c/td>\n\u003ctd>Subsumida(3); ahora Puro(q) en 5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>{s}\u003c/td>\n\u003ctd>Rᵣ(6, 4)\u003c/td>\n\u003ctd>Subsumida(4); Puro(r) en 6; Puro(s) en 7\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\u003cp>No quedan cláusulas y no ha salido □: \u003cspan class=\"chip ok\">SATISFACIBLE\u003c/span>. La resolución no da modelos; uno se obtiene con DPLL: ν(q) = V, ν(r) = V, ν(s) = V, p cualquiera.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-5-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.5.3\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-5-3\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Premisas en forma clausal: {¬p, q}, {¬q, r, s}, {¬s}. Conclusión negada: ¬(p → r) ≡ p ∧ ¬r, CS = {{p}; {¬r}}.\u003c/p>\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Nº\u003c/th>\n\u003cth>Cláusula\u003c/th>\n\u003cth>Origen\u003c/th>\n\u003cth>Notas\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>{¬p, q}\u003c/td>\n\u003ctd>Inicial\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>{¬q, r, s}\u003c/td>\n\u003ctd>Inicial\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>{¬s}\u003c/td>\n\u003ctd>Inicial\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>{p}\u003c/td>\n\u003ctd>CS\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>{¬r}\u003c/td>\n\u003ctd>CS\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>{q}\u003c/td>\n\u003ctd>Rₚ(1, 4) CS\u003c/td>\n\u003ctd>Subsumida(1)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>{r, s}\u003c/td>\n\u003ctd>R_q(2, 6) CS\u003c/td>\n\u003ctd>Subsumida(2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8\u003c/td>\n\u003ctd>{s}\u003c/td>\n\u003ctd>Rᵣ(7, 5) CS\u003c/td>\n\u003ctd>Subsumida(7)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9\u003c/td>\n\u003ctd>□\u003c/td>\n\u003ctd>Rₛ(3, 8) CS\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\u003cp>Se obtiene □ con un padre del CS en cada paso: el razonamiento es \u003cspan class=\"chip ok\">VÁLIDO\u003c/span>.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-5-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.5.4\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-5-4\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Cláusulas {p, q}, {¬p, r}; CS = {{¬r}}.\u003c/p>\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Nº\u003c/th>\n\u003cth>Cláusula\u003c/th>\n\u003cth>Origen\u003c/th>\n\u003cth>Notas\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>{p, q}\u003c/td>\n\u003ctd>Inicial\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>{¬p, r}\u003c/td>\n\u003ctd>Inicial\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>{¬r}\u003c/td>\n\u003ctd>CS\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>{¬p}\u003c/td>\n\u003ctd>Rᵣ(2, 3) CS\u003c/td>\n\u003ctd>Subsumida(2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>{q}\u003c/td>\n\u003ctd>Rₚ(1, 4) CS\u003c/td>\n\u003ctd>Subsumida(1)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\u003cp>{q} no tiene complementario y no hay más resolventes con un padre del CS. No aparece □ y la estrategia de conjunto soporte es completa: \u003cspan class=\"chip bad\">NO VÁLIDO\u003c/span>. Contraejemplo con DPLL sobre {{p, q}; {¬p, r}; {¬r}}: unitaria ¬r → {{p, q}; {¬p}} → unitaria ¬p → {{q}} → unitaria q → ∅. Es decir ν(p) = F, ν(q) = V, ν(r) = F: premisas V, conclusión F.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-5-5\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.5.5\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-5-5\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>La resolución actúa sobre un solo literal cada vez: Rₚ da {q, ¬q} y R_q da {p, ¬p}, ambas tautologías. Eliminar los dos pares a la vez sería incorrecto: {{p, q}; {¬p, ¬q}} es satisfacible (p = V, q = F), así que no puede producir □.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"s-4-6\">\u003ch3>\u003cspan class=\"tnum\">4.6\u003c/span>\u003cspan>Árboles semánticos\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-6-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.6.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-6-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Se lee ((p → q) ∧ (q → p)) → (p ↔ q).\u003c/p>\u003cul>\n\u003cli>Rama p (p := V): ((V → q) ∧ (q → V)) → (V ↔ q) ≡ (q ∧ V) → q ≡ q → q ≡ V. \u003cspan class=\"mark ok\">ÉXITO\u003c/span>.\u003c/li>\n\u003cli>Rama ¬p (p := F): ((F → q) ∧ (q → F)) → (F ↔ q) ≡ (V ∧ ¬q) → ¬q ≡ ¬q → ¬q ≡ V. \u003cspan class=\"mark ok\">ÉXITO\u003c/span>.\u003c/li>\n\u003c/ul>\u003cp>Todas las hojas son \u003cspan class=\"mark ok\">ÉXITO\u003c/span>: \u003cspan class=\"chip ok\">TAUTOLOGÍA\u003c/span>.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-6-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.6.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-6-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cul>\n\u003cli>Rama p: (V ∨ q) ∧ (V → ¬q) ∧ (q → r) ≡ ¬q ∧ (q → r).\u003cul>\n\u003cli>Rama q: ¬V ∧ … ≡ F. \u003cspan class=\"mark bad\">FALLO\u003c/span>.\u003c/li>\n\u003cli>Rama ¬q: V ∧ (F → r) ≡ V. \u003cspan class=\"mark ok\">ÉXITO\u003c/span> (p = V, q = F, r cualquiera).\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Rama ¬p: (F ∨ q) ∧ (F → ¬q) ∧ (q → r) ≡ q ∧ (q → r).\u003cul>\n\u003cli>Rama q: V ∧ (V → r) ≡ r.\u003cul>\n\u003cli>Rama r: V. \u003cspan class=\"mark ok\">ÉXITO\u003c/span> (p = F, q = V, r = V).\u003c/li>\n\u003cli>Rama ¬r: F. \u003cspan class=\"mark bad\">FALLO\u003c/span>.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Rama ¬q: F. \u003cspan class=\"mark bad\">FALLO\u003c/span>.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\u003cp>Hay \u003cspan class=\"mark ok\">ÉXITO\u003c/span> y \u003cspan class=\"mark bad\">FALLO\u003c/span>: satisfacible y falseable (contingente). Modelos (p, q, r): (V, F, V), (V, F, F) y (F, V, V).\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-6-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.6.3\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-6-3\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cul>\n\u003cli>Rama p: (V → q) ∧ (q → r) ∧ V ∧ ¬r ≡ q ∧ (q → r) ∧ ¬r.\u003cul>\n\u003cli>Rama q: (V → r) ∧ ¬r ≡ r ∧ ¬r ≡ F. \u003cspan class=\"mark bad\">FALLO\u003c/span>.\u003c/li>\n\u003cli>Rama ¬q: F. \u003cspan class=\"mark bad\">FALLO\u003c/span>.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Rama ¬p: … ∧ F ∧ … ≡ F. \u003cspan class=\"mark bad\">FALLO\u003c/span>.\u003c/li>\n\u003c/ul>\u003cp>Todas \u003cspan class=\"mark bad\">FALLO\u003c/span>: \u003cspan class=\"chip bad\">INSATISFACIBLE\u003c/span> (contradicción).\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"s-4-7\">\u003ch3>\u003cspan class=\"tnum\">4.7\u003c/span>\u003cspan>Tableaux semánticos\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-7-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.7.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-7-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cul>\n\u003cli>Raíz: (p ∨ q) ∧ ¬p ∧ (q → r). Dos α (conjunciones) → {p ∨ q, ¬p, q → r}.\u003cul>\n\u003cli>β p ∨ q, rama p: {p, ¬p, q → r} \u003cspan class=\"mark bad\">×\u003c/span>\u003c/li>\n\u003cli>β p ∨ q, rama q: {q, ¬p, q → r}\u003cul>\n\u003cli>β q → r, rama ¬q: {q, ¬q, ¬p} \u003cspan class=\"mark bad\">×\u003c/span>\u003c/li>\n\u003cli>β q → r, rama r: {q, ¬p, r} \u003cspan class=\"mark ok\">✓\u003c/span>\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\u003cp>Tableau abierto: \u003cspan class=\"chip ok\">SATISFACIBLE\u003c/span>, modelo ν(p) = F, ν(q) = V, ν(r) = V.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-7-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.7.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-7-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Se construye el tableau de ¬Φ: Φ es tautología si y sólo si el tableau de ¬Φ se cierra.\u003c/p>\u003cul>\n\u003cli>Raíz: ¬(((p → q) ∧ (q → r)) → (p → r)). α (negación de →) → {(p → q) ∧ (q → r), ¬(p → r)}.\u003c/li>\n\u003cli>α → {p → q, q → r, ¬(p → r)}; α ¬(p → r) → {p → q, q → r, p, ¬r}.\u003cul>\n\u003cli>β p → q, rama ¬p: {¬p, p, …} \u003cspan class=\"mark bad\">×\u003c/span>\u003c/li>\n\u003cli>β p → q, rama q: {q, q → r, p, ¬r}\u003cul>\n\u003cli>β q → r, rama ¬q: \u003cspan class=\"mark bad\">×\u003c/span>\u003c/li>\n\u003cli>β q → r, rama r: {r, ¬r, …} \u003cspan class=\"mark bad\">×\u003c/span>\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\u003cp>Todas las hojas cerradas: ¬Φ insatisfacible, luego \u003cspan class=\"chip ok\">Φ es tautología\u003c/span>.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-7-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.7.3\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-7-3\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Raíz: {p → q, r → s, p ∨ r, ¬q, ¬s} (premisas y conclusión negada).\u003c/p>\u003cul>\n\u003cli>β p → q, rama q: \u003cspan class=\"mark bad\">×\u003c/span> (con ¬q).\u003c/li>\n\u003cli>β p → q, rama ¬p:\u003cul>\n\u003cli>β r → s, rama s: \u003cspan class=\"mark bad\">×\u003c/span> (con ¬s).\u003c/li>\n\u003cli>β r → s, rama ¬r:\u003cul>\n\u003cli>β p ∨ r, rama p: \u003cspan class=\"mark bad\">×\u003c/span> (con ¬p).\u003c/li>\n\u003cli>β p ∨ r, rama r: \u003cspan class=\"mark bad\">×\u003c/span> (con ¬r).\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\u003cp>Tableau cerrado: \u003cspan class=\"chip ok\">VÁLIDO\u003c/span>.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-7-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.7.4\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-7-4\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Raíz: {p → (q ∨ r), ¬q, ¬¬p}. α ¬¬p → p.\u003c/p>\u003cul>\n\u003cli>β p → (q ∨ r), rama ¬p: \u003cspan class=\"mark bad\">×\u003c/span> (con p).\u003c/li>\n\u003cli>β p → (q ∨ r), rama q ∨ r:\u003cul>\n\u003cli>β, rama q: \u003cspan class=\"mark bad\">×\u003c/span> (con ¬q).\u003c/li>\n\u003cli>β, rama r: {r, ¬q, p} \u003cspan class=\"mark ok\">✓\u003c/span>\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\u003cp>Hoja abierta: \u003cspan class=\"chip bad\">NO VÁLIDO\u003c/span>. Contraejemplo ν(p) = V, ν(q) = F, ν(r) = V: p → (q ∨ r) = V, ¬q = V, pero ¬p = F.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic integ\" id=\"s-4-8\">\u003ch3>\u003cspan class=\"tnum\">4.8\u003c/span>\u003cspan>Integradores\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-8-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.8.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\
