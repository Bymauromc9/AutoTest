/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"1\" id=\"e-1-3-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 1.3.4\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-1-3-4\">\u003cinput data-key=\"1.3.4\" id=\"d-1-3-4\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-1-3-4\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Indica a cuál de los 4 componentes de la lógica clásica (lenguaje formal, formalización, semántica, sistema de demostración) pertenece cada tarea:\u003c/p>\u003col>\n\u003cli>Decidir si (p ∧ q) → ¬r es una fórmula bien formada.\u003c/li>\n\u003cli>Traducir «si llueve, me mojo» a p → q.\u003c/li>\n\u003cli>Calcular el valor de p ∧ ¬q con ν(p) = V, ν(q) = F.\u003c/li>\n\u003cli>Sustituir p → q por ¬p ∨ q dentro de una demostración.\u003c/li>\n\u003cli>Obtener q a partir de p → q y p.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"1\" id=\"e-1-3-5\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 1.3.5\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-1-3-5\">\u003cinput data-key=\"1.3.5\" id=\"d-1-3-5\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-1-3-5\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Verdadero o falso. Justifica.\u003c/p>\u003col>\n\u003cli>La lógica es la ciencia formal que estudia los razonamientos verdaderos.\u003c/li>\n\u003cli>Una lógica es un cálculo al que se le da una interpretación.\u003c/li>\n\u003cli>Las equivalencias y las implicaciones lógicas del sistema de demostración son tautologías.\u003c/li>\n\u003cli>En la lógica proposicional, los elementos más simples son los predicados.\u003c/li>\n\u003cli>Boole formuló la lógica como un lenguaje matemático algebraico.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic integ\" id=\"t-1-4\">\u003ch3>\u003cspan class=\"tnum\">1.4\u003c/span>\u003cspan>Ejercicios integradores del Tema 1\u003c/span>\u003cspan class=\"tag\">Combina todo el tema\u003c/span>\u003c/h3>\u003carticle class=\"card ex\" data-tema=\"1\" id=\"e-1-4-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 1.4.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-1-4-1\">\u003cinput data-key=\"1.4.1\" id=\"d-1-4-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-1-4-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Dado el texto: «¿Has entregado la práctica? Si entregas la práctica, apruebas. ¡Entrégala hoy! Luis ha entregado la práctica. Por tanto, Luis aprueba.»\u003c/p>\u003col>\n\u003cli>Señala qué oraciones son proposiciones y cuáles no.\u003c/li>\n\u003cli>Define un diccionario correcto (átomos afirmativos) para las proposiciones.\u003c/li>\n\u003cli>Formaliza las proposiciones y el razonamiento.\u003c/li>\n\u003cli>Indica qué componente de la lógica clásica has usado en cada uno de los pasos 2 y 3.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"1\" id=\"e-1-4-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 1.4.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-1-4-2\">\u003cinput data-key=\"1.4.2\" id=\"d-1-4-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-1-4-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>En el cálculo de juguete del apartado 1.1, partiendo de A″ X B′:\u003c/p>\u003col>\n\u003cli>Obtén una expresión en la que la B vaya primero y la A tenga un apóstrofe.\u003c/li>\n\u003cli>Interpreta (con la interpretación de 1.1.5) la expresión inicial y la final.\u003c/li>\n\u003cli>¿La derivación sigue siendo correcta si cambias la interpretación (por ejemplo, X = conocer)? ¿Qué parte depende de la interpretación y qué parte no?\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"1\" id=\"e-1-4-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 1.4.3\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-1-4-3\">\u003cinput data-key=\"1.4.3\" id=\"d-1-4-3\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-1-4-3\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Clasifica cada procedimiento como método semántico (interpretativo) o sintáctico (axiomático/deductivo) y relaciónalo con el principio en que se apoya (la verdad de los hechos o la estructura del lenguaje):\u003c/p>\u003col>\n\u003cli>Hacer la tabla de verdad de una fórmula.\u003c/li>\n\u003cli>Aplicar modus ponens a dos premisas.\u003c/li>\n\u003cli>Buscar una interpretación que haga falsa una implicación.\u003c/li>\n\u003cli>Reescribir una fórmula con las leyes de De Morgan.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"1\" id=\"e-1-4-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 1.4.4\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-1-4-4\">\u003cinput data-key=\"1.4.4\" id=\"d-1-4-4\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-1-4-4\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Formaliza «Hoy es lunes o no es lunes, y no es posible que hoy sea lunes y no lo sea». Indica qué dos principios aparecen y por qué la fórmula resultante es siempre verdadera en lógica bivalente.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003c/section>\u003csection class=\"tema exs\" id=\"tema-2\">\u003cheader class=\"tema-head\">\u003cp class=\"eyebrow\">Tema 2\u003c/p>\u003ch2>Lógica proposicional (L0)\u003c/h2>\u003cp class=\"lede\">Siete tópicos: sintaxis, formalización, evaluación, tablas de verdad y clasificación, satisfacibilidad de conjuntos, equivalencia lógica y consecuencia lógica.\u003c/p>\u003c/header>\u003csection class=\"topic\" id=\"t-2-1\">\u003ch3>\u003cspan class=\"tnum\">2.1\u003c/span>\u003cspan>Sintaxis: fbf, prioridad y árbol sintáctico\u003c/span>\u003c/h3>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-1-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.1.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-1-1\">\u003cinput data-key=\"2.1.1\" id=\"d-2-1-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-1-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Indica cuáles son fórmulas bien formadas. Si no lo son, explica por qué.\u003c/p>\u003col>\n\u003cli>¬(p ∧ q) → r\u003c/li>\n\u003cli>(p ∨ ) q\u003c/li>\n\u003cli>p ¬∧ q\u003c/li>\n\u003cli>¬¬p ↔ (q ∨ ¬r)\u003c/li>\n\u003cli>(p → (q ∧ r)\u003c/li>\n\u003cli>p ∧ ¬(q → r) ∨ s\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-1-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.1.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-1-2\">\u003cinput data-key=\"2.1.2\" id=\"d-2-1-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-1-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Para cada fórmula: pon todos los paréntesis según la prioridad de la asignatura, indica la conectiva principal y cuenta las conectivas (columnas «extra» de su tabla).\u003c/p>\u003col>\n\u003cli>¬p ∨ q ∧ r → s\u003c/li>\n\u003cli>p → q ↔ ¬r ∨ s\u003c/li>\n\u003cli>p → q → r ∧ ¬p\u003c/li>\n\u003cli>¬(p ∧ q) ∨ ¬r ↔ p\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-1-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.1.3\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-1-3\">\u003cinput data-key=\"2.1.3\" id=\"d-2-1-3\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-1-3\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Clasifica cada expresión como literal, cláusula, ambas o ninguna: p; ¬q; p ∨ ¬q ∨ r; ¬(p ∨ q); p ∧ q; ¬¬p.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-1-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.1.4\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-1-4\">\u003cinput data-key=\"2.1.4\" id=\"d-2-1-4\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-1-4\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Dibuja el árbol sintáctico de ¬(p → q) ∨ r ↔ q ∧ ¬s.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"t-2-2\">\u003ch3>\u003cspan class=\"tnum\">2.2\u003c/span>\u003cspan>Formalización del lenguaje natural\u003c/span>\u003c/h3>\u003cp class=\"topic-note\">Diccionario para 2.2.1 y 2.2.2: p: «llueve»; q: «hace frío»; r: «salgo a correr»; s: «me quedo en casa».\u003c/p>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-2-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.2.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-2-1\">\u003cinput data-key=\"2.2.1\" id=\"d-2-2-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-2-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Formaliza:\u003c/p>\u003col>\n\u003cli>Llueve pero no hace frío.\u003c/li>\n\u003cli>Ni llueve ni hace frío.\u003c/li>\n\u003cli>Salgo a correr sólo si no llueve.\u003c/li>\n\u003cli>Que no llueva es condición necesaria para salir a correr.\u003c/li>\n\u003cli>Me quedo en casa si llueve.\u003c/li>\n\u003cli>Salgo a correr a menos que llueva.\u003c/li>\n\u003cli>O salgo a correr o me quedo en casa, pero no ambas cosas.\u003c/li>\n\u003cli>Si llueve y hace frío, me quedo en casa y no salgo a correr.\u003c/li>\n\u003cli>Salgo a correr si y sólo si no llueve ni hace frío.\u003c/li>\n\u003cli>No es cierto que, si hace frío, me quede en casa.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-2-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.2.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-2-2\">\u003cinput data-key=\"2.2.2\" id=\"d-2-2-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-2-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Traduce al castellano: a) ¬(p ∨ q); b) s → p ∨ q; c) ¬r ↔ s; d) (p → s) ∧ (¬p → r).\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-2-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.2.3\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-2-3\">\u003cinput data-key=\"2.2.3\" id=\"d-2-2-3\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-2-3\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Un compañero ha formalizado estas frases. Detecta el error y corrígelo.\u003c/p>\u003col>\n\u003cli>«Apruebo sólo si estudio» (a: apruebo, e: estudio) → e → a\u003c/li>\n\u003cli>«Tener batería es condición necesaria para que el móvil encienda» (b: tiene batería, m: el móvil enciende) → b → m\u003c/li>\n\u003cli>«Iré a la fiesta a menos que llueva» (f: voy a la fiesta, l: llueve) → f → ¬l\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-2-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.2.4\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-2-4\">\u003cinput data-key=\"2.2.4\" id=\"d-2-2-4\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-2-4\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Formaliza el razonamiento (sólo formalizar; la validez se estudia en 2.8): «Si el servidor está caído, la web no carga. Si la web no carga, los clientes llaman a soporte. Los clientes no han llamado a soporte. Por tanto, el servidor no está caído.» Usa s: «el servidor está caído»; w: «la web carga»; c: «los clientes llaman a soporte».\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"t-2-3\">\u003ch3>\u003cspan class=\"tnum\">2.3\u003c/span>\u003cspan>Semántica: interpretación y evaluación\u003c/span>\u003c/h3>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-3-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.3.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-3-1\">\u003cinput data-key=\"2.3.1\" id=\"d-2-3-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-3-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Con la interpretación ν(p) = V, ν(q) = F, ν(r) = F, evalúa de dentro afuera:\u003c/p>\u003col>\n\u003cli>¬p ∨ q → r\u003c/li>\n\u003cli>p → q → r\u003c/li>\n\u003cli>¬(p ↔ q) ∧ (r ∨ ¬p)\u003c/li>\n\u003cli>(p ∧ q) ∨ (¬r ↔ q)\u003c/li>\n\u003cli>¬(p ∨ r) ↔ q ∧ ¬p\u003c/li>\n\u003cli>p ∧ ¬q → r\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-3-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.3.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-3-2\">\u003cinput data-key=\"2.3.2\" id=\"d-2-3-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-3-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Encuentra todas las interpretaciones en las que p → q → r y p → (q → r) toman valores distintos. ¿Qué conclusión sacas sobre la asociatividad de →?\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-3-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.3.3\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-3-3\">\u003cinput data-key=\"2.3.3\" id=\"d-2-3-3\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-3-3\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Halla los valores de los átomos en cada caso:\u003c/p>\u003col>\n\u003cli>Sabemos que (p ∧ q) → r es FALSA.\u003c/li>\n\u003cli>Sabemos que ¬p ∨ (q ↔ r) es FALSA y que r es VERDADERA.\u003c/li>\n\u003cli>Sabemos que p → q es VERDADERA y q es FALSA.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-3-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.3.4\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-3-4\">\u003cinput data-key=\"2.3.4\" id=\"d-2-3-4\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-3-4\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>«Si apruebo el parcial, me invito a cenar.» ¿En qué situaciones he incumplido la frase? Razona con la tabla de →.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"t-2-4\">\u003ch3>\u003cspan class=\"tnum\">2.4\u003c/span>\u003cspan>Tablas de verdad y clasificación de fbf\u003c/span>\u003c/h3>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-4-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.4.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-4-1\">\u003cinput data-key=\"2.4.1\" id=\"d-2-4-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-4-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Haz la tabla de verdad y clasifica cada fbf (satisfacible, contingente, falseable, tautología, contradicción):\u003c/p>\u003col>\n\u003cli>(p → q) ∧ (p ∧ ¬q)\u003c/li>\n\u003cli>(p → q) ∨ (q → p)\u003c/li>\n\u003cli>¬(p ∨ q) ↔ (¬p ∧ q)\u003c/li>\n\u003cli>(p ∨ q) ∧ ¬r → p\u003c/li>\n\u003cli>(p → (q → r)) → ((p → q) → (p → r))\u003c/li>\n\u003cli>(p ↔ q) ∧ (q ↔ ¬p)\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-4-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.4.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-4-2\">\u003cinput data-key=\"2.4.2\" id=\"d-2-4-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-4-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Sin hacerlas, indica cuántas filas y cuántas columnas tendrían las tablas de: a) ¬(p ∧ q) ∨ (r → ¬s); b) (p → q) ↔ ¬p.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-4-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.4.3\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-4-3\">\u003cinput data-key=\"2.4.3\" id=\"d-2-4-3\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-4-3\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Sin hacer la tabla completa, decide si ((p → q) ∧ (r → s) ∧ (p ∨ r)) → (q ∨ s) es tautología. Pista: busca una fila que la haga falsa.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-4-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.4.4\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-4-4\">\u003cinput data-key=\"2.4.4\" id=\"d-2-4-4\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-4-4\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Verdadero o falso. Justifica.\u003c/p>\u003col>\n\u003cli>Si α es contingente, ¬α también es contingente.\u003c/li>\n\u003cli>Si α es satisfacible, ¬α es insatisfacible.\u003c/li>\n\u003cli>Toda fbf falseable es una contradicción.\u003c/li>\n\u003cli>Si α es tautología, α no es falseable.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"t-2-5\">\u003ch3>\u003cspan class=\"tnum\">2.5\u003c/span>\u003cspan>Satisfacibilidad de conjuntos de fbf\u003c/span>\u003c/h3>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-5-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.5.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-5-1\">\u003cinput data-key=\"2.5.1\" id=\"d-2-5-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-5-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Decide si cada conjunto es satisfacible y da todos sus modelos:\u003c/p>\u003col>\n\u003cli>Γ₁ = {p → q, q → r, p, ¬r}\u003c/li>\n\u003cli>Γ₂ = {p ∨ q, ¬p ∨ r, ¬q ∨ r, ¬r ∨ p}\u003c/li>\n\u003cli>Γ₃ = {p ↔ q, q ↔ r, p ↔ ¬r}\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-5-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.5.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-5-2\">\u003cinput data-key=\"2.5.2\" id=\"d-2-5-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-5-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Sea Γ = {p ∨ q, ¬p}.\u003c/p>\u003col>\n\u003cli>Da sus modelos.\u003c/li>\n\u003cli>¿Qué pasa si añadimos ¬q?\u003c/li>\n\u003cli>¿Y si en lugar de ¬q añadimos p ∨ ¬p?\u003c/li>\n\u003cli>Al conjunto del apartado 2 le quitamos ¬p. ¿Es satisfacible?\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-5-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.5.3\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-5-3\">\u003cinput data-key=\"2.5.3\" id=\"d-2-5-3\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-5-3\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Verdadero o falso. Justifica con un ejemplo.\u003c/p>\u003col>\n\u003cli>Un conjunto formado sólo por fbf satisfacibles es satisfacible.\u003c/li>\n\u003cli>Si un conjunto contiene una contradicción, es insatisfacible.\u003c/li>\n\u003cli>Añadir una tautología a un conjunto insatisfacible lo vuelve satisfacible.\u003c/li>\n\u003cli>El conjunto vacío es satisfacible.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"t-2-6\">\u003ch3>\u003cspan class=\"tnum\">2.6\u003c/span>\u003cspan>Equivalencia lógica\u003c/span>\u003c/h3>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-6-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.6.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-6-1\">\u003cinput data-key=\"2.6.1\" id=\"d-2-6-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-6-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Demuestra aplicando equivalencias (indica la ley en cada paso):\u003c/p>\u003col>\n\u003cli>¬(p → q) ≡ p ∧ ¬q\u003c/li>\n\u003cli>p → (q → r) ≡ q → (p → r)\u003c/li>\n\u003cli>(p → r) ∧ (q → r) ≡ (p ∨ q) → r\u003c/li>\n\u003cli>¬(p ∨ (¬p ∧ q)) ≡ ¬p ∧ ¬q\u003c/li>\n\u003cli>(p → q) ∧ (p → ¬q) ≡ ¬p\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-6-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.6.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-6-2\">\u003cinput data-key=\"2.6.2\" id=\"d-2-6-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-6-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>¿Son correctas? Si lo son, demuéstralo; si no, da un contraejemplo.\u003c/p>\u003col>\n\u003cli>(p ∨ q) → r ≡ (p → r) ∨ (q → r)\u003c/li>\n\u003cli>p → (q ∧ r) ≡ (p → q) ∧ (p → r)\u003c/li>\n\u003cli>¬(p ↔ q) ≡ ¬p ↔ ¬q\u003c/li>\n\u003cli>¬(p ↔ q) ≡ p ↔ ¬q\u003c/li>\n\u003cli>(p ∧ q) → r ≡ (p → r) ∧ (q → r)\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-6-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.6.3\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-6-3\">\u003cinput data-key=\"2.6.3\" id=\"d-2-6-3\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-6-3\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Reescribe usando sólo ¬ y ∨: a) p ∧ q; b) p ↔ q; c) p → (q ∧ r).\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-6-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.6.4\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-6-4\">\u003cinput data-key=\"2.6.4\" id=\"d-2-6-4\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-6-4\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Simplifica al máximo: a) ¬(¬p ∧ q) ∧ (p ∨ q); b) (p ∧ q) ∨ (p ∧ ¬q) ∨ (¬p ∧ q).\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"t-2-7\">\u003ch3>\u003cspan class=\"tnum\">2.7\u003c/span>\u003cspan>Implicación lógica y consecuencia lógica\u003c/span>\u003c/h3>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-7-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.7.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-7-1\">\u003cinput data-key=\"2.7.1\" id=\"d-2-7-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-7-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Indica qué regla de inferencia es cada esquema, o si es una falacia (y cuál):\u003c/p>\u003col>\n\u003cli>{p → q, ¬q} ⊨ ¬p\u003c/li>\n\u003cli>{p ∨ q, ¬q} ⊨ p\u003c/li>\n\u003cli>{p → q, q} ⊨ p\u003c/li>\n\u003cli>{p → q, ¬p} ⊨ ¬q\u003c/li>\n\u003cli>{p ∧ q} ⊨ q\u003c/li>\n\u003cli>{p → q, ¬p → q} ⊨ q\u003c/li>\n\u003cli>{p, ¬p} ⊨ r\u003c/li>\n\u003cli>{p → q, q → p} ⊨ p ↔ q\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-7-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.7.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-7-2\">\u003cinput data-key=\"2.7.2\" id=\"d-2-7-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-7-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Decide si son válidos (tabla o búsqueda de contraejemplo). Si no lo son, da todos los contraejemplos.\u003c/p>\u003col>\n\u003cli>{p → q, q → r} ⊨ r → p\u003c/li>\n\u003cli>{p ∨ q, p → r, q → r} ⊨ r\u003c/li>\n\u003cli>{p → (q ∨ r), ¬q, ¬r} ⊨ ¬p\u003c/li>\n\u003cli>{(p ∧ q) → r, ¬r} ⊨ ¬p\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-7-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.7.3\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-7-3\">\u003cinput data-key=\"2.7.3\" id=\"d-2-7-3\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-7-3\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Comprueba {p ↔ q, q} ⊨ p con los dos planteamientos: directo (tautología) y refutación (contradicción).\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-7-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.7.4\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-7-4\">\u003cinput data-key=\"2.7.4\" id=\"d-2-7-4\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-7-4\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Verdadero o falso. Justifica.\u003c/p>\u003col>\n\u003cli>Si las premisas son insatisfacibles, el razonamiento es válido.\u003c/li>\n\u003cli>Si {α} ⊨ β y {β} ⊨ α, entonces α ≡ β.\u003c/li>\n\u003cli>Si CP ⊨ β, al añadir premisas a CP la conclusión puede dejar de seguirse.\u003c/li>\n\u003cli>⊨ β significa que β es una tautología.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic integ\" id=\"t-2-8\">\u003ch3>\u003cspan class=\"tnum\">2.8\u003c/span>\u003cspan>Ejercicios integradores del Tema 2\u003c/span>\u003cspan class=\"tag\">Combina todo el tema\u003c/span>\u003c/h3>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-8-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.8.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-8-1\">\u003cinput data-key=\"2.8.1\" id=\"d-2-8-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-8-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>«Si el sensor detecta humo, suena la alarma. La alarma suena sólo si hay corriente. No hay corriente. Por tanto, el sensor no detecta humo.» a) Formaliza (h, a, c). b) Comprueba la validez con la tabla de verdad del planteamiento directo. c) Indica qué reglas de inferencia justifican el razonamiento.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-8-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.8.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-8-2\">\u003cinput data-key=\"2.8.2\" id=\"d-2-8-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-8-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Sea α = (p → q) ∧ (¬p → r). a) Haz su tabla y clasifícala. b) Demuestra por equivalencias que α ≡ (¬p ∨ q) ∧ (p ∨ r). c) ¿Es q ∨ r consecuencia lógica de α? Justifica con la tabla del apartado a.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-8-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.8.3\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-8-3\">\u003cinput data-key=\"2.8.3\" id=\"d-2-8-3\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-8-3\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Sea Γ = {p → q ∨ r, ¬q, p}. a) Halla sus modelos. b) ¿Γ ⊨ r? c) ¿Es satisfacible Γ ∪ {¬r}? d) Explica la relación entre b y c.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-8-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.8.4\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-8-4\">\u003cinput data-key=\"2.8.4\" id=\"d-2-8-4\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-8-4\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>a) Demuestra, sin tabla completa, que (p → q) ↔ (¬q → ¬p) es tautología. b) Con d: «es domingo», c: «la biblioteca cierra», ¿cuáles de estas frases son equivalentes a «si es domingo, la biblioteca cierra»? (i) «Si la biblioteca no cierra, no es domingo»; (ii) «Si la biblioteca cierra, es domingo»; (iii) «No es domingo o la biblioteca cierra».\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-8-5\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.8.5\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-8-5\">\u003cinput data-key=\"2.8.5\" id=\"d-2-8-5\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-8-5\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>En una isla cada persona dice siempre la verdad o miente siempre. Ana dice: «Benito miente». Benito dice: «Carla miente». Carla dice: «Ana y Benito mienten». Con a, b, c = «Ana / Benito / Carla dice la verdad»: a) formaliza las tres afirmaciones (cada persona dice la verdad si y sólo si lo que dice es cierto); b) halla los modelos del conjunto; c) ¿quién dice la verdad?\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"2\" id=\"e-2-8-6\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 2.8.6\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-2-8-6\">\u003cinput data-key=\"2.8.6\" id=\"d-2-8-6\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-2-8-6\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Retoma la formalización de 2.2.4. a) Decide si el razonamiento es válido. b) Si lo es, nombra las reglas que lo justifican; si no, da un contraejemplo. c) Reescribe la primera premisa usando la contraposición.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003c/section>\u003csection class=\"tema exs\" id=\"tema-3\">\u003cheader class=\"tema-head\">\u003cp class=\"eyebrow\">Tema 3\u003c/p>\u003ch2>Razonamientos\u003c/h2>\u003cp class=\"lede\">Cuatro tópicos: validez semántica (directo y refutación), demostraciones en deducción natural, teorema de la deducción sintáctica y propiedades del sistema (solidez, completitud, teorías, consistencia y decidibilidad).\u003c/p>\u003c/header>\u003csection class=\"topic\" id=\"t-3-1\">\u003ch3>\u003cspan class=\"tnum\">3.1\u003c/span>\u003cspan>Razonamiento válido: planteamiento directo y por refutación\u003c/span>\u003c/h3>\u003carticle class=\"card ex\" data-tema=\"3\" id=\"e-3-1-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 3.1.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-3-1-1\">\u003cinput data-key=\"3.1.1\" id=\"d-3-1-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-3-1-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Para {p → q, ¬q ∨ r} ⊨ p → r: a) escribe la fórmula del planteamiento directo y la del planteamiento por refutación; b) decide la validez con una tabla de verdad que tenga ambas columnas.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"3\" id=\"e-3-1-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 3.1.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-3-1-2\">\u003cinput data-key=\"3.1.2\" id=\"d-3-1-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-3-1-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Para {p ∨ q, p → r} ⊨ r: a) decide si es válido; b) si no lo es, da el contraejemplo y comprueba que en esa fila la fórmula directa vale F y la de refutación vale V.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"3\" id=\"e-3-1-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 3.1.3\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-3-1-3\">\u003cinput data-key=\"3.1.3\" id=\"d-3-1-3\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-3-1-3\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Verdadero o falso. Justifica.\u003c/p>\u003col>\n\u003cli>Si un razonamiento es válido, sus premisas son verdaderas.\u003c/li>\n\u003cli>Un razonamiento cuya conclusión es una tautología siempre es válido.\u003c/li>\n\u003cli>Si la conclusión es una contradicción, el razonamiento nunca es válido.\u003c/li>\n\u003cli>En un razonamiento válido, la conclusión puede ser falsa en alguna interpretación.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"t-3-2\">\u003ch3>\u003cspan class=\"tnum\">3.2\u003c/span>\u003cspan>Sistema deductivo: demostraciones en deducción natural\u003c/span>\u003c/h3>\u003cp class=\"topic-note\">En cada línea indica «Premisa» o la regla y las líneas usadas, por ejemplo MT(4,3) o De Morgan(2).\u003c/p>\u003carticle class=\"card ex\" data-tema=\"3\" id=\"e-3-2-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 3.2.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-3-2-1\">\u003cinput data-key=\"3.2.1\" id=\"d-3-2-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-3-2-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Completa las justificaciones de esta demostración de {p ∧ q, p → r, q → s} ⊢ r ∧ s:\u003c/p>\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Nº\u003c/th>\n\u003cth>Fórmula\u003c/th>\n\u003cth>Justificación\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>p ∧ q\u003c/td>\n\u003ctd>Premisa\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>p → r\u003c/td>\n\u003ctd>Premisa\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>q → s\u003c/td>\n\u003ctd>Premisa\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>p\u003c/td>\n\u003ctd>?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>q\u003c/td>\n\u003ctd>?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>r\u003c/td>\n\u003ctd>?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>s\u003c/td>\n\u003ctd>?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8\u003c/td>\n\u003ctd>r ∧ s\u003c/td>\n\u003ctd>?\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"3\" id=\"e-3-2-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 3.2.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-3-2-2\">\u003cinput data-key=\"3.2.2\" id=\"d-3-2-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-3-2-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Demuestra:\u003c/p>\u003col>\n\u003cli>{p → q, ¬q, p ∨ r} ⊢ r\u003c/li>\n\u003cli>{p ∨ q, ¬p ∨ r, ¬r} ⊢ q\u003c/li>\n\u003cli>{(p ∧ q) → r, p, q} ⊢ r\u003c/li>\n\u003cli>{p → q, r → s, p ∨ r, ¬q} ⊢ s\u003c/li>\n\u003cli>{¬(p ∧ ¬q), ¬q} ⊢ ¬p (necesitas una equivalencia)\u003c/li>\n\u003cli>{p ↔ q, ¬q} ⊢ ¬p\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"3\" id=\"e-3-2-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 3.2.3\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-3-2-3\">\u003cinput data-key=\"3.2.3\" id=\"d-3-2-3\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-3-2-3\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Cada «demostración» tiene un paso incorrecto. Localízalo, di qué falacia o error es y da un contraejemplo que muestre que la conclusión no se sigue.\u003c/p>\u003col>\n\u003cli>{p → q, q} ⊢ p: «1. p → q Premisa; 2. q Premisa; 3. p MP(1,2)».\u003c/li>\n\u003cli>{p ∨ q, p} ⊢ ¬q: «1. p ∨ q Premisa; 2. p Premisa; 3. ¬q SD(1,2)».\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"t-3-3\">\u003ch3>\u003cspan class=\"tnum\">3.3\u003c/span>\u003cspan>Teorema de la deducción sintáctica\u003c/span>\u003c/h3>\u003carticle class=\"card ex\" data-tema=\"3\" id=\"e-3-3-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 3.3.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-3-3-1\">\u003cinput data-key=\"3.3.1\" id=\"d-3-3-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-3-3-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Demuestra {p → (q → r)} ⊢ q → (p → r) usando el teorema de la deducción (supuestos).\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"3\" id=\"e-3-3-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 3.3.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-3-3-2\">\u003cinput data-key=\"3.3.2\" id=\"d-3-3-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-3-3-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Demuestra {¬q → ¬p} ⊢ p → q suponiendo p.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"3\" id=\"e-3-3-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 3.3.3\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-3-3-3\">\u003cinput data-key=\"3.3.3\" id=\"d-3-3-3\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-3-3-3\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Aplicando el teorema de la deducción tantas veces como haga falta, reescribe sin premisas (de la forma ⊢ β) el razonamiento {p, p → q} ⊢ q. Pon todos los paréntesis: recuerda que en la asignatura → se agrupa de izquierda a derecha.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"t-3-4\">\u003ch3>\u003cspan class=\"tnum\">3.4\u003c/span>\u003cspan>Solidez, completitud, teorías, consistencia y decidibilidad\u003c/span>\u003c/h3>\u003carticle class=\"card ex\" data-tema=\"3\" id=\"e-3-4-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 3.4.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-3-4-1\">\u003cinput data-key=\"3.4.1\" id=\"d-3-4-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-3-4-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Asocia cada definición con su concepto (sólido, completo, teoría, consistente, decidible, semidecidible):\u003c/p>\u003col>\n\u003cli>Todo lo que se demuestra con el sistema es semánticamente válido.\u003c/li>\n\u003cli>Todo razonamiento válido se puede demostrar con el sistema.\u003c/li>\n\u003cli>Conjunto de fórmulas cerrado bajo demostraciones.\u003c/li>\n\u003cli>No se pueden demostrar a la vez β y ¬β.\u003c/li>\n\u003cli>Hay procedimiento para determinar la inconsistencia, pero sólo a veces la consistencia.\u003c/li>\n\u003cli>Hay procedimientos para determinar la inconsistencia y la consistencia.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"3\" id=\"e-3-4-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 3.4.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-3-4-2\">\u003cinput data-key=\"3.4.2\" id=\"d-3-4-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-3-4-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Verdadero o falso. Justifica.\u003c/p>\u003col>\n\u003cli>En un sistema sólido, todo teorema es una tautología.\u003c/li>\n\u003cli>En un sistema completo, todo teorema es una tautología.\u003c/li>\n\u003cli>La deducción natural es sólida pero no completa.\u003c/li>\n\u003cli>La lógica proposicional L0 es semidecidible.\u003c/li>\n\u003cli>La lógica de predicados L1 es decidible.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"3\" id=\"e-3-4-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 3.4.3\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-3-4-3\">\u003cinput data-key=\"3.4.3\" id=\"d-3-4-3\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-3-4-3\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Considera dos sistemas deductivos sin axiomas:\u003c/p>\u003cul>\n\u003cli>S₁: su única regla es «de α → β y β, derivar α».\u003c/li>\n\u003cli>S₂: su única regla es modus ponens.\u003c/li>\n\u003c/ul>\u003cp>a) ¿Es S₁ sólido? b) ¿Es S₂ sólido? c) ¿Es S₂ completo? Pista para c: piensa en {p} ⊨ p ∨ q.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"3\" id=\"e-3-4-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 3.4.4\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-3-4-4\">\u003cinput data-key=\"3.4.4\" id=\"d-3-4-4\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-3-4-4\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Sea la teoría axiomatizada por ℱ = {p, p → q, q → ¬p}. ¿Es consistente? Justifícalo con una derivación.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic integ\" id=\"t-3-5\">\u003ch3>\u003cspan class=\"tnum\">3.5\u003c/span>\u003cspan>Ejercicios integradores del Tema 3\u003c/span>\u003cspan class=\"tag\">Combina todo el tema\u003c/span>\u003c/h3>\u003carticle class=\"card ex\" data-tema=\"3\" id=\"e-3-5-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 3.5.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-3-5-1\">\u003cinput data-key=\"3.5.1\" id=\"d-3-5-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-3-5-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>«Si el programa compila, se ejecutan los tests. Si se ejecutan los tests y pasan, se despliega. Los tests pasan. El programa compila. Por tanto, se despliega.»\u003c/p>\u003col>\n\u003cli>Formaliza (c: compila; t: se ejecutan los tests; a: los tests pasan; d: se despliega).\u003c/li>\n\u003cli>Demuéstralo en deducción natural.\u003c/li>\n\u003cli>Comprueba la validez semántica por refutación, buscando una interpretación que haga V las premisas y F la conclusión.\u003c/li>\n\u003cli>¿Qué propiedad del sistema garantiza que el resultado del apartado 2 implica el del apartado 3?\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"3\" id=\"e-3-5-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 3.5.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-3-5-2\">\u003cinput data-key=\"3.5.2\" id=\"d-3-5-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-3-5-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>«Si llueve, la calle está mojada. La calle está mojada. Por tanto, llueve.» a) Formaliza (l, m). b) Da un contraejemplo. c) Explica por qué, en un sistema sólido, no puede existir una demostración de este razonamiento.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"3\" id=\"e-3-5-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 3.5.3\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-3-5-3\">\u003cinput data-key=\"3.5.3\" id=\"d-3-5-3\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-3-5-3\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Para {p → q, q → r} ⊨ ¬r → ¬p: a) demuéstralo por deducción natural; b) compruébalo semánticamente sin tabla completa (busca el contraejemplo y llega a contradicción).\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"3\" id=\"e-3-5-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 3.5.4\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-3-5-4\">\u003cinput data-key=\"3.5.4\" id=\"d-3-5-4\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-3-5-4\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Sea ℱ = {p ∨ q, ¬p, q → r, ¬r}. a) Deriva una contradicción desde ℱ. b) Comprueba con una tabla que ℱ es insatisfacible. c) Relaciona inconsistencia (sintáctica) e insatisfacibilidad (semántica) usando solidez y completitud.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003c/section>\u003csection class=\"tema exs\" id=\"tema-4\">\u003cheader class=\"tema-head\">\u003cp class=\"eyebrow\">Tema 4\u003c/p>\u003ch2>Problema SAT en L0\u003c/h2>\u003cp class=\"lede\">Siete tópicos: problema SAT y técnicas, FNC, propagación de literales, DPLL, resolución, árboles semánticos y tableaux semánticos.\u003c/p>\u003c/header>\u003csection class=\"topic\" id=\"t-4-1\">\u003ch3>\u003cspan class=\"tnum\">4.1\u003c/span>\u003cspan>El problema SAT, complejidad y clasificación de técnicas\u003c/span>\u003c/h3>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-1-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.1.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-1-1\">\u003cinput data-key=\"4.1.1\" id=\"d-4-1-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-1-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Verdadero o falso. Justifica.\u003c/p>\u003col>\n\u003cli>SAT fue el primer problema demostrado NP-completo (Cook, 1971).\u003c/li>\n\u003cli>Ordenar un vector es un problema NP-completo.\u003c/li>\n\u003cli>En L0, SAT y UNSAT son decidibles.\u003c/li>\n\u003cli>GSAT y WalkSat son algoritmos completos.\u003c/li>\n\u003cli>Si un algoritmo completo devuelve una interpretación, esa interpretación es un modelo.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-1-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.1.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-1-2\">\u003cinput data-key=\"4.1.2\" id=\"d-4-1-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-1-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Clasifica las técnicas (tablas de verdad, DPLL, resolución, árboles semánticos, tableaux) según: a) si necesitan forma clausal; b) si pueden dar modelos; c) si sirven para decidir directamente que una fórmula es tautología.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"t-4-2\">\u003ch3>\u003cspan class=\"tnum\">4.2\u003c/span>\u003cspan>Forma Normal Conjuntiva (FNC) y forma clausal\u003c/span>\u003c/h3>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-2-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.2.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-2-1\">\u003cinput data-key=\"4.2.1\" id=\"d-4-2-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-2-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Obtén la FNC y la forma clausal, indicando la equivalencia de cada paso. Di si cada fórmula es tautología.\u003c/p>\u003col>\n\u003cli>(p → q) → r\u003c/li>\n\u003cli>p ↔ (q ∧ r)\u003c/li>\n\u003cli>¬(p ∨ q) ∨ (r ∧ ¬p)\u003c/li>\n\u003cli>(p ∧ q) ∨ (¬p ∧ ¬q) → ¬r\u003c/li>\n\u003cli>(p → q) ∨ (q → p)\u003c/li>\n\u003cli>¬((p → q) ∧ (q → p))\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-2-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.2.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-2-2\">\u003cinput data-key=\"4.2.2\" id=\"d-4-2-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-2-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Sin pasar a otra forma, di qué puedes concluir de cada conjunto clausal:\u003c/p>\u003col>\n\u003cli>{{p, ¬p, q}; {r, ¬r}}\u003c/li>\n\u003cli>{{p}; {¬p, q}; {¬q}}\u003c/li>\n\u003cli>{{p, q}; {¬p}}\u003c/li>\n\u003cli>{} (conjunto vacío) y {□}\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"t-4-3\">\u003ch3>\u003cspan class=\"tnum\">4.3\u003c/span>\u003cspan>Propagación de literales\u003c/span>\u003c/h3>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-3-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.3.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-3-1\">\u003cinput data-key=\"4.3.1\" id=\"d-4-3-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-3-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Sea ξ = {{p, q}; {¬p, r}; {¬q, ¬r}; {q, r, s}}. Calcula:\u003c/p>\u003col>\n\u003cli>ξ(p)\u003c/li>\n\u003cli>ξ(p, r)\u003c/li>\n\u003cli>ξ(p, r, ¬q). ¿Qué indica el resultado?\u003c/li>\n\u003cli>ξ(p, ¬r). ¿Qué indica el resultado?\u003c/li>\n\u003cli>ξ(¬p) y, a partir de ahí, encuentra otro modelo.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-3-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.3.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-3-2\">\u003cinput data-key=\"4.3.2\" id=\"d-4-3-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-3-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Explica por qué la propagación no mantiene la equivalencia lógica pero sí la satisfacibilidad, usando ξ(p) del ejercicio anterior.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"t-4-4\">\u003ch3>\u003cspan class=\"tnum\">4.4\u003c/span>\u003cspan>Algoritmo DPLL\u003c/span>\u003c/h3>\u003cp class=\"topic-note\">Aplica DPLL indicando en cada paso la regla (tautología, unitaria, literal puro, inclusión, ramificación). Dibuja el árbol si ramificas y da el modelo si es satisfacible.\u003c/p>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-4-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.4.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-4-1\">\u003cinput data-key=\"4.4.1\" id=\"d-4-4-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-4-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>ξ = {{p, q}; {¬p, q}; {p, ¬q}; {¬p, ¬q}}\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-4-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.4.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-4-2\">\u003cinput data-key=\"4.4.2\" id=\"d-4-4-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-4-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>ξ = {{p, ¬q}; {q, ¬r}; {r, ¬p}; {p, q, r}; {¬p, ¬q, ¬r}}\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-4-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.4.3\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-4-3\">\u003cinput data-key=\"4.4.3\" id=\"d-4-4-3\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-4-3\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>ξ = {{p, ¬p, r}; {q, r}; {q, r, ¬s}; {¬q, s}; {¬r, ¬s}; {s, t}}\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-4-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.4.4\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-4-4\">\u003cinput data-key=\"4.4.4\" id=\"d-4-4-4\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-4-4\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>ξ = {{p, q}; {¬p, r}; {¬p, ¬r}; {q, s}; {¬q, ¬s}}. Ramifica primero por p.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"t-4-5\">\u003ch3>\u003cspan class=\"tnum\">4.5\u003c/span>\u003cspan>Método de resolución\u003c/span>\u003c/h3>\u003cp class=\"topic-note\">Escribe en notación Fitting: número, cláusula, origen Rₗ(i, j) y simplificaciones (subsumida, puro, tautología).\u003c/p>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-5-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.5.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-5-1\">\u003cinput data-key=\"4.5.1\" id=\"d-4-5-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-5-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Saturación por niveles con simplificación: ξ = {{p, q}; {¬p, r}; {¬q, r}; {¬r}}. Dibuja además el grafo de refutación.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-5-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.5.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-5-2\">\u003cinput data-key=\"4.5.2\" id=\"d-4-5-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-5-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Saturación con simplificación: ξ = {{p, q}; {¬p, q}; {¬q, r}; {¬r, s}}. ¿Qué puedes concluir? ¿Puede la resolución darte un modelo?\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-5-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.5.3\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-5-3\">\u003cinput data-key=\"4.5.3\" id=\"d-4-5-3\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-5-3\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Resolución con conjunto soporte (refutación): {p → q, q → r ∨ s, ¬s} ⊨ p → r.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-5-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.5.4\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-5-4\">\u003cinput data-key=\"4.5.4\" id=\"d-4-5-4\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-5-4\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Resolución con conjunto soporte (refutación): {p ∨ q, p → r} ⊨ r. Si no es válido, da un contraejemplo con otra técnica.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-5-5\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.5.5\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-5-5\">\u003cinput data-key=\"4.5.5\" id=\"d-4-5-5\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-5-5\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>¿Por qué de {p, q} y {¬p, ¬q} no se puede obtener □ en un solo paso?\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"t-4-6\">\u003ch3>\u003cspan class=\"tnum\">4.6\u003c/span>\u003cspan>Árboles semánticos\u003c/span>\u003c/h3>\u003cp class=\"topic-note\">Indica los nodos \u003cspan class=\"mark ok\">ÉXITO\u003c/span> y \u003cspan class=\"mark bad\">FALLO\u003c/span> y clasifica la fórmula (satisfacible, falseable, tautología, insatisfacible).\u003c/p>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-6-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.6.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-6-1\">\u003cinput data-key=\"4.6.1\" id=\"d-4-6-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-6-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>(p → q) ∧ (q → p) → (p ↔ q)\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-6-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.6.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-6-2\">\u003cinput data-key=\"4.6.2\" id=\"d-4-6-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-6-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>(p ∨ q) ∧ (p → ¬q) ∧ (q → r). Da todos los modelos que salen del árbol.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-6-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.6.3\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-6-3\">\u003cinput data-key=\"4.6.3\" id=\"d-4-6-3\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-6-3\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>(p → q) ∧ (q → r) ∧ p ∧ ¬r\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"t-4-7\">\u003ch3>\u003cspan class=\"tnum\">4.7\u003c/span>\u003cspan>Tableaux semánticos\u003c/span>\u003c/h3>\u003cp class=\"topic-note\">Marca cada α-fórmula y β-fórmula, y cada hoja como abierta (\u003cspan class=\"mark ok\">✓\u003c/span>) o cerrada (\u003cspan class=\"mark bad\">×\u003c/span>).\u003c/p>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-7-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.7.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-7-1\">\u003cinput data-key=\"4.7.1\" id=\"d-4-7-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-7-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>¿Es satisfacible (p ∨ q) ∧ ¬p ∧ (q → r)? Da el modelo.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-7-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.7.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-7-2\">\u003cinput data-key=\"4.7.2\" id=\"d-4-7-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-7-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Demuestra con tableaux que ((p → q) ∧ (q → r)) → (p → r) es tautología. ¿Sobre qué fórmula construyes el tableau?\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-7-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.7.3\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-7-3\">\u003cinput data-key=\"4.7.3\" id=\"d-4-7-3\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-7-3\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Valida por refutación {p → q, r → s, p ∨ r, ¬q} ⊨ s.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-7-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.7.4\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-7-4\">\u003cinput data-key=\"4.7.4\" id=\"d-4-7-4\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-7-4\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Valida por refutación {p → q ∨ r, ¬q} ⊨ ¬p. Si no es válido, lee el contraejemplo en una hoja abierta.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic integ\" id=\"t-4-8\">\u003ch3>\u003cspan class=\"tnum\">4.8\u003c/span>\u003cspan>Ejercicios integradores del Tema 4\u003c/span>\u003cspan class=\"tag\">Combina todo el tema\u003c/span>\u003c/h3>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-8-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.8.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-8-1\">\u003cinput data-key=\"4.8.1\" id=\"d-4-8-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-8-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Sea Φ = (p → q) ∧ (q → r) ∧ (r → ¬p) ∧ (p ∨ q).\u003c/p>\u003col>\n\u003cli>Pasa Φ a FNC y forma clausal.\u003c/li>\n\u003cli>Aplica DPLL.\u003c/li>\n\u003cli>Aplica un árbol semántico.\u003c/li>\n\u003cli>Aplica un tableau.\u003c/li>\n\u003cli>Comprueba que las tres técnicas dan el mismo modelo.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-8-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.8.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-8-2\">\u003cinput data-key=\"4.8.2\" id=\"d-4-8-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-8-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>«Si Ana viene a la reunión, viene Bea. Si viene Bea, Carlos no viene. Carlos viene o viene Ana. Por tanto, si Carlos no viene, viene Bea.» Formaliza (a, b, c) y valida el razonamiento por refutación con: resolución con conjunto soporte, DPLL, árbol semántico y tableau.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-8-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.8.3\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-8-3\">\u003cinput data-key=\"4.8.3\" id=\"d-4-8-3\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-8-3\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Valida {p → q, ¬p → r} ⊨ q ∧ r con DPLL y con tableau. Da todos los contraejemplos y explica por qué la resolución sola no los proporciona.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-8-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.8.4\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-8-4\">\u003cinput data-key=\"4.8.4\" id=\"d-4-8-4\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-8-4\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Hay tres luces L1, L2 y L3. Exactamente una está encendida. Además, si L1 está encendida, L2 también lo está.\u003c/p>\u003col>\n\u003cli>Codifica las restricciones como cláusulas (lᵢ: «Li está encendida»). Pista: «al menos una» es una cláusula y «como mucho una» son tres.\u003c/li>\n\u003cli>Aplica DPLL y da todos los modelos.\u003c/li>\n\u003cli>¿Qué luces pueden estar encendidas?\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"4\" id=\"e-4-8-5\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 4.8.5\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-4-8-5\">\u003cinput data-key=\"4.8.5\" id=\"d-4-8-5\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-4-8-5\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Para cada pregunta, elige la técnica más adecuada y justifica: a) ¿es tautología α? (sin pasar a FNC); b) dame un modelo de un conjunto grande de cláusulas; c) demuestra que un razonamiento es válido usando sólo las cláusulas de la conclusión negada como punto de partida; d) ¿es satisfacible α? y quiero ver todas las formas de hacerla verdadera sin pasar a FNC.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003c/section>\n    \u003cdiv class=\"divider\" id=\"soluciones\">\u003cp class=\"eyebrow\">Parte 2\u003c/p>\u003ch2>Soluciones\u003c/h2>\u003cp>Mismo orden y numeración que los enunciados. Cada solución enlaza de vuelta a su ejercicio.\u003c/p>\u003c/div>\n    \u003csection class=\"tema sols\" id=\"sol-1\">\u003cheader class=\"tema-head\">\u003cp class=\"eyebrow\">Soluciones · Tema 1\u003c/p>\u003ch2>Introducción a la lógica\u003c/h2>\u003c/header>\u003csection class=\"topic\" id=\"s-1-1\">\u003ch3>\u003cspan class=\"tnum\">1.1\u003c/span>\u003cspan>La lógica como cálculo\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"1\" id=\"s-1-1-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 1.1.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-1-1-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Expresión\u003c/th>\n\u003cth>¿ebf?\u003c/th>\n\u003cth>Motivo\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>A″\u003c/td>\n\u003ctd>Sí\u003c/td>\n\u003ctd>RF1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A′ X B″\u003c/td>\n\u003ctd>Sí\u003c/td>\n\u003ctd>RF3 (ebf de A, X, ebf de B)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B X A‴\u003c/td>\n\u003ctd>Sí\u003c/td>\n\u003ctd>RF4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A X A′\u003c/td>\n\u003ctd>No\u003c/td>\n\u003ctd>Ninguna regla combina A con A\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>X B′\u003c/td>\n\u003ctd>No\u003c/td>\n\u003ctd>Falta la ebf a la izquierda de X\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B′ X\u003c/td>\n\u003ctd>No\u003c/td>\n\u003ctd>Falta la ebf a la derecha de X\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"1\" id=\"s-1-1-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 1.1.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-1-1-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>A′ X B ⇒ A′ X B″ (RT3) ⇒ B″ X A′ (RT1) ⇒ B″ X A‴ (RT4).\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"1\" id=\"s-1-1-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 1.1.3\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-1-1-3\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Se intercambia, se cambian los apóstrofes del segundo elemento y se vuelve a intercambiar: A X B ⇒ B X A (RT1) ⇒ B X A‴ (RT4) ⇒ A‴ X B (RT2).\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"1\" id=\"s-1-1-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 1.1.4\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-1-1-4\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>No. Todas las reglas de transformación conservan «una A y una B»: sólo intercambian el orden o cambian apóstrofes. Es un invariante del cálculo. Además, AⁿXAᵐ ni siquiera es una ebf.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"1\" id=\"s-1-1-5\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 1.1.5\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-1-1-5\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>B″ X A′: «la nieta quiere al hijo».\u003c/li>\n\u003cli>«El nieto quiere a la madre»: A″ X B.\u003c/li>\n\u003cli>Porque los símbolos pasan a referirse a hechos del mundo. Un cálculo con interpretación es un lenguaje formalizado: lógica = cálculo + interpretación.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"s-1-2\">\u003ch3>\u003cspan class=\"tnum\">1.2\u003c/span>\u003cspan>Oración, enunciado y proposición\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"1\" id=\"s-1-2-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 1.2.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-1-2-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Expresión\u003c/th>\n\u003cth>Clasificación\u003c/th>\n\u003cth>Motivo\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>¿Qué hora es?\u003c/td>\n\u003ctd>Oración, no enunciado\u003c/td>\n\u003ctd>Interrogativa: no tiene valor de verdad\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>¡Cierra la ventana!\u003c/td>\n\u003ctd>Oración, no enunciado\u003c/td>\n\u003ctd>Imperativa\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Madrid es la capital de España.\u003c/td>\n\u003ctd>Proposición\u003c/td>\n\u003ctd>Declarativa y referencial\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ojalá apruebe FLI.\u003c/td>\n\u003ctd>Oración, no enunciado\u003c/td>\n\u003ctd>Desiderativa (expresa un deseo)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Mesa.\u003c/td>\n\u003ctd>No es oración\u003c/td>\n\u003ctd>Nombre suelto: no describe un hecho\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7 es un número primo.\u003c/td>\n\u003ctd>Proposición\u003c/td>\n\u003ctd>Declarativa y referencial\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>x es mayor que 3.\u003c/td>\n\u003ctd>Enunciado, no proposición\u003c/td>\n\u003ctd>x no refiere a nada concreto: no tiene valor de verdad hasta fijar x\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>El ordenador de la sala 2 está encendido.\u003c/td>\n\u003ctd>Proposición\u003c/td>\n\u003ctd>Declarativa y referencial\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"1\" id=\"s-1-2-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 1.2.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-1-2-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cul>\n\u003cli>p: incorrecto, los átomos se definen en afirmativo. Corrección: p: «llueve», y «no llueve» se escribe ¬p.\u003c/li>\n\u003cli>q: incorrecto, «casa» no es un hecho y no puede ser V o F. Corrección, por ejemplo: q: «la casa es blanca».\u003c/li>\n\u003cli>r: incorrecto, una pregunta no es proposición. Corrección: r: «vienes a clase».\u003c/li>\n\u003cli>s: correcto.\u003c/li>\n\u003cli>t: incorrecto, no es atómica (contiene «y»). Corrección: usar p: «llueve» y t: «hace frío», y escribir p ∧ t.\u003c/li>\n\u003c/ul>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"1\" id=\"s-1-2-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 1.2.3\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-1-2-3\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Un enunciado es una oración declarativa con pretensión de verdad. Una proposición es un enunciado con términos referenciales, es decir, que se refiere a un hecho concreto del mundo. Ejemplo de enunciado que no es proposición: «x es mayor que 3» o «él llegó ayer» sin contexto.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"s-1-3\">\u003ch3>\u003cspan class=\"tnum\">1.3\u003c/span>\u003cspan>Conceptos fundamentales\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"1\" id=\"s-1-3-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 1.3.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-1-3-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Etapa\u003c/th>\n\u003cth>Época\u003c/th>\n\u003cth>Autor o hito\u003c/th>\n\u003cth>Lógica\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1ª\u003c/td>\n\u003ctd>500 a.C. – s. XIX\u003c/td>\n\u003ctd>Aristóteles (Sócrates, Platón)\u003c/td>\n\u003ctd>Clásica\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2ª\u003c/td>\n\u003ctd>Mitad – final s. XIX\u003c/td>\n\u003ctd>Boole (1847)\u003c/td>\n\u003ctd>Algebraica\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3ª\u003c/td>\n\u003ctd>Final s. XIX – mitad s. XX\u003c/td>\n\u003ctd>Frege (1879)\u003c/td>\n\u003ctd>Matemática\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4ª\u003c/td>\n\u003ctd>Mitad s. XX – hoy\u003c/td>\n\u003ctd>Computación\u003c/td>\n\u003ctd>Computacional\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"1\" id=\"s-1-3-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 1.3.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-1-3-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>1) Ley del tercio excluido: p ∨ ¬p. 2) Principio de no contradicción: ¬(q ∧ ¬q).\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"1\" id=\"s-1-3-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 1.3.3\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-1-3-3\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>1 ontológico; 2 lógico; 3 meta-ontológico; 4 epistemológico; 5 implementación.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"1\" id=\"s-1-3-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 1.3.4\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-1-3-4\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>1 lenguaje formal (sintaxis); 2 formalización; 3 semántica; 4 sistema de demostración (equivalencia lógica); 5 sistema de demostración (implicación lógica, modus ponens).\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"1\" id=\"s-1-3-5\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 1.3.5\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-1-3-5\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>F. Estudia los razonamientos válidos: los que preservan la verdad, no los que tienen premisas verdaderas.\u003c/li>\n\u003cli>V. Es la definición de clase.\u003c/li>\n\u003cli>V. Por eso lo derivado sintácticamente coincide con lo deducido semánticamente.\u003c/li>\n\u003cli>F. En L0 son las proposiciones; los predicados son los elementos de L1.\u003c/li>\n\u003cli>V. The Mathematical Analysis of Logic (1847).\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic integ\" id=\"s-1-4\">\u003ch3>\u003cspan class=\"tnum\">1.4\u003c/span>\u003cspan>Integradores\u003c/span>\u003c/h3>\u003carticle class=\"card sol\" data-tema=\"1\" id=\"s-1-4-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 1.4.1\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-1-4-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>No son proposiciones «¿Has entregado la práctica?» (pregunta) ni «¡Entrégala hoy!» (orden). Sí lo son «Si entregas la práctica, apruebas», «Luis ha entregado la práctica» y «Luis aprueba».\u003c/li>\n\u003cli>e: «Luis entrega la práctica»; a: «Luis aprueba». La regla general se particulariza a Luis, porque L0 no tiene variables (eso llega con L1).\u003c/li>\n\u003cli>Premisas: e → a, e. Conclusión: a. Razonamiento: {e → a, e} ⊨ a (modus ponens).\u003c/li>\n\u003cli>Ambos pasos son formalización. El paso 2, además, fija el alfabeto del lenguaje formal (los átomos).\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"1\" id=\"s-1-4-2\">\u003cdiv class=\"card-he
