<body>

<div class="wrap" id="app"></div>

<script>
/* ======================= BANCO DE PREGUNTAS =======================
   t: tema; q: enunciado; o: opciones (el orden se baraja al mostrarlas); a: índice correcto;
   e: explicación; w: explicación específica de por qué una opción incorrecta lo es (opcional).
   Las fórmulas van entre `acentos graves` y se muestran en fuente de fórmulas. */
const BANK = [
/* ---------------- TEMA 1 ---------------- */
{t:1,q:"Según la definición dada en la asignatura, la lógica es…",o:["La ciencia formal que estudia los razonamientos válidos","El arte de convencer a otros mediante el discurso","El estudio de las opiniones y maneras populares","Una rama de la psicología que estudia cómo pensamos"],a:0,e:"La lógica es la ciencia formal que estudia los razonamientos válidos. Es formal porque usa formas primitivas, una sintaxis y esquemas de inferencia.",w:{1:"Eso es la retórica. Bacon (1605) distinguía: la lógica maneja la razón exacta y la verdad; la retórica, las opiniones populares.",2:"También es retórica, según la cita de Francis Bacon.",3:"La lógica estudia la corrección de los razonamientos, no los procesos psicológicos."}},
{t:1,q:"Un razonamiento es válido cuando…",o:["De premisas verdaderas se sigue necesariamente la verdad de la conclusión","Las premisas y la conclusión son verdaderas en el mundo real","La conclusión es verdadera","Las premisas no se contradicen entre sí"],a:0,e:"Validez = preservación necesaria de la verdad: si las premisas fueran verdaderas, la conclusión tendría que serlo. No depende de si de hecho lo son.",w:{1:"Un razonamiento con premisas y conclusión verdaderas puede ser inválido (la conclusión puede no seguirse de las premisas).",2:"Que la conclusión sea verdadera no basta: tiene que seguirse necesariamente de las premisas.",3:"Que las premisas sean consistentes no garantiza nada sobre la conclusión."}},
{t:1,q:"Un cálculo dispone de…",o:["Elementos primitivos, reglas de formación y reglas de transformación","Premisas, conclusión y contraejemplos","Átomos, tablas de verdad y modelos","Axiomas, interpretaciones y mundos posibles"],a:0,e:"Un cálculo tiene: un conjunto de elementos primitivos, reglas de formación (qué expresiones están bien formadas) y reglas de transformación de expresiones bien formadas."},
{t:1,q:"¿Qué hace falta añadir a un cálculo para obtener un lenguaje formalizado (una lógica)?",o:["Una interpretación de sus expresiones","Más reglas de transformación","Un conjunto de contraejemplos","Eliminar las reglas de formación"],a:0,e:"Una lógica es un cálculo al que se le da una interpretación (los hechos del mundo). En el ejemplo de clase, A=padre, B=madre, X=querer convierte el cálculo en un lenguaje."},
{t:1,q:"A las oraciones declarativas con pretensión de verdad acerca de los hechos se les llama…",o:["Enunciados","Proposiciones","Predicados","Cláusulas"],a:0,e:"Oración (entidad lingüística) → enunciado (oración declarativa con pretensión de verdad) → proposición (enunciado con términos referenciales).",w:{1:"Proposición es un paso más: un enunciado con términos referenciales."}},
{t:1,q:"A los enunciados con términos referenciales se les llama…",o:["Proposiciones","Oraciones","Fórmulas mal formadas","Literales"],a:0,e:"Proposición = enunciado con términos referenciales. La lógica representa la estructura de las proposiciones, es decir, la estructura profunda de un hecho."},
{t:1,q:"«Está lloviendo o no está lloviendo» ilustra…",o:["La ley del tercio excluido","El principio de no contradicción","La monotonía","El modus ponens"],a:0,e:"Tercio excluido: un hecho sólo puede ser verdadero o falso, no hay tercera opción. Por eso `α ∨ ¬α` es siempre V.",w:{1:"No contradicción dice que un hecho y su contrario no pueden darse a la vez: `α ∧ ¬α` es siempre F."}},
{t:1,q:"El principio de no contradicción afirma que…",o:["Un hecho y su contrario no pueden darse a la vez","Todo hecho es verdadero o falso","Toda fórmula es satisfacible","Si α implica β, β implica α"],a:0,e:"Si A es verdadero no puede ser falso a la vez. Por eso `α ∧ ¬α` es una contradicción (siempre F).",w:{1:"Eso es la ley del tercio excluido."}},
{t:1,q:"¿Cuál de estas expresiones NO es una proposición?",o:["¿Va a llover mañana?","Mi casa es blanca","2 + 2 = 5","Sócrates es griego"],a:0,e:"Una pregunta no es un enunciado declarativo: no puede ser verdadera ni falsa. «2 + 2 = 5» sí es proposición (falsa).",w:{2:"Es una proposición falsa, pero proposición: tiene valor de verdad."}},
{t:1,q:"¿Por qué la lógica pasó del lenguaje natural a un lenguaje simbólico?",o:["Porque el lenguaje natural es ambiguo","Porque el lenguaje natural no tiene verbos","Para poder usar ordenadores","Porque Aristóteles no conocía el lenguaje natural"],a:0,e:"El lenguaje natural es ambiguo; para evitar ambigüedades se transformó en un lenguaje simbólico (lógica simbólica), ya en la primera etapa histórica."},
{t:1,q:"George Boole (1847) dio origen a…",o:["La lógica algebraica","La lógica computacional","La lógica clásica aristotélica","La lógica temporal"],a:0,e:"Boole, en «The Mathematical Analysis of Logic», formuló la lógica en lenguaje matemático: las reglas de inferencia se modelan como leyes algebraicas (2.ª etapa)."},
{t:1,q:"Frege (1879) propuso la lógica como lenguaje para las Matemáticas. ¿Qué etapa inicia?",o:["La lógica matemática","La lógica algebraica","La lógica computacional","La lógica clásica"],a:0,e:"3.ª etapa (final s. XIX – mitad s. XX): lógica matemática, anticipada por Leibniz. La 4.ª es la lógica computacional."},
{t:1,q:"¿Cuál de estos NO es uno de los cuatro componentes de la lógica clásica?",o:["Una retórica para convencer","Un lenguaje formal","Una semántica","Un sistema de demostración axiomática"],a:0,e:"Los cuatro componentes son: lenguaje formal, formalización (paso del lenguaje natural al formal), semántica y sistema de demostración axiomática."},
{t:1,q:"Las equivalencias lógicas y las implicaciones lógicas son…",o:["Tautologías","Contingencias","Contradicciones","Fórmulas mal formadas"],a:0,e:"Son fórmulas semánticamente válidas (verdaderas en todas las interpretaciones). Por eso lo que se deriva sintácticamente coincide con lo que se deduce semánticamente."},
{t:1,q:"Razonar apoyándose en la verdad de los hechos es el método…",o:["Semántico o interpretativo","Axiomático o deductivo","Sintáctico","Retórico"],a:0,e:"Semántico/interpretativo: se apoya en la verdad de los hechos. Axiomático/deductivo (sintáctico): se apoya en la estructura del lenguaje.",w:{1:"El axiomático o deductivo se apoya en la estructura del lenguaje, no en la verdad de los hechos.",2:"Sintáctico es otro nombre del enfoque axiomático."}},
{t:1,q:"De los compromisos de McCarthy, ¿cuál se refiere a la verdad de los hechos y de las deducciones del modelo?",o:["Epistemológico","Ontológico","Meta-ontológico","De implementación"],a:0,e:"Epistemológico: la verdad de los hechos y deducciones. Ontológico: los objetos y hechos relevantes. Meta-ontológico: entre el mundo y el modelo. Lógico: expresividad. Implementación: eficacia física.",w:{1:"Ontológico trata de qué objetos y hechos son relevantes en el modelo."}},
{t:1,q:"En la lógica de predicados, los elementos más simples son…",o:["Los predicados","Las proposiciones","Las cláusulas","Las tablas de verdad"],a:0,e:"Lógica proposicional: proposiciones. Lógica de predicados: predicados (relaciones entre atributo y objeto, y entre atributos de distintos objetos)."},
{t:1,q:"Las fórmulas construidas correctamente a partir del alfabeto y las reglas sintácticas se llaman…",o:["Fórmulas bien formadas (fbf)","Literales","Modelos","Teoremas"],a:0,e:"Alfabeto + sintaxis (reglas recursivas de combinación) definen las fórmulas bien formadas.",w:{3:"Un teorema es la última fórmula de una demostración; no toda fbf es un teorema."}},
{t:1,q:"La lógica se describe a veces como…",o:["El «cálculo de la informática»","La «retórica de la informática»","La «estadística del pensamiento»","El «álgebra de los ordenadores» exclusivamente"],a:0,e:"Igual que el cálculo es la herramienta de la física, la lógica es la base formal de la informática (hardware, verificación, IA, bases de datos…)."},
{t:1,q:"La palabra «lógica» procede del griego λόγος (logos), que significa…",o:["Palabra, pensamiento, idea, argumento o razón","Número, cantidad o medida","Verdad revelada","Máquina o mecanismo"],a:0,e:"Lógica viene de λογική (logike), «dotado de razón, intelectual, dialéctico, argumentativo», que a su vez viene de logos: palabra, pensamiento, idea, argumento, razón o principio."},
{t:1,q:"Según la RAE, la lógica es la ciencia que expone las leyes, modos y formas de las proposiciones en relación con…",o:["Su verdad o falsedad","Su belleza y estilo","Su origen histórico","Su frecuencia de uso"],a:0,e:"Definición de la RAE: ciencia que expone las leyes, modos y formas de las proposiciones en relación con su verdad o falsedad."},
{t:1,q:"Según Francis Bacon (1605), la lógica se diferencia de la retórica en que…",o:["La lógica maneja la razón exacta y la verdad; la retórica, las opiniones y maneras populares","La lógica estudia el lenguaje oral y la retórica el escrito","La retórica es una rama de la lógica matemática","No hay diferencia: son sinónimos"],a:0,e:"Bacon: la lógica maneja la razón exacta y la verdad; la retórica la maneja tal como está plantada en las opiniones y maneras populares."},
{t:1,q:"¿Cuál de estas tareas NO se relaciona con la lógica según la asignatura?",o:["Decidir por intuición en lugar de razonar","Estudiar la inferencia formal","Deducir afirmaciones a partir de otras previas","Determinar respuestas correctas mediante un proceso estandarizado"],a:0,e:"Entre las tareas de la lógica está el razonamiento, en contraposición a la intuición; también el estudio de la inferencia formal, la secuencia de afirmaciones verificadas y la deducción a partir de afirmaciones previas."},
{t:1,q:"Se dice que la lógica es un ejercicio directo de metacognición. La metacognición es…",o:["Pensar acerca del pensamiento","Memorizar reglas sin entenderlas","Calcular más rápido que un ordenador","Convencer a otros con argumentos emotivos"],a:0,e:"Metacognición = pensar sobre el propio pensamiento. Evaluar si un razonamiento es correcto es exactamente eso."},
{t:1,q:"¿Cuál es el principal foco de estudio de la lógica?",o:["El razonamiento humano","Los lenguajes de programación","La conducta animal","La estadística de datos"],a:0,e:"La lógica estudia los principios del conocimiento y el pensamiento humanos y analiza la corrección de los razonamientos."},
{t:1,q:"La lógica analiza la corrección de los razonamientos…",o:["Tanto formales como no formales","Sólo matemáticos","Sólo los escritos en lenguaje natural","Sólo los que tienen premisas verdaderas"],a:0,e:"Según las diapositivas, analiza la corrección de los razonamientos tanto formales como no formales."},
{t:1,q:"En Inteligencia Artificial, la lógica es el fundamento de…",o:["Los métodos de representación del conocimiento y del razonamiento","Únicamente el diseño de interfaces gráficas","La fabricación de chips de memoria","Los algoritmos de compresión de vídeo"],a:0,e:"Es la base de la representación del conocimiento y el razonamiento: sistemas expertos, razonamiento con incertidumbre, lenguaje natural, razonamiento espacial y temporal, visión, robótica, lógica epistémica…"},
{t:1,q:"¿Qué aportan los lenguajes de especificación formal en ingeniería del software?",o:["Modelos estructurados, concisos y precisos sobre los que se puede razonar","Eliminan la necesidad de programar","Hacen que el código se ejecute más rápido","Sustituyen a las pruebas con usuarios"],a:0,e:"Los métodos formales permiten definir modelos estructurados, concisos y precisos en distintos niveles de abstracción y razonar sobre ellos, incluso informalmente."},
{t:1,q:"La primera etapa de la historia de la lógica (≈500 a.C. – s. XIX) comienza con…",o:["Sócrates, Platón y Aristóteles","Boole y De Morgan","Frege y Russell","Turing y McCarthy"],a:0,e:"En esa etapa la lógica se ocupaba de los argumentos en lenguaje natural; aquí comienza la lógica clásica."},
{t:1,q:"«Todos los hombres son mortales. Sócrates es un hombre. Por tanto, Sócrates es mortal.» Es el ejemplo típico de…",o:["Argumento cuya corrección demostraba la lógica de la primera etapa","Razonamiento de la lógica temporal","Problema SAT resuelto con DPLL","Razonamiento inválido"],a:0,e:"La lógica simbólica de la primera etapa se usaba para demostrar la corrección de argumentos como este, que es válido."},
{t:1,q:"¿En qué orden aparecen las cuatro etapas de la historia de la lógica?",o:["Clásica → algebraica → matemática → computacional","Algebraica → clásica → computacional → matemática","Matemática → clásica → algebraica → computacional","Clásica → matemática → algebraica → computacional"],a:0,e:"1.ª clásica (500 a.C.–s. XIX), 2.ª algebraica (Boole, 1847), 3.ª matemática (Frege, 1879), 4.ª computacional (mitad s. XX–hoy)."},
{t:1,q:"¿Quién anticipó mucho antes la lógica matemática, aunque aún no existían herramientas para desarrollarla?",o:["Leibniz","Aristóteles","Boole","Cook"],a:0,e:"Frege (1879) la propuso, pero Leibniz la había anticipado mucho tiempo antes."},
{t:1,q:"¿Qué motivó el paso a la lógica matemática (3.ª etapa)?",o:["La aparición de paradojas en pruebas matemáticas cada vez más sofisticadas","La invención del ordenador electrónico","La necesidad de convencer en debates públicos","La traducción de textos griegos"],a:0,e:"A medida que las pruebas matemáticas se volvieron más sofisticadas aparecieron paradojas, igual que en el lenguaje natural."},
{t:1,q:"La lógica computacional es…",o:["La misma lógica matemática aplicada a la computación","Una lógica sin reglas de inferencia","La lógica de Aristóteles traducida a código","Una lógica que sólo trabaja con números"],a:0,e:"Surge con la computadora electrónica: la lógica encuentra un nuevo hogar en la computación."},
{t:1,q:"¿Cuál de estas NO aparece como aplicación de la lógica a la computación?",o:["Imprimir documentos en color","Diseño de hardware con puertas lógicas","Verificación y corrección de diseños","Sistemas de razonamiento automático y sistemas expertos"],a:0,e:"Aplicaciones citadas: hardware con puertas lógicas, verificación de diseños (lógica temporal), razonamiento automático, sistemas expertos, comprobaciones de seguridad…"},
{t:1,q:"¿Qué lógica se menciona para la verificación y corrección de un diseño?",o:["La lógica temporal","La lógica algebraica","La retórica","La lógica aristotélica"],a:0,e:"En la 4.ª etapa se cita la verificación y corrección de un diseño mediante lógica temporal."},
{t:1,q:"La analogía `a(b+c) = ab + ac` ~ `x ∩ (y ∪ z) = (x ∩ y) ∪ (x ∩ z)` ilustra…",o:["La lógica algebraica de Boole","La ley del tercio excluido","El modus ponens","La lógica temporal"],a:0,e:"Boole modeló las reglas de inferencia como leyes para manipular expresiones algebraicas, como la distributiva."},
{t:1,q:"En el ejemplo de cálculo de clase partimos de `A X B’` y aplicamos RT1. Obtenemos…",o:["`B’ X A`","`A X B’’`","`A’ X B’`","`B X A’`"],a:0,e:"RT1: una expresión del tipo `An X Bn` se transforma en una del tipo `Bn X An`."},
{t:1,q:"Siguiendo el ejemplo de clase, de `B’ X A` aplicando RT4 se obtiene…",o:["`B’ X A’`","`A X B’`","`B X A`","`B’’ X A`"],a:0,e:"RT4 permite cambiar el elemento A por otro de su tipo. Así, de `B’ X A` se obtiene `B’ X A’`."},
{t:1,q:"Con la interpretación A = padre, B’’ = nieta y X = querer, la expresión `A X B’’` significa…",o:["Padre quiere a nieta","Nieta quiere a padre","Madre quiere a hija","Hijo quiere a nieta"],a:0,e:"Al dar una interpretación, el cálculo se convierte en un lenguaje formalizado."},
{t:1,q:"En un cálculo, las reglas de formación…",o:["Establecen qué combinaciones de elementos primitivos son expresiones bien formadas","Transforman unas expresiones bien formadas en otras","Asignan valores de verdad a los átomos","Dan significado a los símbolos"],a:0,e:"Formación = qué está bien construido. Transformación = cómo pasar de una ebf a otra.",w:{1:"Esas son las reglas de transformación."}},
{t:1,q:"En el lenguaje, una oración es…",o:["Una entidad lingüística","Una proposición siempre verdadera","Un enunciado con términos referenciales","Una fórmula bien formada"],a:0,e:"Oración (entidad lingüística) → enunciado (declarativa con pretensión de verdad) → proposición (enunciado con términos referenciales)."},
{t:1,q:"¿Qué trata de representar la lógica?",o:["La estructura de una proposición, la estructura profunda de un hecho","El sonido de las palabras","La intención del hablante","El estilo literario de un texto"],a:0,e:"La lógica trata de representar la estructura de una proposición, es decir, la estructura profunda de un hecho."},
{t:1,q:"¿Por qué se dice que la lógica es una ciencia FORMAL?",o:["Usa formas primitivas para los hechos simples, una sintaxis para los complejos y esquemas de inferencia","Porque sólo se estudia en la universidad","Porque estudia normas de cortesía","Porque sólo trata de hechos reales y verificados"],a:0,e:"Formal por sus formas primitivas, su sintaxis y sus patrones o esquemas de inferencia para obtener derivaciones correctas."},
{t:1,q:"Según la asignatura, la estructura lógica del mundo y la del lenguaje…",o:["Es la misma","Son opuestas","No guardan relación","Sólo coinciden en matemáticas"],a:0,e:"Por eso podemos razonar apoyándonos en la verdad de los hechos (método semántico) o en la estructura del lenguaje (método axiomático)."},
{t:1,q:"De los compromisos de McCarthy, ¿cuál se refiere a los objetos y hechos relevantes del modelo?",o:["Ontológico","Epistemológico","Meta-ontológico","Lógico"],a:0,e:"Ontológico: objetos y hechos relevantes. Epistemológico: verdad de hechos y deducciones. Meta-ontológico: relación mundo-modelo."},
{t:1,q:"El compromiso META-ONTOLÓGICO de McCarthy se establece…",o:["Entre el mundo y el modelo que creamos para entenderlo","Entre el lenguaje y su implementación física","Entre premisas y conclusión","Entre la sintaxis y la semántica"],a:0,e:"Meta-ontológico: entre el mundo y el modelo que creamos para entenderlo."},
{t:1,q:"El compromiso LÓGICO de McCarthy se refiere a…",o:["La expresividad del lenguaje en relación con el nivel epistemológico","La eficacia física del sistema","Los objetos relevantes del modelo","La verdad de los hechos"],a:0,e:"Lógico: expresividad del lenguaje respecto al nivel epistemológico. Implementación: expresividad y eficacia física respecto a los anteriores."},
{t:1,q:"El compromiso de IMPLEMENTACIÓN de McCarthy trata de…",o:["Su expresividad y eficacia física en relación a los niveles anteriores","La verdad de los hechos y deducciones","Los objetos del modelo","La relación entre el mundo y el modelo"],a:0,e:"Es el último nivel: cómo se lleva a la práctica eficazmente lo definido en los anteriores."},
{t:1,q:"John McCarthy (1927–2011) es conocido como…",o:["Uno de los padres de la Inteligencia Artificial","El creador de la lógica algebraica","El autor de la primera tabla de verdad","Quien demostró que SAT es NP-completo"],a:0,e:"McCarthy definió los compromisos de un sistema lógico para representar el conocimiento y el razonamiento."},
{t:1,q:"¿Cuántos valores de verdad admite la lógica clásica?",o:["Dos: verdadero y falso","Tres: verdadero, falso e indeterminado","Infinitos","Uno"],a:0,e:"Es bivalente por la ley del tercio excluido: un hecho sólo puede ser cierto o falso."},
{t:1,q:"El componente de la lógica clásica llamado FORMALIZACIÓN consiste en…",o:["Reglas para transformar oraciones del lenguaje natural al lenguaje formal","Un mecanismo de evaluación de fórmulas","Un conjunto de equivalencias lógicas","El alfabeto de símbolos primitivos"],a:0,e:"Formalización: paso del lenguaje natural (hechos del mundo) al lenguaje formal."},
{t:1,q:"La SEMÁNTICA de la lógica clásica es…",o:["Un mecanismo de evaluación composicional de las fbf a partir de los valores de verdad de las atómicas","El conjunto de reglas de inferencia","El alfabeto del lenguaje","La traducción del lenguaje natural"],a:0,e:"Semántica: interpretación de las fórmulas respecto a los hechos del mundo."},
{t:1,q:"El lenguaje formal de la lógica clásica se compone de…",o:["Un alfabeto de símbolos primitivos y una sintaxis de reglas de combinación recursiva","Premisas y conclusiones","Tablas de verdad y modelos","Axiomas y teoremas únicamente"],a:0,e:"Alfabeto (símbolos no descomponibles) + sintaxis (reglas recursivas). Lo que se forma así son las fbf."},
{t:1,q:"En el sistema de demostración axiomática, las equivalencias lógicas sirven para…",o:["Transformar o sustituir unas fórmulas por otras","Asignar valores de verdad a los átomos","Traducir el lenguaje natural","Contar interpretaciones"],a:0,e:"Equivalencias: sustituir fórmulas. Implicaciones lógicas: obtener razonamientos válidos."},
{t:1,q:"«Todos los peces vuelan. Nemo es un pez. Luego Nemo vuela.» Este razonamiento es…",o:["Válido, aunque tiene una premisa falsa","Inválido porque la conclusión es falsa","Inválido porque una premisa es falsa","Ni válido ni inválido"],a:0,e:"La validez depende de la forma: si las premisas fueran verdaderas, la conclusión lo sería necesariamente. Que una premisa sea falsa no lo invalida."},
{t:1,q:"Un razonamiento válido con todas sus premisas verdaderas tiene una conclusión…",o:["Necesariamente verdadera","Necesariamente falsa","Que puede ser verdadera o falsa","Sin valor de verdad"],a:0,e:"Es la definición de validez: preserva la verdad de las premisas a la conclusión."},

/* ---------------- TEMA 2 ---------------- */
{t:2,q:"La implicación `p → q` es falsa…",o:["Sólo cuando p es V y q es F","Cuando p es F","Cuando p y q son F","Cuando q es V y p es F"],a:0,e:"Es el único caso: antecedente V y consecuente F. Piénsalo como una promesa: sólo se rompe si se cumple la condición y no se cumple lo prometido.",w:{1:"Si el antecedente es F, la implicación es siempre V (la promesa no se activa).",2:"F → F = V.",3:"F → V = V."}},
{t:2,q:"Con 4 proposiciones atómicas distintas, ¿cuántas interpretaciones hay?",o:["16","8","4","32"],a:0,e:"Con n átomos hay 2ⁿ interpretaciones (filas de la tabla de verdad): 2⁴ = 16."},
{t:2,q:"Según la prioridad de las conectivas, `p ∧ q → r` se lee…",o:["`(p ∧ q) → r`","`p ∧ (q → r)`","`(p → r) ∧ q`","No es una fbf"],a:0,e:"Prioridad: () > ¬ > ∧,∨ > →,↔. La ∧ se agrupa antes que la →.",w:{1:"Eso exigiría que → tuviese más prioridad que ∧, y es al revés."}},
{t:2,q:"En esta asignatura, `p → q → r` se lee…",o:["`(p → q) → r`","`p → (q → r)`","`(p ∧ q) → r`","Es ambigua y no es fbf"],a:0,e:"A igual prioridad se agrupa de izquierda a derecha. Así están resueltos los ejemplos de clase (p. ej. `p → (q∧¬r) → (p→q)`).",w:{1:"Muchos libros asocian → por la derecha, pero en esta asignatura se usa izquierda a derecha.",2:"Eso es la exportación de `p → (q → r)`, que además no es lo mismo que `(p→q)→r`."}},
{t:2,q:"«p sólo si q» se formaliza como…",o:["`p → q`","`q → p`","`p ↔ q`","`¬p → q`"],a:0,e:"«Apruebo sólo si estudio»: si he aprobado, es que he estudiado: `aprobar → estudiar`.",w:{1:"Es el error más típico. `q → p` sería «p si q».",2:"`↔` es «si y sólo si»."}},
{t:2,q:"«p es condición necesaria para q» se formaliza como…",o:["`q → p`","`p → q`","`p ∧ q`","`¬q → p`"],a:0,e:"Sin p no puede haber q: si se da q, se ha dado p. «Tener gasolina es necesario para que arranque»: `arranca → gasolina`.",w:{1:"`p → q` dice que p es condición suficiente para q."}},
{t:2,q:"«p a menos que q» se formaliza como…",o:["`¬q → p`","`q → p`","`p → ¬q`","`p ∧ ¬q`"],a:0,e:"«Iré a menos que llueva»: si no llueve, iré. Equivale a `p ∨ q`."},
{t:2,q:"«Ni p ni q» se formaliza como…",o:["`¬p ∧ ¬q`","`¬p ∨ ¬q`","`¬(p ∧ q)`","`¬p → q`"],a:0,e:"Ninguna de las dos ocurre: `¬p ∧ ¬q` (≡ `¬(p ∨ q)` por De Morgan).",w:{1:"`¬p ∨ ¬q` sólo dice que al menos una no ocurre.",2:"`¬(p ∧ q)` ≡ `¬p ∨ ¬q`: no las dos a la vez, que es más débil."}},
{t:2,q:"¿Cuál de estas expresiones es una fbf?",o:["`¬(p ∨ q) ∧ r`","`(¬)p`","`¬p (∨ q) ∧ r`","`p (↔ q) ∨ r`"],a:0,e:"Las otras tienen conectivas sin fbf a ambos lados o paréntesis mal colocados (son los ejemplos de fórmulas mal formadas de clase)."},
{t:2,q:"Un literal es…",o:["Una fbf atómica o su negación","Una disyunción de átomos","Cualquier fbf sin paréntesis","Una conjunción de cláusulas"],a:0,e:"Literal: `p` o `¬p`. Una cláusula es un literal o una disyunción de literales.",w:{1:"Eso sería una cláusula (sin negaciones)."}},
{t:2,q:"La fórmula `p ∨ ¬p` es…",o:["Una tautología","Una contradicción","Contingente","Insatisfacible"],a:0,e:"Siempre V: es la ley del tercio excluido. Su opuesta `p ∧ ¬p` es la contradicción."},
{t:2,q:"Una fórmula contingente es…",o:["Satisfacible y falseable a la vez","Satisfacible pero no falseable","Falseable pero no satisfacible","Ni satisfacible ni falseable"],a:0,e:"Contingente: V en unas interpretaciones y F en otras. Por tanto es satisfacible (hay alguna V) y falseable (hay alguna F).",w:{1:"Satisfacible y no falseable es una tautología."}},
{t:2,q:"Si una fórmula es insatisfacible, entonces…",o:["Es falseable","Es contingente","Es satisfacible","Puede ser tautología"],a:0,e:"Insatisfacible = F en todas las interpretaciones; por tanto tiene al menos una F: es falseable. (Lo contrario no se cumple.)"},
{t:2,q:"Si α es una contradicción, entonces `¬α` es…",o:["Una tautología","Una contradicción","Contingente","No se puede saber"],a:0,e:"Si α es F en todas las interpretaciones, ¬α es V en todas."},
{t:2,q:"¿Cuál de estas afirmaciones es CORRECTA?",o:["Toda tautología es satisfacible","Toda fórmula satisfacible es tautología","Toda fórmula falseable es contradicción","Una tautología puede ser falseable"],a:0,e:"Tautología ⇒ satisfacible, pero no al revés (las contingentes son satisfacibles y no tautologías).",w:{1:"Las contingentes son satisfacibles y no son tautologías.",2:"Las contingentes son falseables y no son contradicciones.",3:"Una tautología no tiene ninguna interpretación F."}},
{t:2,q:"A un conjunto satisfacible le añadimos una fbf satisfacible. El nuevo conjunto…",o:["Puede volverse insatisfacible","Sigue siendo siempre satisfacible","Pasa a ser siempre tautología","Pasa a ser siempre insatisfacible"],a:0,e:"La fbf añadida puede ser F justo en los modelos del conjunto. Ejemplo: `{p}` y `¬p` son satisfacibles, pero `{p, ¬p}` no.",w:{1:"Contraejemplo: `{p}` + `¬p`."}},
{t:2,q:"A un conjunto insatisfacible le añadimos una tautología. El conjunto…",o:["Sigue siendo insatisfacible","Pasa a ser satisfacible","Pasa a ser tautología","Depende de la tautología"],a:0,e:"Añadir fórmulas sólo puede quitar modelos, nunca añadirlos. Si no había ninguno, sigue sin haberlo."},
{t:2,q:"Un modelo de un conjunto de fbf es…",o:["Una interpretación que hace verdaderas a todas sus fórmulas a la vez","Una interpretación que hace verdadera al menos a una fórmula","Una fórmula que es tautología","La última columna de la tabla de verdad"],a:0,e:"El conjunto es satisfacible si existe un modelo; equivale a que la conjunción de sus fórmulas sea satisfacible.",w:{1:"Tiene que hacerlas verdaderas a todas a la vez, no a alguna."}},
{t:2,q:"Sobre `≡` y `↔`, ¿qué es correcto?",o:["`α ≡ β` si y sólo si `α ↔ β` es una tautología","Son exactamente el mismo símbolo","`≡` es una conectiva del lenguaje L0","`α ↔ β` es una relación del metalenguaje"],a:0,e:"`↔` es una operación del lenguaje (una fórmula más). `≡` es una relación semántica entre fórmulas que pertenece al metalenguaje.",w:{2:"`≡` no está en el alfabeto de L0; pertenece al metalenguaje.",3:"Es al revés: `↔` pertenece al lenguaje y `≡` al metalenguaje."}},
{t:2,q:"`¬(p ∧ q)` es equivalente a…",o:["`¬p ∨ ¬q`","`¬p ∧ ¬q`","`p ∨ q`","`¬p → ¬q`"],a:0,e:"De Morgan: al negar se cambia la conectiva: ∧ pasa a ∨.",w:{1:"`¬p ∧ ¬q` ≡ `¬(p ∨ q)`. Al aplicar De Morgan hay que cambiar ∧ por ∨."}},
{t:2,q:"¿Cuál es equivalente a `p → q`?",o:["`¬q → ¬p`","`q → p`","`¬p → ¬q`","`p ∨ ¬q`"],a:0,e:"Contraposición: `p → q ≡ ¬q → ¬p`. También `p → q ≡ ¬p ∨ q`.",w:{1:"La implicación no es conmutativa: `q → p` es la recíproca.",2:"`¬p → ¬q` es la contraria; equivale a `q → p`.",3:"`p ∨ ¬q` ≡ `q → p`."}},
{t:2,q:"`¬(p → q)` es equivalente a…",o:["`p ∧ ¬q`","`¬p → ¬q`","`¬p ∧ q`","`¬p ∨ ¬q`"],a:0,e:"`¬(p → q) ≡ ¬(¬p ∨ q) ≡ p ∧ ¬q`: la implicación sólo es falsa si p es V y q es F.",w:{1:"Error muy frecuente: negar una implicación no es negar sus partes."}},
{t:2,q:"`(p ∧ q) → r` es equivalente a…",o:["`p → (q → r)`","`(p → q) → r`","`(p → r) ∧ (q → r)`","`p ∧ (q → r)`"],a:0,e:"Ley de exportación/importación.",w:{1:"`(p→q)→r` no es equivalente: con p=F, r=F, la de la izquierda es V y esta es F.",2:"`(p→r) ∧ (q→r)` ≡ `(p ∨ q) → r`."}},
{t:2,q:"`p ∧ (p ∨ q)` es equivalente a…",o:["`p`","`q`","`p ∨ q`","`p ∧ q`"],a:0,e:"Ley de absorción. Por distributiva: `(p∧p) ∨ (p∧q) ≡ p ∨ (p∧q) ≡ p`."},
{t:2,q:"¿Cuál de estas es el modus tollens?",o:["`{α → β, ¬β} ⊨ ¬α`","`{α → β, α} ⊨ β`","`{α → β, ¬α} ⊨ ¬β`","`{α ∨ β, ¬α} ⊨ β`"],a:0,e:"Modus tollens: si α implica β y β no se da, α tampoco.",w:{1:"Eso es el modus ponens.",2:"Eso es una falacia (negación del antecedente).",3:"Eso es el silogismo disyuntivo."}},
{t:2,q:"¿Cuál de estos esquemas NO es válido?",o:["`{α → β, β} ⊨ α`","`{α → β, β → γ} ⊨ α → γ`","`{α ∧ β} ⊨ α`","`{α → β, ¬α → β} ⊨ β`"],a:0,e:"Es la falacia de afirmación del consecuente: con α=F y β=V las premisas son V y la conclusión F. Las otras son silogismo hipotético, simplificación y prueba por casos.",w:{3:"Es la prueba por casos, que sí es válida."}},
{t:2,q:"`{α₁, …, αₙ} ⊨ β` equivale a que…",o:["`α₁ ∧ … ∧ αₙ ∧ ¬β` sea insatisfacible","`α₁ ∧ … ∧ αₙ ∧ β` sea satisfacible","`α₁ ∧ … ∧ αₙ ∧ ¬β` sea satisfacible","Cada αᵢ sea una tautología"],a:0,e:"Planteamiento por refutación: el razonamiento es válido si es imposible tener las premisas V y la conclusión F a la vez. (Directo: `α₁ ∧ … ∧ αₙ → β` tautología.)",w:{1:"Que sea satisfacible no garantiza que la conclusión se siga.",2:"Si eso fuese satisfacible habría un contraejemplo: el razonamiento sería NO válido."}},
{t:2,q:"Según el teorema de la deducción semántica, `CP ⊨ β` si y sólo si…",o:["La conjunción de las premisas `→ β` es tautología","La conjunción de las premisas `→ β` es satisfacible","`β` es tautología","Las premisas son tautologías"],a:0,e:"Planteamiento directo: `α₁ ∧ … ∧ αₙ → β` debe ser tautología."},
{t:2,q:"La propiedad de monotonía de `⊨` dice que…",o:["Si `CP ⊨ β` y `CP ⊆ Δ`, entonces `Δ ⊨ β`","Si `CP ⊨ β` y `β ⊨ γ`, entonces `CP ⊨ γ`","`α ⊨ α`","Si `α ⊨ β` entonces `β ⊨ α`"],a:0,e:"Añadir premisas no estropea un razonamiento válido.",w:{1:"Eso es la transitividad.",2:"Eso es la reflexividad.",3:"Falso en general; sólo ocurre cuando son equivalentes."}},
{t:2,q:"Si el conjunto de premisas es insatisfacible, entonces…",o:["Se sigue cualquier conclusión","No se sigue ninguna conclusión","Sólo se siguen tautologías","Sólo se siguen contradicciones"],a:0,e:"Ley de inconsistencia `{β, ¬β} ⊨ α`: no hay ninguna interpretación con premisas V, así que nunca hay contraejemplo."},
{t:2,q:"Con `ν(p)=F, ν(q)=V, ν(r)=F`, ¿cuánto vale `¬(p ∨ q) → (r ↔ ¬p)`?",o:["V","F","Depende de la prioridad","No se puede evaluar"],a:0,e:"`p ∨ q = V`, luego `¬(p∨q) = F`. Antecedente F ⇒ la implicación vale V (ni hace falta el consecuente, que es `F ↔ V = F`)."},
{t:2,q:"«Si el agua hierve a 50 ºC, entonces los elefantes vuelan» es…",o:["Verdadera","Falsa","Ni verdadera ni falsa","Mal formada"],a:0,e:"F → F = V. La implicación lógica no es causa-efecto: con antecedente falso siempre es verdadera."},
{t:2,q:"`⊨ β` (conjunto de premisas vacío) significa que…",o:["β es una tautología","β es una contradicción","β es satisfacible","β no se puede demostrar"],a:0,e:"β no necesita ningún fundamento para ser verdad: es verdadera en todas las interpretaciones."},
{t:2,q:"La fórmula `(p → q) → (¬p → ¬q)` es…",o:["Contingente","Tautología","Contradicción","Insatisfacible"],a:0,e:"Es F sólo con p=F, q=V (antecedente V y consecuente `V → F = F`). En el resto es V: satisfacible, falseable, contingente.",w:{1:"Hay una fila F (p=F, q=V). Es la falacia de negar el antecedente."}},
{t:2,q:"¿Qué conectiva NO es conmutativa?",o:["`→`","`∧`","`∨`","`↔`"],a:0,e:"`p → q` y `q → p` no son equivalentes (difieren en p=V,q=F y p=F,q=V)."},
{t:2,q:"Para demostrar que dos fórmulas NO son equivalentes basta con…",o:["Encontrar una interpretación en la que tengan distinto valor","Hacer las dos tablas completas siempre","Ver que tienen distintos átomos","Comprobar que una es tautología"],a:0,e:"Un solo contraejemplo basta. Para demostrar que SÍ son equivalentes hay que transformar una en otra con equivalencias o comparar las tablas completas."},
{t:2,q:"Con 3 proposiciones atómicas distintas, ¿cuántas filas tiene la tabla de verdad?",o:["8","6","9","3"],a:0,e:"2³ = 8 interpretaciones."},
{t:2,q:"Con 5 proposiciones atómicas distintas, ¿cuántas interpretaciones hay?",o:["32","25","10","16"],a:0,e:"2⁵ = 32."},
{t:2,q:"La fórmula `p ∧ ¬p` es…",o:["Una contradicción","Una tautología","Contingente","Satisfacible"],a:0,e:"Principio de no contradicción: siempre F."},
{t:2,q:"`p ↔ q` es verdadera cuando…",o:["p y q tienen el mismo valor de verdad","Al menos una de las dos es verdadera","p es V y q es F","Sólo cuando ambas son falsas"],a:0,e:"Doble implicación: V si antecedente y consecuente coinciden (V,V o F,F).",w:{3:"También es V cuando ambas son V."}},
{t:2,q:"`p ↔ q` es equivalente a…",o:["`(p → q) ∧ (q → p)`","`(p → q) ∨ (q → p)`","`p ∧ q`","`¬p ∨ q`"],a:0,e:"La doble implicación es la conjunción de las dos implicaciones.",w:{1:"Esa disyunción es una tautología."}},
{t:2,q:"`p ∨ q` es falsa…",o:["Sólo cuando p y q son F","Cuando alguna de las dos es F","Cuando ambas son V","Nunca"],a:0,e:"La disyunción (inclusiva) sólo es F si ambas lo son."},
{t:2,q:"La interdefinición de la implicación dice que `p → q ≡`…",o:["`¬p ∨ q`","`p ∨ ¬q`","`¬p ∧ q`","`p ∧ ¬q`"],a:0,e:"Es la equivalencia clave para pasar a FNC.",w:{3:"`p ∧ ¬q` es justo la negación de `p → q`."}},
{t:2,q:"`¬(p ∨ q)` es equivalente a…",o:["`¬p ∧ ¬q`","`¬p ∨ ¬q`","`p ∧ q`","`¬p → q`"],a:0,e:"De Morgan: al negar, ∨ pasa a ∧ y se niega cada parte."},
{t:2,q:"`p ∧ (q ∨ r)` es equivalente a…",o:["`(p ∧ q) ∨ (p ∧ r)`","`(p ∨ q) ∧ (p ∨ r)`","`p ∧ q ∧ r`","`(p ∧ q) ∨ r`"],a:0,e:"Distributiva de la conjunción respecto de la disyunción.",w:{1:"Esa es la distributiva de ∨ sobre ∧, que se aplica a `p ∨ (q ∧ r)`."}},
{t:2,q:"`¬¬p` es equivalente a…",o:["`p`","`¬p`","`p ∧ ¬p`","`p ∨ ¬p`"],a:0,e:"Ley de la doble negación."},
{t:2,q:"`p ∨ (q ∧ ¬q)` es equivalente a…",o:["`p`","`q`","Una tautología","Una contradicción"],a:0,e:"`q ∧ ¬q` es F, y F es el neutro de la disyunción: `p ∨ F ≡ p`."},
{t:2,q:"`p ∧ (q ∨ ¬q)` es equivalente a…",o:["`p`","`q`","Una tautología","Una contradicción"],a:0,e:"`q ∨ ¬q` es V, neutro de la conjunción: `p ∧ V ≡ p`."},
{t:2,q:"La ley de ADICIÓN es…",o:["`{α} ⊨ α ∨ β`","`{α ∧ β} ⊨ α`","`{α, β} ⊨ α ∧ β`","`{α ∨ β, ¬α} ⊨ β`"],a:0,e:"Si α es V, cualquier disyunción con α es V.",w:{1:"Esa es la simplificación.",2:"Esa es la ley de combinación.",3:"Ese es el silogismo disyuntivo."}},
{t:2,q:"La ley de COMBINACIÓN es…",o:["`{α, β} ⊨ α ∧ β`","`{α} ⊨ α ∨ β`","`{α ∧ β} ⊨ β`","`{α → β, α} ⊨ β`"],a:0,e:"Dos fórmulas verdaderas permiten afirmar su conjunción."},
{t:2,q:"El SILOGISMO HIPOTÉTICO es…",o:["`{α → β, β → γ} ⊨ α → γ`","`{α ∨ β, ¬β} ⊨ α`","`{α → β, ¬β} ⊨ ¬α`","`{α ↔ β} ⊨ α → β`"],a:0,e:"Es la transitividad de la implicación.",w:{1:"Ese es el silogismo disyuntivo.",2:"Ese es el modus tollens."}},
{t:2,q:"`{α ↔ β} ⊨ α → β` es la ley de…",o:["Eliminación de la equivalencia","Introducción de la equivalencia","Modus ponens","Combinación"],a:0,e:"De la doble implicación se obtiene cada una de las implicaciones. La introducción es `{α → β, β → α} ⊨ α ↔ β`."},
{t:2,q:"`{α → β, β → α} ⊨ α ↔ β` es la ley de…",o:["Introducción de la equivalencia","Eliminación de la equivalencia","Silogismo hipotético","Adición"],a:0,e:"Las dos implicaciones juntas dan la doble implicación."},
{t:2,q:"`{α → β, ¬α} ⊨ ¬β` NO es válido. ¿Qué interpretación lo demuestra?",o:["α = F, β = V","α = V, β = V","α = V, β = F","α = F, β = F"],a:0,e:"Con α=F y β=V: `α → β` = V, `¬α` = V y `¬β` = F. Premisas V y conclusión F: contraejemplo (falacia de negar el antecedente)."},
{t:2,q:"«Si llueve, el suelo se moja. El suelo está mojado. Luego ha llovido.» Es…",o:["Una falacia: afirmación del consecuente","Un modus ponens válido","Un modus tollens válido","Un silogismo disyuntivo"],a:0,e:"`{p → q, q} ⊨ p` no es válido: el suelo puede estar mojado por otro motivo (p=F, q=V)."},
{t:2,q:"Con `ν(p)=V, ν(q)=F, ν(r)=V`, ¿cuánto vale `(p → q) ∨ ¬r`?",o:["F","V","Depende de la prioridad","No se puede evaluar"],a:0,e:"`p → q` = V → F = F; `¬r` = F. F ∨ F = F."},
{t:2,q:"Con `ν(p)=V, ν(q)=F, ν(r)=F`, ¿cuánto vale `p ∧ ¬q → r`?",o:["F","V","Depende del orden","No es fbf"],a:0,e:"Se lee `(p ∧ ¬q) → r`. Antecedente V ∧ V = V; consecuente F. V → F = F."},
{t:2,q:"Con `ν(p)=F, ν(q)=F`, ¿cuánto vale `¬p ↔ q`?",o:["F","V","Indeterminado","Depende de la prioridad"],a:0,e:"`¬p` = V y `q` = F: tienen valores distintos, así que la doble implicación es F."},
{t:2,q:"Un conjunto de fbf que contiene una contradicción es…",o:["Insatisfacible","Satisfacible","Tautológico","Contingente"],a:0,e:"Ninguna interpretación puede hacer V a la contradicción, así que no hay modelo para todo el conjunto."},
{t:2,q:"La fórmula `p → (q → p)` es…",o:["Una tautología","Contingente","Una contradicción","Insatisfacible"],a:0,e:"Para que fuese F haría falta p=V y `q → p` = F, es decir, p=F. Imposible."},
{t:2,q:"La fórmula `(p → q) ∧ p ∧ ¬q` es…",o:["Una contradicción","Una tautología","Contingente","Satisfacible"],a:0,e:"Si p=V y q=F, la implicación vale F. No hay forma de hacer V las tres partes a la vez."},
{t:2,q:"La fórmula `p ∨ q → p` es…",o:["Contingente","Tautología","Contradicción","Insatisfacible"],a:0,e:"Se lee `(p ∨ q) → p`. Es F con p=F, q=V y V con p=V: satisfacible y falseable."},
{t:2,q:"De estas equivalencias, ¿cuál es CORRECTA?",o:["`p ∧ (p ∨ q) ≡ p`","`p → (q → r) ≡ (p → q) → r`","`¬(p ∧ q) ≡ ¬p ∧ ¬q`","`p → q ≡ q → p`"],a:0,e:"Es la absorción. Las demás son errores típicos.",w:{1:"Con p=F y r=F la izquierda es V y la derecha F.",2:"De Morgan cambia ∧ por ∨.",3:"La implicación no es conmutativa."}},
{t:2,q:"«p si q» se formaliza como…",o:["`q → p`","`p → q`","`p ↔ q`","`p ∧ q`"],a:0,e:"«Te llevo si llueve»: si llueve, te llevo: `q → p`. Compárala con «p sólo si q» (`p → q`).",w:{1:"Eso es «p sólo si q»."}},
{t:2,q:"«p si y sólo si q» se formaliza como…",o:["`p ↔ q`","`p → q`","`q → p`","`p ∨ q`"],a:0,e:"Combina «p si q» y «p sólo si q»: las dos implicaciones."},
{t:2,q:"«p es condición suficiente para q» se formaliza como…",o:["`p → q`","`q → p`","`p ↔ q`","`¬p → ¬q`"],a:0,e:"Basta con que se dé p para que se dé q."},
{t:2,q:"«No es cierto que llueva y haga frío» (p: llueve, q: hace frío) se formaliza como…",o:["`¬(p ∧ q)`","`¬p ∧ ¬q`","`¬p ∧ q`","`¬(p ∨ q)`"],a:0,e:"Se niega la conjunción entera; equivale a `¬p ∨ ¬q`.",w:{1:"Eso es «ni llueve ni hace frío».",3:"También significa «ni llueve ni hace frío»."}},
{t:2,q:"«Estudio pero no apruebo» (p: estudio, q: apruebo) se formaliza como…",o:["`p ∧ ¬q`","`p → ¬q`","`p ∨ ¬q`","`¬p ∧ q`"],a:0,e:"«Pero» funciona como una conjunción. (Curiosidad: `p ∧ ¬q ≡ ¬(p → q)`.)"},
{t:2,q:"¿Qué símbolo NO pertenece al alfabeto del lenguaje L0?",o:["`⊨`","`→`","`¬`","`(`"],a:0,e:"`⊨`, `⊢` y `≡` son símbolos del metalenguaje: hablan de las fórmulas, no forman parte de ellas."},
{t:2,q:"Una fbf es satisfacible si…",o:["Es verdadera en al menos una interpretación","Es verdadera en todas las interpretaciones","Es falsa en al menos una interpretación","Es falsa en todas las interpretaciones"],a:0,e:"Satisfacible = tiene al menos un modelo.",w:{1:"Eso es tautología.",2:"Eso es falseable.",3:"Eso es contradicción."}},
{t:2,q:"Una fbf es falseable si…",o:["Es falsa en al menos una interpretación","Es falsa en todas las interpretaciones","Es verdadera en alguna interpretación","Tiene algún modelo"],a:0,e:"Falseable = no es tautología.",w:{1:"Eso es contradicción (insatisfacible)."}},
{t:2,q:"Si α es una tautología y β es cualquier fbf, `α ∨ β` es…",o:["Una tautología","Una contradicción","Equivalente a β","Siempre contingente"],a:0,e:"V ∨ lo que sea = V."},
{t:2,q:"Si α es una tautología y β es cualquier fbf, `α ∧ β` es…",o:["Equivalente a β","Siempre una tautología","Siempre una contradicción","Equivalente a α"],a:0,e:"V es el neutro de la conjunción: `V ∧ β ≡ β`."},
{t:2,q:"`α ⊨ β` se cumple si y sólo si…",o:["`α → β` es una tautología","`α ↔ β` es una tautología","`α ∧ β` es satisfacible","`β → α` es una tautología"],a:0,e:"Implicación lógica = implicación que es tautología.",w:{1:"Eso es la equivalencia `α ≡ β`."}},
{t:2,q:"`α ≡ β` se cumple si y sólo si…",o:["`α ⊨ β` y `β ⊨ α`","Sólo `α ⊨ β`","α y β tienen los mismos átomos","α y β son tautologías"],a:0,e:"Equivalentes = cada una implica lógicamente a la otra (`α ↔ β` es tautología)."},
{t:2,q:"La contrarrecíproca de «Si estudio, apruebo» es…",o:["«Si no apruebo, no he estudiado»","«Si apruebo, he estudiado»","«Si no estudio, no apruebo»","«Estudio y no apruebo»"],a:0,e:"`p → q ≡ ¬q → ¬p`. Es la única de las variantes equivalente a la original.",w:{1:"Es la recíproca `q → p`, no equivalente.",2:"Es la contraria `¬p → ¬q`, no equivalente."}},
{t:2,q:"`¬p ∨ q`, según la prioridad de las conectivas, se lee…",o:["`(¬p) ∨ q`","`¬(p ∨ q)`","`¬p ∨ ¬q`","No es fbf"],a:0,e:"¬ tiene más prioridad que ∨: sólo afecta a p."},
{t:2,q:"La propiedad de reflexividad de `⊨` dice que…",o:["`α ⊨ α`","Si `α ⊨ β` entonces `β ⊨ α`","Si `α ⊨ β` y `β ⊨ γ` entonces `α ⊨ γ`","Añadir premisas no estropea la validez"],a:0,e:"Toda fórmula es consecuencia de sí misma.",w:{2:"Eso es transitividad.",3:"Eso es monotonía."}},

/* ---------------- TEMA 3 ---------------- */
{t:3,q:"En el planteamiento DIRECTO, `{α₁, …, αₙ} ⊨ β` se comprueba viendo que…",o:["`α₁ ∧ … ∧ αₙ → β` es una tautología","`α₁ ∧ … ∧ αₙ ∧ ¬β` es una contradicción","`α₁ ∧ … ∧ αₙ ∧ β` es satisfacible","`β → α₁ ∧ … ∧ αₙ` es una tautología"],a:0,e:"Directo: la implicación de la conjunción de premisas a la conclusión debe ser tautología.",w:{1:"Ese es el planteamiento por refutación (también correcto, pero es el otro).",3:"Es la implicación al revés."}},
{t:3,q:"En el planteamiento por REFUTACIÓN se comprueba que…",o:["`α₁ ∧ … ∧ αₙ ∧ ¬β` es una contradicción","`α₁ ∧ … ∧ αₙ → β` es una tautología","`¬β` es una tautología","`α₁ ∧ … ∧ αₙ ∧ ¬β` es satisfacible"],a:0,e:"Se niega la conclusión, se une a las premisas y se busca una contradicción (reducción al absurdo).",w:{3:"Si fuese satisfacible, habría un contraejemplo y el razonamiento no sería válido."}},
{t:3,q:"En una demostración formal, cada paso es…",o:["Un axioma, una premisa o una fórmula obtenida por una regla de inferencia","Una fila de la tabla de verdad","Una interpretación","Un modelo de las premisas"],a:0,e:"Se para al llegar a la conclusión. La última fórmula es un teorema."},
{t:3,q:"El símbolo `⊢` significa…",o:["Que la conclusión se deriva sintácticamente de las premisas","Que la conclusión es consecuencia semántica","Equivalencia lógica","Doble implicación"],a:0,e:"`⊢` (metalenguaje) es la relación sintáctica: hay una demostración. `⊨` es la relación semántica.",w:{1:"Eso es `⊨`."}},
{t:3,q:"Un sistema deductivo es SÓLIDO (correcto) cuando…",o:["Si `⊢ β` entonces `⊨ β`","Si `⊨ β` entonces `⊢ β`","Puede demostrar β y ¬β","Siempre termina"],a:0,e:"Todo lo que se demuestra es verdad. Permite trabajar sintácticamente con rigor sin usar métodos semánticos.",w:{1:"Eso es la completitud.",2:"Eso sería una teoría inconsistente."}},
{t:3,q:"Un sistema deductivo es COMPLETO cuando…",o:["Si `⊨ β` entonces `⊢ β`","Si `⊢ β` entonces `⊨ β`","No tiene axiomas","Todas sus fórmulas son teoremas"],a:0,e:"Todo lo que es verdad (válido) se puede demostrar. No todos los sistemas son completos.",w:{1:"Eso es la solidez (corrección)."}},
{t:3,q:"La deducción natural es…",o:["Sólida y completa","Sólida pero no completa","Completa pero no sólida","Ni sólida ni completa"],a:0,e:"Así lo indican las diapositivas: es un sistema sólido y completo."},
{t:3,q:"El teorema de la deducción sintáctica permite afirmar que…",o:["`{α₁,…,αₙ} ⊢ β` si y sólo si `{α₁,…,αₙ₋₁} ⊢ αₙ → β`","`{α₁,…,αₙ} ⊢ β` si y sólo si `⊨ β`","Toda tautología es un axioma","`⊢` y `⊨` son el mismo símbolo"],a:0,e:"Una premisa puede pasar al antecedente de la conclusión."},
{t:3,q:"Para demostrar sintácticamente una conclusión de la forma `α → β`, lo más práctico es…",o:["Añadir α como supuesto y derivar β","Negar α y derivar ¬β","Hacer la tabla de verdad","Derivar β → α"],a:0,e:"Es el uso práctico del teorema de la deducción: si con α como premisa obtienes β, tienes `α → β`."},
{t:3,q:"Un conjunto de fórmulas 𝒯 es una teoría si…",o:["Es cerrado bajo demostraciones","Todas sus fórmulas son contradicciones","Tiene un único modelo","No contiene axiomas"],a:0,e:"Si `𝒯 ⊢ β` entonces `β ∈ 𝒯`. Sus elementos son los teoremas."},
{t:3,q:"Una teoría es inconsistente si…",o:["En ella se puede demostrar una fórmula y su negación","No tiene teoremas","Es completa","No es axiomatizable"],a:0,e:"Consistente: puede demostrarse β o ¬β, pero no ambas a la vez."},
{t:3,q:"Una teoría es SEMIDECIDIBLE cuando…",o:["Se puede determinar la inconsistencia y sólo a veces la consistencia","Se pueden determinar siempre la consistencia y la inconsistencia","No se puede determinar ninguna de las dos","Sólo se puede determinar la consistencia"],a:0,e:"Decidible: ambas. Semidecidible: inconsistencia sí, consistencia sólo a veces. Indecidible: ninguna.",w:{1:"Eso es decidible."}},
{t:3,q:"La lógica proposicional L0 es…",o:["Decidible","Semidecidible","Indecidible","Inconsistente"],a:0,e:"La tabla de verdad siempre termina, así que siempre se puede decidir. L1 (predicados) sólo es semidecidible."},
{t:3,q:"En la demostración de `{p → q, q → r, ¬r} ⊢ ¬p`, ¿qué regla permite pasar de `p → r` y `¬r` a `¬p`?",o:["Modus tollens","Modus ponens","Silogismo disyuntivo","Ley de adición"],a:0,e:"`{α → β, ¬β} ⊨ ¬α`. Antes, `p → r` se obtuvo por silogismo hipotético de las dos primeras premisas."},
{t:3,q:"De `p ∨ q` y `¬q` se deduce `p` por…",o:["Silogismo disyuntivo","Silogismo hipotético","Modus ponens","Ley de simplificación"],a:0,e:"`{α ∨ β, ¬β} ⊨ α`."},
{t:3,q:"Que un razonamiento sea válido significa que…",o:["Toda interpretación que hace V a las premisas hace V a la conclusión","Cada premisa es satisfacible","La conclusión es una tautología","Las premisas son tautologías"],a:0,e:"La validez no dice nada de cada premisa por separado; sólo relaciona premisas y conclusión.",w:{1:"Es irrelevante para la validez: la validez relaciona premisas y conclusión.",2:"No hace falta: la conclusión sólo tiene que ser V cuando las premisas lo son."}},
{t:3,q:"Las técnicas SAT (tablas, DPLL, resolución, árboles, tableaux) son métodos…",o:["Semánticos","Sintácticos","Axiomáticos","Retóricos"],a:0,e:"Se basan en interpretaciones y evaluación (equivalencia y consecuencia lógica), no en derivar con reglas."},
{t:3,q:"Una teoría es axiomatizable si…",o:["Existe un conjunto de fórmulas ℱ tal que la teoría es `{β | ℱ ⊢ β}`","Todas sus fórmulas son axiomas","No tiene ningún axioma","Es inconsistente"],a:0,e:"Los elementos de ℱ son los axiomas de la teoría."},
{t:3,q:"Sospechas que un razonamiento NO es válido. Lo más eficiente es…",o:["Buscar una interpretación con las premisas V y la conclusión F","Intentar derivar la conclusión con reglas de inferencia","Comprobar que las premisas son satisfacibles","Negar todas las premisas"],a:0,e:"Un contraejemplo demuestra la no validez. Derivar sintácticamente nunca terminaría con éxito si no es válido."},
{t:3,q:"Un sistema deductivo está formado por…",o:["Premisas, reglas de inferencia y un método sintáctico de pasos iterativos","Tablas de verdad y modelos","Interpretaciones y contraejemplos","Sólo axiomas, sin reglas"],a:0,e:"Premisas (fórmulas aceptadas de partida) + reglas de inferencia (implicaciones lógicas) aplicadas paso a paso hasta la conclusión."},
{t:3,q:"En un sistema deductivo, las reglas de inferencia son…",o:["Implicaciones lógicas usadas como esquemas para generar nuevas fórmulas","Interpretaciones que hacen V a las premisas","Tablas de verdad abreviadas","Contraejemplos"],a:0,e:"Establecen cómo construir nuevas expresiones a partir de unas iniciales."},
{t:3,q:"Obtener nuevas fórmulas aplicando reglas de inferencia se denomina…",o:["Derivar o inferir","Interpretar","Satisfacer","Refutar"],a:0,e:"La secuencia de fórmulas así obtenida hasta la conclusión es la demostración."},
{t:3,q:"Las premisas de un sistema deductivo son…",o:["Fórmulas de partida que por principio se aceptan","Fórmulas que hay que demostrar","Siempre tautologías","Las conclusiones negadas"],a:0,e:"Se aceptan sin demostración; a partir de ellas se deriva."},
{t:3,q:"Un TEOREMA, en un sistema deductivo, es…",o:["La última fórmula de una secuencia de demostración","Cualquier premisa","Una interpretación que hace V a todas las fórmulas","Una fórmula mal formada"],a:0,e:"Un teorema o es un axioma o es el resultado de aplicar una regla de inferencia sobre otros teoremas."},
{t:3,q:"`⊢ β` (sin premisas) significa que…",o:["β es un teorema: es demostrable","β es satisfacible","β es falsa","β es una premisa"],a:0,e:"Es la versión sintáctica de `⊨ β` (β tautología). En un sistema sólido y completo ambas coinciden."},
{t:3,q:"¿Cuál es el criterio de parada de una demostración formal?",o:["Llegar a la conclusión","Agotar todas las reglas de inferencia","Obtener siempre una contradicción","Hacer 2ⁿ pasos"],a:0,e:"Se aplican reglas hasta obtener la fórmula que se quería demostrar."},
{t:3,q:"Una deducción (estructura deductiva) es correcta si…",o:["Cada consecuente es un teorema obtenido de los consecuentes anteriores","Todas sus fórmulas son contingentes","Las premisas son tautologías","Tiene menos de diez pasos"],a:0,e:"De la secuencia de premisas (antecedentes) se obtiene una secuencia de conclusiones (consecuentes), cada una justificada."},
{t:3,q:"La consecuencia lógica (`⊨`) es una relación ___ y la estructura deductiva (`⊢`) es una relación ___.",o:["Semántica; sintáctica","Sintáctica; semántica","Semántica; semántica","Sintáctica; sintáctica"],a:0,e:"`⊨` se basa en interpretaciones (valores de verdad); `⊢` en reglas de inferencia aplicadas a la forma de las fórmulas."},
{t:3,q:"¿Por qué es tan útil que un sistema deductivo sea SÓLIDO?",o:["Permite trabajar sintácticamente con rigor sin usar métodos semánticos potencialmente ineficientes","Garantiza que se puede demostrar toda tautología","Hace que las tablas de verdad sean más cortas","Evita tener que escribir premisas"],a:0,e:"Todo lo que se demuestra con reglas es también válido semánticamente, así que no hace falta comprobarlo con técnicas SAT.",w:{1:"Eso es la completitud."}},
{t:3,q:"Si un sistema deductivo NO es completo…",o:["Existen razonamientos válidos que no se pueden demostrar en él","Se pueden demostrar razonamientos inválidos","No tiene reglas de inferencia","Es inconsistente"],a:0,e:"Completitud: todo lo válido es demostrable. Si falla, algunas consecuencias lógicas no tienen demostración en ese sistema.",w:{1:"Eso pasaría si no fuese sólido."}},
{t:3,q:"En L0, ¿por qué siempre es posible comprobar semánticamente si una consecuencia lógica es válida?",o:["Porque siempre se puede comprobar con técnicas SAT si una fórmula es tautología","Porque todo sistema deductivo es completo","Porque toda fórmula es satisfacible","Porque las premisas siempre son verdaderas"],a:0,e:"Hay un número finito de interpretaciones (2ⁿ), así que el procedimiento siempre termina."},
{t:3,q:"Sobre el teorema de la deducción sintáctica, ¿qué es cierto?",o:["Hay que demostrarlo para cada sistema deductivo concreto","Es un axioma común a todos los sistemas","Sólo vale para lógica de predicados","Dice que `⊢` y `⊨` son lo mismo"],a:0,e:"Es esencial porque permite plantear la demostración de un teorema como una estructura deductiva."},
{t:3,q:"Por el teorema de la deducción, si `{p} ⊢ q`, entonces…",o:["`⊢ p → q`","`⊢ q → p`","`⊢ p ∧ q`","`⊢ ¬p`"],a:0,e:"La premisa pasa a ser el antecedente de la conclusión."},
{t:3,q:"Si `{p → q, r} ⊢ s`, el teorema de la deducción permite afirmar…",o:["`{p → q} ⊢ r → s`","`{r} ⊢ s → (p → q)`","`⊢ s`","`{p → q, s} ⊢ r`"],a:0,e:"Se quita la última premisa (r) y pasa al antecedente de la conclusión: `r → s`."},
{t:3,q:"Una teoría es CONSISTENTE si…",o:["Puede demostrarse β o ¬β, pero no ambas","Puede demostrarse β y ¬β","No tiene ningún teorema","Todas sus fórmulas son contingentes"],a:0,e:"Inconsistente = se puede demostrar una fórmula y su negación."},
{t:3,q:"Los elementos de ℱ en una teoría axiomatizable `𝒯(ℱ) = {β | ℱ ⊢ β}` se llaman…",o:["Axiomas","Teoremas derivados","Modelos","Contraejemplos"],a:0,e:"A partir de los axiomas se demuestran los teoremas de la teoría."},
{t:3,q:"Una teoría es INDECIDIBLE cuando…",o:["No es posible determinar ni la inconsistencia ni la consistencia","Sólo se puede determinar la inconsistencia","Se pueden determinar las dos","Es siempre inconsistente"],a:0,e:"Decidible: ambas. Semidecidible: inconsistencia sí, consistencia sólo a veces. Indecidible: ninguna.",w:{1:"Eso es semidecidible."}},
{t:3,q:"Una teoría es DECIDIBLE cuando…",o:["Existen procedimientos para determinar tanto la inconsistencia como la consistencia","Sólo se puede determinar la inconsistencia","No se puede determinar nada","No tiene axiomas"],a:0,e:"Es el caso de L0: las técnicas SAT siempre dan respuesta."},
{t:3,q:"La lógica de predicados (L1) es…",o:["Semidecidible","Decidible","Indecidible","Inconsistente"],a:0,e:"A diferencia de L0, que es decidible."},
{t:3,q:"Para demostrar `{p → q, q → r, p} ⊢ r`, una secuencia correcta es…",o:["Modus ponens con `p → q` y `p` da q; modus ponens con `q → r` y q da r","Modus tollens con `q → r` y p","Silogismo disyuntivo con p y r","Adición de r a p"],a:0,e:"También vale: silogismo hipotético (`p → r`) y después modus ponens."},
{t:3,q:"De `p ∧ q` se puede derivar `p ∨ r` aplicando…",o:["Simplificación y después adición","Combinación y después modus ponens","Modus tollens","Silogismo hipotético"],a:0,e:"Simplificación: `p ∧ q ⊢ p`. Adición: `p ⊢ p ∨ r`."},
{t:3,q:"De `p` y `q` se obtiene `p ∧ q` por la ley de…",o:["Combinación","Simplificación","Adición","Absorción"],a:0,e:"`{α, β} ⊨ α ∧ β`."},
{t:3,q:"¿Es válido `{p ∨ q, p → r, q → r} ⊨ r`?",o:["Sí: en cualquier caso se obtiene r","No: falla con p=V, q=F","No: falla si r es F","Sólo si p y q son V"],a:0,e:"Si las tres premisas son V, o p o q es V, y ambas llevan a r. No hay contraejemplo (es la prueba por casos)."},
{t:3,q:"¿Es válido `{p → q, ¬p} ⊨ ¬q`?",o:["No: con p=F y q=V las premisas son V y la conclusión F","Sí, es el modus tollens","Sí, por silogismo disyuntivo","No se puede saber sin la tabla completa"],a:0,e:"Es la falacia de negar el antecedente. El modus tollens niega el consecuente: `{p → q, ¬q} ⊨ ¬p`."},
{t:3,q:"¿Es válido `{p → q, q → r} ⊨ r → p`?",o:["No: con p=F, q=F, r=V las premisas son V y la conclusión F","Sí, por silogismo hipotético","Sí, por contraposición","Sí, por modus ponens"],a:0,e:"El silogismo hipotético da `p → r`, no `r → p`. Contraejemplo: p=F, q=F, r=V."},
{t:3,q:"¿Es válido `{p ∨ q, ¬p} ⊨ q`?",o:["Sí, es el silogismo disyuntivo","No: falla con p=V","No: falla con p=F y q=F","Sólo si q es tautología"],a:0,e:"Si p es F y `p ∨ q` es V, q tiene que ser V.",w:{2:"Con p=F y q=F la premisa `p ∨ q` es F, así que no es un contraejemplo."}},
{t:3,q:"Para validar `{p → q, q → r, p} ⊨ r` por REFUTACIÓN se comprueba que es contradicción…",o:["`(p → q) ∧ (q → r) ∧ p ∧ ¬r`","`(p → q) ∧ (q → r) ∧ p → r`","`(p → q) ∧ (q → r) ∧ p ∧ r`","`¬((p → q) ∧ (q → r) ∧ p)`"],a:0,e:"Premisas + conclusión negada. Si no hay interpretación que las haga V a la vez, el razonamiento es válido.",w:{1:"Eso es el planteamiento directo (debe ser tautología)."}},
{t:3,q:"Para validar `{p → q, ¬q} ⊨ ¬p` con el planteamiento DIRECTO se comprueba que es tautología…",o:["`(p → q) ∧ ¬q → ¬p`","`(p → q) ∧ ¬q ∧ p`","`¬p → (p → q) ∧ ¬q`","`(p → q) ∨ ¬q ∨ ¬p`"],a:0,e:"Conjunción de premisas → conclusión.",w:{1:"Eso es la refutación (debe ser contradicción).",2:"Es la implicación al revés."}},
{t:3,q:"Comprobar si un razonamiento es válido se transforma en el problema de…",o:["Analizar la satisfacibilidad de una determinada fórmula","Contar las premisas","Traducir al lenguaje natural","Buscar un axioma nuevo"],a:0,e:"Por eso se usan técnicas SAT."},
{t:3,q:"Si sabemos que `{α₁, …, αₙ} ⊨ β`, ¿qué podemos afirmar sobre β por sí sola?",o:["Nada: la validez no dice nada del tipo de satisfacibilidad de premisas o conclusión","Que β es una tautología","Que β es siempre satisfacible","Que β es contingente"],a:0,e:"Por ejemplo, si las premisas son insatisfacibles, β puede ser incluso una contradicción."},
{t:3,q:"¿Puede un razonamiento VÁLIDO tener la conclusión falsa en el mundo real?",o:["Sí, si alguna premisa es falsa","No, nunca","Sólo si la conclusión es una tautología","Sólo en lógica de predicados"],a:0,e:"La validez sólo garantiza: premisas V ⇒ conclusión V. Con alguna premisa falsa no garantiza nada."},
{t:3,q:"En una teoría inconsistente, ¿qué ocurre?",o:["Se puede derivar cualquier fórmula","No se puede demostrar nada","Sólo se demuestran tautologías","Es decidible seguro"],a:0,e:"Si se demuestran β y ¬β, por la ley de inconsistencia `{β, ¬β} ⊨ α` se sigue cualquier α."},
{t:3,q:"Que 𝒯 sea cerrada bajo demostraciones significa que…",o:["Si `𝒯 ⊢ β`, entonces β pertenece a 𝒯","𝒯 no tiene premisas","Ninguna fórmula se puede demostrar desde 𝒯","𝒯 sólo contiene axiomas"],a:0,e:"Todo lo que se demuestra desde la teoría ya está en ella."},
{t:3,q:"En deducción natural, para obtener `p ↔ q` a partir de `p → q` y `q → p` se aplica…",o:["Introducción de la equivalencia","Eliminación de la equivalencia","Modus ponens","Silogismo disyuntivo"],a:0,e:"`{α → β, β → α} ⊨ α ↔ β`."},

/* ---------------- TEMA 4 ---------------- */
{t:4,q:"¿Quién demostró en 1971 que SAT es NP-completo?",o:["Stephen Cook","George Boole","Alan Robinson","Davis y Putnam"],a:0,e:"Cook (1971). Robinson propuso el método de resolución (1965) y Davis-Putnam-Logemann-Loveland el DPLL (1962)."},
{t:4,q:"Los problemas NP-completos se caracterizan porque…",o:["Todo problema de NP se transforma polinomialmente en ellos y sus soluciones se verifican eficientemente","Se resuelven en tiempo polinómico con una máquina determinista","No tienen solución","Sólo se resuelven con tablas de verdad"],a:0,e:"No se conoce algoritmo polinómico para ellos; los conocidos son exponenciales.",w:{1:"Eso es la clase P."}},
{t:4,q:"¿Cuáles son algoritmos SAT NO completos?",o:["GSAT y WalkSat","DPLL y Resolución","Tablas de verdad y árboles semánticos","Tableaux semánticos"],a:0,e:"GSAT, WalkSat y SA-SAT pueden no encontrar un modelo aunque exista. Los completos determinan satisfacibilidad e insatisfacibilidad."},
{t:4,q:"¿Qué técnicas SAT necesitan la fórmula en forma clausal (FNC)?",o:["DPLL y Resolución","Tablas de verdad y árboles semánticos","Tableaux y árboles semánticos","Todas"],a:0,e:"DPLL y resolución trabajan con cláusulas. Tablas, árboles semánticos y tableaux se aplican a cualquier fbf."},
{t:4,q:"La cláusula vacía `□` y el conjunto vacío de cláusulas `∅` son, respectivamente…",o:["Insatisfacible y satisfacible","Satisfacible e insatisfacible","Ambos insatisfacibles","Ambos satisfacibles"],a:0,e:"`□` = he llegado a una contradicción. `∅` = no queda nada que cumplir. Confundirlos es un error grave."},
{t:4,q:"¿Cuál es el PRIMER paso para pasar una fórmula a FNC?",o:["Eliminar `→` y `↔`","Aplicar la distributiva","Eliminar dobles negaciones","Subsumir cláusulas"],a:0,e:"Orden: 1) eliminar → y ↔; 2) De Morgan; 3) doble negación; 4) distributiva; 5) reducir paréntesis; 6) eliminar redundancias."},
{t:4,q:"La forma clausal de `(p → q) ∧ r` es…",o:["`{{¬p, q}; {r}}`","`{{p, q}; {r}}`","`{{¬p, q, r}}`","`{{¬p}; {q}; {r}}`"],a:0,e:"`p → q ≡ ¬p ∨ q`. Cada ∧ separa cláusulas y cada disyunción va entre llaves.",w:{2:"Eso sería `¬p ∨ q ∨ r`, una sola cláusula."}},
{t:4,q:"En el paso a FNC, `(p ∧ q) ∨ r` se transforma en…",o:["`(p ∨ r) ∧ (q ∨ r)`","`(p ∧ r) ∨ (q ∧ r)`","`p ∧ q ∧ r`","`p ∨ q ∨ r`"],a:0,e:"Distributiva de ∨ sobre ∧: `α ∨ (β ∧ γ) ≡ (α ∨ β) ∧ (α ∨ γ)`.",w:{1:"Esa sería la distributiva de ∧ sobre ∨, que lleva a la forma normal disyuntiva, no a la FNC."}},
{t:4,q:"Una FNC es tautología si y sólo si…",o:["Todas sus cláusulas contienen un literal y su opuesto","Tiene alguna cláusula unitaria","No tiene literales puros","Contiene la cláusula vacía"],a:0,e:"Cada cláusula trivial vale V; si todas lo son, la conjunción es V. Una cláusula no trivial da un contraejemplo.",w:{3:"Si contiene `□`, es insatisfacible."}},
{t:4,q:"Propagar un literal `l` en una FNC consiste en…",o:["Eliminar las cláusulas que contienen l y quitar ¬l de las demás","Eliminar las cláusulas que contienen ¬l y quitar l de las demás","Añadir l a todas las cláusulas","Eliminar todas las apariciones de l y de ¬l"],a:0,e:"Suponemos l = V: las cláusulas con l ya se cumplen (desaparecen) y ¬l vale F (neutro de ∨, se borra).",w:{1:"Eso es propagar ¬l."}},
{t:4,q:"Sea `ξ = p ∧ (q ∨ r) ∧ (¬r ∨ ¬q)`. ¿Cuánto vale `ξ(q)`?",o:["`p ∧ ¬r`","`p ∧ r`","`p ∧ (q ∨ r)`","`p`"],a:0,e:"Se cancela la cláusula `(q ∨ r)` y la ocurrencia `¬q`, quedando `p ∧ ¬r`.",w:{1:"Eso es `ξ(¬q)`."}},
{t:4,q:"La propagación de literales…",o:["Mantiene la satisfacibilidad pero no la equivalencia lógica","Mantiene la equivalencia lógica","No mantiene ni la satisfacibilidad ni la equivalencia","Convierte la fórmula en tautología"],a:0,e:"`ξ ≢ ξ(l)`, pero ξ con ν(l)=V se comporta igual que ξ(l). Si se llega a ∅, los literales propagados forman un modelo."},
{t:4,q:"Un literal es PURO en un conjunto de cláusulas cuando…",o:["Su complementario no aparece en ninguna cláusula","Aparece en todas las cláusulas","Forma una cláusula unitaria","Aparece con y sin negación"],a:0,e:"Se puede propagar sin riesgo: al propagar un literal puro nunca se obtiene `□`."},
{t:4,q:"En `{{p, ¬q, ¬r}; {p, r}; {¬p, ¬q}}`, ¿qué literal es puro?",o:["`¬q`","`p`","`r`","`¬p`"],a:0,e:"`q` nunca aparece sin negar. `p`/`¬p` y `r`/`¬r` aparecen con los dos signos."},
{t:4,q:"En DPLL, una rama llega a `□`. ¿Qué se hace?",o:["Backtracking: volver a la última ramificación y probar el literal opuesto","Concluir que la fórmula es insatisfacible","Concluir que la fórmula es tautología","Eliminar la última cláusula y seguir"],a:0,e:"Sólo es insatisfacible si TODAS las ramas, incluidas las dos de la primera ramificación, acaban en `□`.",w:{1:"Sólo si no ha habido ninguna ramificación o se han explorado todas las ramas."}},
{t:4,q:"Con DPLL podemos afirmar que una FNC es TAUTOLOGÍA cuando…",o:["La regla de la tautología aplicada al inicio deja ∅","Alguna rama llega a ∅","Todas las ramas llegan a `□`","Hay un literal puro"],a:0,e:"En cualquier otro caso, llegar a ∅ sólo indica satisfacible.",w:{1:"Eso sólo demuestra que es satisfacible."}},
{t:4,q:"La regla de inclusión de DPLL dice que si `C₁ ⊆ C₂`…",o:["Se elimina C₂","Se elimina C₁","Se eliminan ambas","Se ramifica por C₁"],a:0,e:"C₂ está subsumida: si se cumple C₁ se cumple C₂, así que C₂ no aporta nada."},
{t:4,q:"Orden de aplicación de las reglas de DPLL:",o:["Tautología, unitaria, literal puro, inclusión, ramificación","Ramificación, tautología, unitaria, puro, inclusión","Unitaria, ramificación, puro, tautología, inclusión","Inclusión, puro, unitaria, ramificación, tautología"],a:0,e:"Ramificar es lo último porque multiplica el trabajo."},
{t:4,q:"La resolvente de `{¬q, r}` y `{q, r, ¬s}` respecto de q es…",o:["`{r, ¬s}`","`{¬q, r, ¬s}`","`□`","`{q, ¬q, r, ¬s}`"],a:0,e:"Se quitan q y ¬q y se unen el resto de literales (r repetida se escribe una vez)."},
{t:4,q:"¿Qué se obtiene al resolver `{p, q}` con `{¬p, ¬q}`?",o:["Una cláusula tautológica, no `□`","La cláusula vacía `□`","`{p, ¬p}` y `{q, ¬q}` a la vez","`∅`"],a:0,e:"Se resuelve sobre UN solo literal cada vez: respecto de p sale `{q, ¬q}`, que es tautología y se descarta.",w:{1:"Error muy típico: no se pueden eliminar dos pares de literales en el mismo paso."}},
{t:4,q:"¿Qué NO puede hacer el método de resolución?",o:["Decidir directamente si una fórmula es tautología","Demostrar que un conjunto es insatisfacible","Validar un razonamiento por refutación","Trabajar con forma clausal"],a:0,e:"Resolución no encuentra interpretaciones (ni modelos ni contramodelos); sólo garantiza insatisfacibilidad si sale `□`."},
{t:4,q:"En la estrategia de conjunto soporte…",o:["El CS inicial son las cláusulas de la conclusión negada y un padre de cada resolución es del CS","El CS son las premisas y nunca se resuelven entre sí","Se resuelven primero todas las premisas entre sí","El CS son las cláusulas unitarias"],a:0,e:"Toda resolvente con un padre en el CS también entra en el CS. Si se obtiene `□`, el razonamiento es válido."},
{t:4,q:"Sobre las estrategias de dirección en resolución:",o:["Saturación por niveles es completa; primero en profundidad no","Ambas son completas","Ninguna es completa","Primero en profundidad es completa; saturación no"],a:0,e:"Saturación (primero en anchura) obtiene todas las resolventes de un nivel antes de pasar al siguiente: completa pero ineficiente."},
{t:4,q:"¿Cuáles son estrategias de SIMPLIFICACIÓN en resolución?",o:["Eliminar literales puros, tautologías y cláusulas subsumidas","Conjunto soporte y resolución lineal","Saturación por niveles y primero en profundidad","Ramificación y backtracking"],a:0,e:"Siempre se combinan con la estrategia elegida. Conjunto soporte es de restricción; saturación es de dirección."},
{t:4,q:"Si TODAS las hojas de un árbol semántico son nodos ÉXITO, la fórmula es…",o:["Tautología","Satisfacible pero no tautología","Insatisfacible","Falseable"],a:0,e:"Al menos un éxito: satisfacible. Todos éxito: tautología. Al menos un fallo: falseable. Todos fallo: insatisfacible."},
{t:4,q:"Si un árbol semántico tiene al menos un nodo FALLO, la fórmula es…",o:["Falseable","Insatisfacible","Tautología","Satisfacible seguro"],a:0,e:"Un nodo fallo es una interpretación que la hace F. Para ser insatisfacible tendrían que serlo todas las hojas."},
{t:4,q:"¿Cuál de estas es una α-fórmula?",o:["`¬(p → q)`","`p ∨ q`","`p → q`","`¬(p ∧ q)`"],a:0,e:"`¬(p → q)` ≡ `p ∧ ¬q`: componentes p y ¬q en un único nodo. Las demás son β-fórmulas (abren dos ramas)."},
{t:4,q:"En un tableau, la β-fórmula `¬(ψ ∧ φ)` se descompone en…",o:["Dos ramas: `¬ψ` | `¬φ`","Un nodo con `¬ψ, ¬φ`","Dos ramas: `ψ` | `φ`","Un nodo con `ψ, ¬φ`"],a:0,e:"`¬(ψ ∧ φ) ≡ ¬ψ ∨ ¬φ`: comportamiento disyuntivo, una componente en cada rama.",w:{1:"Eso sería `¬(ψ ∨ φ)`, que es una α-fórmula."}},
{t:4,q:"Una hoja de un tableau está CERRADA cuando…",o:["Contiene un literal y su opuesto","Sólo contiene literales positivos","No tiene fórmulas","Contiene una β-fórmula"],a:0,e:"Tableau cerrado (todas las hojas cerradas) ⇒ insatisfacible. Abierto ⇒ satisfacible, y cada hoja abierta da un modelo."},
{t:4,q:"¿Cómo se comprueba con tableaux que Φ es una tautología?",o:["Construyendo el tableau de `¬Φ` y viendo que se cierra","Viendo que el tableau de Φ es abierto","Viendo que el tableau de Φ es cerrado","No se puede con tableaux"],a:0,e:"Φ tautología ⟺ ¬Φ insatisfacible ⟺ tableau de ¬Φ cerrado.",w:{1:"Abierto sólo demuestra que Φ es satisfacible.",2:"Cerrado demostraría que Φ es insatisfacible."}},
{t:4,q:"Para validar un razonamiento con tableaux, en la raíz se pone…",o:["Las premisas y la conclusión negada","Las premisas y la conclusión","Sólo la conclusión negada","La conclusión y las premisas negadas"],a:0,e:"Si el tableau se cierra, es válido; si queda una hoja abierta, esa hoja es un contraejemplo."},
{t:4,q:"Para el planteamiento DIRECTO (ver si `α₁ ∧ … ∧ αₙ → β` es tautología), ¿qué técnicas NO son aplicables directamente?",o:["Resolución y tableaux","Tablas de verdad y árboles semánticos","DPLL y tablas de verdad","Árboles semánticos y DPLL"],a:0,e:"Resolución y tableaux sólo detectan insatisfacibilidad. Para el directo sirven tablas (todo V), árboles (todo éxito) y DPLL (regla de tautología deja ∅)."},
{t:4,q:"¿Es satisfacible `{{¬p}; {p, q}; {p, ¬q}}`?",o:["No: es insatisfacible","Sí, con p=F y q=V","Sí, con p=V","Es una tautología"],a:0,e:"Unitaria ¬p ⇒ `{{q}; {¬q}}` ⇒ propagar q ⇒ `□`. Sin ramificaciones, no hay alternativa: insatisfacible."},
{t:4,q:"Aplicando DPLL a `{{p, q, r}; {¬p, q}; {¬p, ¬q, ¬r, r}}` se obtiene…",o:["Satisfacible, con ν(q)=V","Insatisfacible","Tautología","Satisfacible sólo con p=V"],a:0,e:"La tercera cláusula es tautológica y se elimina. Después q es puro: `ξ(q) = ∅`.",w:{2:"Para ser tautología, la regla de la tautología tendría que eliminar TODAS las cláusulas."}},
{t:4,q:"Como norma general, para comprobar satisfacibilidad conviene ___ y para insatisfacibilidad ___.",o:["DPLL; resolución","Resolución; DPLL","Tableaux; tablas de verdad","Árboles semánticos; DPLL"],a:0,e:"DPLL da el modelo si lo hay; resolución está pensada para llegar a `□`."},
{t:4,q:"Al validar `{…} ⊨ r ∨ s` por resolución con conjunto soporte, el CS inicial es…",o:["`{¬r}` y `{¬s}`","`{¬r, ¬s}`","`{r, s}`","`{r}` y `{s}`"],a:0,e:"`¬(r ∨ s) ≡ ¬r ∧ ¬s`: dos cláusulas unitarias.",w:{1:"Eso sería `¬r ∨ ¬s` ≡ `¬(r ∧ s)`."}},
{t:4,q:"En DPLL, si al propagar sucesivamente se llega a `∅`…",o:["La FNC es satisfacible y los literales propagados forman un modelo","La FNC es insatisfacible","La FNC es una tautología","Hay que hacer backtracking"],a:0,e:"Las variables no propagadas pueden tomar cualquier valor."},
{t:4,q:"La cláusula `{p, ¬p, q}` en DPLL…",o:["Se elimina por la regla de la tautología","Se propaga por ser unitaria","Indica que la fórmula es insatisfacible","Obliga a ramificar por p"],a:0,e:"Contiene un par de literales complementarios: siempre vale V y no aporta nada."},
{t:4,q:"La forma clausal de `¬(p ∧ q)` es…",o:["`{{¬p, ¬q}}`","`{{¬p}; {¬q}}`","`{{p, q}}`","`{{¬p, q}}`"],a:0,e:"De Morgan: `¬p ∨ ¬q`, una única cláusula.",w:{1:"Eso sería `¬p ∧ ¬q` ≡ `¬(p ∨ q)`."}},
{t:4,q:"La forma clausal de `¬(p ∨ q)` es…",o:["`{{¬p}; {¬q}}`","`{{¬p, ¬q}}`","`{{p}; {q}}`","`{{¬p, q}}`"],a:0,e:"De Morgan: `¬p ∧ ¬q`: dos cláusulas unitarias.",w:{1:"Eso sería `¬p ∨ ¬q` ≡ `¬(p ∧ q)`."}},
{t:4,q:"La FNC de `p ↔ q` es…",o:["`(¬p ∨ q) ∧ (¬q ∨ p)`","`(p ∨ q) ∧ (¬p ∨ ¬q)`","`(p ∧ q) ∨ (¬p ∧ ¬q)`","`¬p ∨ q`"],a:0,e:"`p ↔ q ≡ (p → q) ∧ (q → p)` y cada implicación pasa a disyunción.",w:{2:"Es equivalente, pero está en forma normal disyuntiva, no en FNC."}},
{t:4,q:"La forma clausal de `p → (q ∧ r)` es…",o:["`{{¬p, q}; {¬p, r}}`","`{{¬p, q, r}}`","`{{p, q}; {p, r}}`","`{{¬p}; {q}; {r}}`"],a:0,e:"`¬p ∨ (q ∧ r) ≡ (¬p ∨ q) ∧ (¬p ∨ r)` por distributiva."},
{t:4,q:"La forma clausal de `(p ∨ q) → r` es…",o:["`{{¬p, r}; {¬q, r}}`","`{{¬p, ¬q, r}}`","`{{p, q, r}}`","`{{¬p, r}; {q, r}}`"],a:0,e:"`¬(p ∨ q) ∨ r ≡ (¬p ∧ ¬q) ∨ r ≡ (¬p ∨ r) ∧ (¬q ∨ r)`.",w:{1:"Esa es la de `(p ∧ q) → r`."}},
{t:4,q:"La forma clausal de `(p ∧ q) → r` es…",o:["`{{¬p, ¬q, r}}`","`{{¬p, r}; {¬q, r}}`","`{{p, q, r}}`","`{{¬p}; {¬q}; {r}}`"],a:0,e:"`¬(p ∧ q) ∨ r ≡ ¬p ∨ ¬q ∨ r`: una sola cláusula.",w:{1:"Esa es la de `(p ∨ q) → r`."}},
{t:4,q:"Una cláusula unitaria es…",o:["Una cláusula con un único literal","Una cláusula sin literales","Una cláusula tautológica","Un conjunto con una sola cláusula"],a:0,e:"La cláusula sin literales es la vacía `□`.",w:{1:"Esa es la cláusula vacía `□`."}},
{t:4,q:"Una fórmula está en Forma Normal Conjuntiva cuando es…",o:["Una conjunción de cláusulas (disyunciones de literales)","Una disyunción de conjunciones de literales","Una única implicación","Cualquier fbf sin negaciones"],a:0,e:"`(l ∨ l ∨ …) ∧ (l ∨ …) ∧ …`.",w:{1:"Esa es la forma normal disyuntiva."}},
{t:4,q:"La cláusula vacía `□` es insatisfacible…",o:["Por definición","Sólo si se obtiene por resolución","Sólo si el conjunto es vacío","Nunca: es satisfacible"],a:0,e:"Así lo establecen las diapositivas. En cambio, el conjunto vacío de cláusulas `∅` es satisfacible."},
{t:4,q:"En DPLL, la regla de propagación unitaria dice que…",o:["Si hay una cláusula unitaria {l}, se propaga l","Si hay un literal puro, se ramifica","Si hay una cláusula tautológica, se propaga","Si `C₁ ⊆ C₂`, se elimina C₁"],a:0,e:"Para que la cláusula `{l}` se cumpla, l tiene que ser V: no hay elección."},
{t:4,q:"En DPLL, ¿cuándo se aplica la regla de ramificación?",o:["Cuando no se puede aplicar ninguna otra regla","Siempre al principio","Cuando aparece `□`","Cuando hay un literal puro"],a:0,e:"Se elige un literal l y se estudian `ξ ∪ {l}` y `ξ ∪ {¬l}` (con backtracking si hace falta)."},
{t:4,q:"Aplicando DPLL a `{{p, q}; {¬p}}` se obtiene…",o:["Satisfacible, con p=F y q=V","Insatisfacible","Tautología","Satisfacible con p=V"],a:0,e:"Unitaria ¬p ⇒ `{{q}}` ⇒ unitaria q ⇒ `∅`."},
{t:4,q:"Aplicando DPLL a `{{p}; {¬p, q}; {¬q}}` se obtiene…",o:["Insatisfacible","Satisfacible con p=V, q=V","Satisfacible con p=V, q=F","Tautología"],a:0,e:"Propagar p: `{{q}; {¬q}}`; propagar q: `□`. No hubo ramificación: insatisfacible."},
{t:4,q:"¿Qué se obtiene al resolver `{p}` con `{¬p}`?",o:["La cláusula vacía `□`","El conjunto vacío `∅`","`{p, ¬p}`","Nada: no se pueden resolver"],a:0,e:"Dos cláusulas unitarias con literales complementarios dan `□`: el conjunto es insatisfacible."},
{t:4,q:"La regla de resolución en L0 se basa en la consecuencia lógica…",o:["`{α ∨ p, β ∨ ¬p} ⊨ α ∨ β`","`{α ∨ p, β ∨ p} ⊨ α ∧ β`","`{α ∧ p, β ∧ ¬p} ⊨ α ∨ β`","`{α → p} ⊨ α`"],a:0,e:"Por eso la resolución tiene sentido de técnica semántica: `{C₁; C₂} ⊨ Rₗ(C₁; C₂)`."},
{t:4,q:"¿Qué ocurre si dos cláusulas no tienen ningún par de literales complementarios?",o:["No se obtiene ninguna resolvente","Su resolvente es `□`","Su resolvente es `∅`","Se resuelven por el primer literal"],a:0,e:"La resolución exige un literal en C₁ y su complementario en C₂."},
{t:4,q:"Con resolución por saturación, si se han obtenido todas las resolventes posibles y NO aparece `□`, el conjunto es…",o:["Satisfacible","Insatisfacible","Tautología","No se puede decir nada"],a:0,e:"Es lo que se concluye en los ejercicios resueltos. Aun así, la resolución no dice cuál es el modelo."},
{t:4,q:"El método de resolución fue planteado por…",o:["Robinson, en 1965","Cook, en 1971","Davis y Putnam, en 1960","Boole, en 1847"],a:0,e:"Se conoce también como algoritmo de unificación de Robinson."},
{t:4,q:"El algoritmo DPLL (1962) debe su nombre a…",o:["Davis, Putnam, Logemann y Loveland","Davis, Peano, Leibniz y Lovelace","Dijkstra, Pascal, Lamport y Liskov","Dos Procedimientos de Literales Lógicos"],a:0,e:"Antes de él existía el algoritmo DP (1960)."},
{t:4,q:"La estrategia de saturación por niveles corresponde a una búsqueda…",o:["Primero en anchura","Primero en profundidad","Aleatoria","Por conjunto soporte"],a:0,e:"Obtiene todas las resolventes de nivel i antes de pasar al nivel i+1."},
{t:4,q:"La estrategia de conjunto soporte se usa cuando…",o:["Queremos probar la insatisfacibilidad que surge al validar un razonamiento por refutación","Queremos encontrar todos los modelos","La fórmula no está en FNC","Queremos demostrar directamente que una fórmula es tautología"],a:0,e:"El CS parte de las cláusulas de la conclusión negada. Es una estrategia completa."},
{t:4,q:"La cláusula `k₁` subsume a `k₂` si…",o:["`k₁ ⊆ k₂`","`k₂ ⊆ k₁`","Tienen un literal complementario","Tienen el mismo número de literales"],a:0,e:"Entonces se elimina k₂, la subsumida. Ej.: `{p}` subsume a `{p, q}`."},
{t:4,q:"En `{{p}; {p, q}; {¬q, r}}`, por inclusión (subsunción) se elimina…",o:["`{p, q}`","`{p}`","`{¬q, r}`","Ninguna"],a:0,e:"`{p} ⊆ {p, q}`: si se cumple {p}, se cumple {p, q}."},
{t:4,q:"La estrategia de eliminación de literales puros en resolución consiste en…",o:["Eliminar todas las cláusulas que contienen literales puros","Eliminar sólo el literal puro de cada cláusula","Añadir el complementario del literal puro","Ramificar por el literal puro"],a:0,e:"Esas cláusulas se satisfacen haciendo V el literal puro, sin afectar a las demás."},
{t:4,q:"En un árbol semántico, cada vez que se elige una variable…",o:["Se abren dos ramas: una con la variable a V y otra a F","Se abre una única rama","Se transforma la fórmula a FNC","Se resuelven dos cláusulas"],a:0,e:"Se propaga el valor y se evalúa la fórmula resultante; las hojas sólo pueden ser V (éxito) o F (fallo)."},
{t:4,q:"Un NODO ÉXITO en un árbol semántico refleja…",o:["La satisfacibilidad","La falseabilidad","La insatisfacibilidad","Que hay que hacer backtracking"],a:0,e:"Nodo éxito = la fórmula vale V. Nodo fallo = vale F (refleja falseabilidad)."},
{t:4,q:"En el peor caso, un árbol semántico realiza…",o:["Tantas comprobaciones como la tabla de verdad","Una sola comprobación","La mitad de comprobaciones que la tabla","Infinitas comprobaciones"],a:0,e:"Pero suele ser más eficiente: a veces no hace falta propagar todas las variables para llegar a una hoja."},
{t:4,q:"En un tableau, la α-fórmula `ψ ∧ φ` se descompone en…",o:["Un nodo con `ψ` y `φ`","Dos ramas: `ψ` | `φ`","Un nodo con `¬ψ, ¬φ`","Dos ramas: `¬ψ` | `¬φ`"],a:0,e:"Comportamiento conjuntivo: ambas componentes van al mismo nodo hijo."},
{t:4,q:"En un tableau, la β-fórmula `ψ → φ` se descompone en…",o:["Dos ramas: `¬ψ` | `φ`","Dos ramas: `ψ` | `φ`","Un nodo con `¬ψ, φ`","Un nodo con `ψ, ¬φ`"],a:0,e:"`ψ → φ ≡ ¬ψ ∨ φ`: una componente en cada rama.",w:{3:"Esa es la descomposición de `¬(ψ → φ)`, que es una α-fórmula."}},
{t:4,q:"En un tableau, `¬(ψ ∨ φ)` es…",o:["Una α-fórmula con componentes `¬ψ, ¬φ`","Una β-fórmula con ramas `¬ψ` | `¬φ`","Una β-fórmula con ramas `ψ` | `φ`","Un literal"],a:0,e:"`¬(ψ ∨ φ) ≡ ¬ψ ∧ ¬φ`: comportamiento conjuntivo."},

{t:4,q:"Un tableau completado es ABIERTO. Entonces la fórmula raíz es…",o:["Satisfacible","Insatisfacible","Tautología seguro","Contradicción"],a:0,e:"Cada hoja abierta da un modelo."},

{t:4,q:"La clase de complejidad P contiene los problemas de decisión resolubles…",o:["Por una máquina de Turing determinista en tiempo polinómico","Por una máquina no determinista en tiempo polinómico","Sólo en tiempo exponencial","Sin ningún algoritmo"],a:0,e:"NP: máquina NO determinista en tiempo polinómico. Ejemplos de P: buscar u ordenar un vector.",w:{1:"Esa es la clase NP."}},
{t:4,q:"¿Cuál de estos es un problema NP-completo citado en clase?",o:["El problema de la mochila","Ordenar un vector","Buscar un elemento en un vector","Insertar un valor ordenado en un vector"],a:0,e:"También el del viajante y la suma de subconjuntos. Los otros son problemas de la clase P."},
