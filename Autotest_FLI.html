function quiz(){
  const q=S.qs[S.i], a=S.ans[S.i], answered=a!==undefined, n=S.qs.length;
  const opts=q.o.map((o,k)=>{
    let cls="opt";
    if(answered){ if(k===q.a) cls+=" correct"; else if(k===a) cls+=" wrong"; else cls+=" dim"; }
    return `<button class="${cls}" data-k="${k}" id="opt${k}"${answered?" disabled":""}><span class="k">${LETTERS[k]}</span><span class="t">${fmt(o)}</span></button>`;
  }).join("");
  let fb="";
  if(answered){
    if(a===null) fb=`<div class="feedback blank" role="status"><span class="verdict">En blanco</span><p>La correcta es la <b>${LETTERS[q.a]}</b>: ${fmt(q.o[q.a])}</p><p>${fmt(q.e)}</p></div>`;
    else if(a===q.a) fb=`<div class="feedback ok" role="status"><span class="verdict">Correcto</span><p>${fmt(q.e)}</p></div>`;
    else fb=`<div class="feedback bad" role="status"><span class="verdict">Incorrecto · la correcta es la ${LETTERS[q.a]}</span>
      <p><b>${fmt(q.o[q.a])}</b></p><p>${fmt(q.e)}</p>
      ${q.w[a]?`<p class="why"><b>Por qué tu respuesta (${LETTERS[a]}) no es correcta:</b> ${fmt(q.w[a])}</p>`:""}</div>`;
  }
  const last=S.i===n-1;
  const canSwap=newAvailable()>0;
  app.innerHTML=`
  <div class="qhead"><div><span class="eyebrow">${testLabel(S.key)}${S.key==="G"?" · Tema "+q.t:""}${S.batch>1?" · Tanda "+S.batch:""}</span><h2>Pregunta ${S.i+1} de ${n}</h2></div>
    <div class="qtools">
      <button class="btn ghost" id="swap"${canSwap?"":" disabled"} title="${canSwap?"Sustituye todas las preguntas de este test por otras distintas del banco":"Ya estás usando todas las preguntas de este tema"}">↻ Cambiar preguntas</button>
      <button class="btn ghost" id="cheat">Chuletas</button>
      <button class="btn ghost" id="quit">Salir</button>
    </div></div>
  ${S.flash?`<p class="swapnote" role="status">Nuevas preguntas cargadas: ninguna se repite de la tanda anterior.</p>`:""}
  <div class="column" aria-label="Columna de evaluación">${columnHTML()}</div>
  <article class="qcard">
    <p class="qtext">${fmt(q.q)}</p>
    <div class="opts">${opts}</div>
    ${fb}
    <div class="actions">
      ${answered?`<span class="kbd">Intro: ${last?"ver resultados":"siguiente"}</span>`:`<button class="skip" id="blank">No lo sé (dejar en blanco)</button>`}
      ${answered?`<button class="btn" id="next">${last?"Ver resultados":"Siguiente"}</button>`:""}
    </div>
  </article>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(parseInt(b.dataset.k,10)));
  const bl=document.getElementById("blank"); if(bl) bl.onclick=()=>answer(null);
  const nx=document.getElementById("next"); if(nx){nx.onclick=next; nx.focus({preventScroll:true});}
  document.getElementById("swap").onclick=changeQuestions;
  document.getElementById("cheat").onclick=()=>openSheets("quiz");
  document.getElementById("quit").onclick=()=>{S.view="home";render();};
}
function answer(k){ if(S.ans[S.i]!==undefined) return; S.ans[S.i]=k; S.flash=false; quiz(); }
function next(){ S.flash=false; if(S.i<S.qs.length-1){S.i++; quiz(); window.scrollTo({top:0});} else { finish(); } }
function finish(){
  const g=grade(); const prev=store("fli-best-"+S.key);
  if(prev==null||g.nota>prev) store("fli-best-"+S.key,g.nota);
  S.view="results"; render(); window.scrollTo(0,0);
}

function results(){
  const g=grade();
  const failed=S.qs.map((q,k)=>({q,k,a:S.ans[k]})).filter(x=>x.a!==x.q.a);
  let topicBars="";
  if(S.key==="G"){
    topicBars=`<div class="bytopic"><h3>Por temas</h3>`+[1,2,3,4].map(t=>{
      const qs=S.qs.map((q,k)=>({q,k})).filter(x=>x.q.t===t); const ok=qs.filter(x=>S.ans[x.k]===x.q.a).length;
      const pct=qs.length?ok/qs.length*100:0;
      return `<div class="bar"><span>Tema ${t}</span><div class="track"><div class="fill" style="width:${pct}%"></div></div><span class="v">${ok}/${qs.length}</span></div>`;
    }).join("")+`</div>`;
  }
  const msg = g.nota>=9?"Excelente: dominas este bloque.":g.nota>=7?"Muy bien. Repasa los fallos de abajo y estarás listo.":g.nota>=5?"Aprobado, pero hay conceptos que conviene repasar.":"Toca repasar: lee las explicaciones de los fallos y vuelve a intentarlo.";
  const review = failed.length? failed.map(x=>{
    const blank=x.a===null;
    return `<div class="ritem${blank?" blank":""}"><span class="tag">Pregunta ${x.k+1}${S.key==="G"?" · Tema "+x.q.t:""}</span>
      <p><b>${fmt(x.q.q)}</b></p>
      <p class="yours">${blank?"La dejaste en blanco.":`Tu respuesta: ${LETTERS[x.a]}) ${fmt(x.q.o[x.a])}`}</p>
      <p class="right">Correcta: ${LETTERS[x.q.a]}) ${fmt(x.q.o[x.q.a])}</p>
      <p>${fmt(x.q.e)}</p>
      ${!blank&&x.q.w[x.a]?`<p class="muted"><b>Por qué la tuya no:</b> ${fmt(x.q.w[x.a])}</p>`:""}</div>`;
  }).join("") : `<div class="perfect"><b>Sin fallos.</b> Prueba con otro tema o con el test general.</div>`;
  app.innerHTML=`
  <div class="qhead"><div><span class="eyebrow">${testLabel(S.key)} · resultados</span><h2>${msg}</h2></div></div>
  <div class="column" aria-label="Columna de evaluación">${columnHTML()}</div>
  <section class="score">
    <div class="big">${g.nota.toFixed(1)}<small> / 10</small></div>
    <div class="stats">
      <div><b>${g.ok}</b><span>Aciertos</span></div>
      <div><b>${g.bad}</b><span>Fallos</span></div>
      <div><b>${g.blank}</b><span>En blanco</span></div>
    </div>
    <p class="muted" style="margin:0;font-size:14px;flex-basis:100%">${S.penalty?"Nota con penalización: cada fallo resta 1/3 de acierto; las preguntas en blanco no restan.":"Nota sin penalización (puedes activarla en la pantalla de inicio)."}</p>
  </section>
  ${topicBars}
  <div class="actions" style="justify-content:flex-start">
    ${failed.length?`<button class="btn" id="retry">Repetir sólo las ${failed.length} falladas</button>`:""}
    <button class="btn ghost" id="again">Nuevo test con otras preguntas (${testLabel(S.key)})</button>
    <button class="btn ghost" id="cheatr">Repasar con las chuletas</button>
    <button class="btn ghost" id="home">Volver al inicio</button>
  </div>
  <section class="review" aria-label="Repaso de fallos"><h3>Repaso de fallos y preguntas en blanco</h3>${review}</section>`;
  const r=document.getElementById("retry"); if(r) r.onclick=()=>start(S.key, failed.map(x=>x.q));
  document.getElementById("again").onclick=()=>start(S.key);
  document.getElementById("cheatr").onclick=()=>openSheets("results");
  document.getElementById("home").onclick=()=>{S.view="home";render();window.scrollTo(0,0);};
}

const DRILLS={};
function drillHTML(id,title,cards){
  let d=DRILLS[id];
  if(!d||d.cards!==cards){ d=DRILLS[id]={cards,order:shuffle(cards.map((_,k)=>k)),i:0,shown:false}; }
  const c=cards[d.order[d.i]];
  return `<section class="drill" data-drill="${id}" data-title="${esc(title)}">
    <div class="drill-head"><h3>${title}</h3><span class="kbd">Tarjeta ${d.i+1} de ${cards.length}</span></div>
    <p class="drill-front">${fx(c.f)}</p>
    ${d.shown?`<div class="drill-back"><p class="ans">${fx(c.b)}</p>${c.n?`<p class="muted">${fx(c.n)}</p>`:""}</div>`:""}
    <div class="actions">
      ${d.shown?`<button class="btn" data-act="next">Siguiente tarjeta</button>`:`<button class="btn" data-act="show">Ver respuesta</button>`}
      <button class="skip" data-act="shuffle">Barajar y empezar de nuevo</button>
    </div></section>`;
}
function bindDrills(root){
  root.querySelectorAll(".drill [data-act]").forEach(b=>b.onclick=()=>{
    const sec=b.closest(".drill"), id=sec.dataset.drill, d=DRILLS[id], act=b.dataset.act;
    if(act==="show") d.shown=true;
    else if(act==="next"){ d.shown=false; d.i++; if(d.i>=d.cards.length){ d.order=shuffle(d.order); d.i=0; } }
    else if(act==="shuffle"){ d.order=shuffle(d.order); d.i=0; d.shown=false; }
    const tmp=document.createElement("div"); tmp.innerHTML=drillHTML(id,sec.dataset.title,d.cards);
    const fresh=tmp.firstElementChild; sec.replaceWith(fresh); bindDrills(fresh);
    const nb=fresh.querySelector('[data-act="next"],[data-act="show"]'); if(nb) nb.focus({preventScroll:true});
  });
}

{title:"Parcial 1 · curso 23-24",sub:"El examen real del curso pasado.",
test:[
 {t:1,q:"La ley del tercio excluido establece que:",o:["A partir de una oración contradictoria se puede obtener cualquier oración: `¬p ⊢ q`","Las oraciones con doble implicación son verdaderas y falsas a la vez: `(p ↔ ¬p) ⊢ V ∧ F`","Una oración lógica es verdadera o es falsa, no puede existir una tercera opción: `p ∨ ¬p`","Una oración lógica no puede ser, a la vez, tanto verdadera como falsa: `¬(p ∨ ¬p)`"],a:2,e:"Tercio excluido: sólo hay dos valores posibles, V o F, sin tercera opción. Por eso `p ∨ ¬p` es siempre V.",w:{0:"Eso recuerda a la ley de inconsistencia (de una contradicción se sigue cualquier cosa), no al tercio excluido.",3:"«No puede ser a la vez V y F» es el principio de NO CONTRADICCIÓN (y además la fórmula escrita, `¬(p ∨ ¬p)`, es una contradicción)."}},
 {t:2,q:"Si F es un conjunto satisfacible de oraciones, entonces:",o:["Al quitar una oración Fᵢ cualquiera, el conjunto F−{Fᵢ} siempre será insatisfacible.","Al añadir una oración Fᵢ cualquiera, el conjunto F∪{Fᵢ} podría ser satisfacible o insatisfacible.","Al añadir una oración Fᵢ cualquiera, el conjunto F∪{Fᵢ} seguirá siendo satisfacible.","Al quitar una oración Fᵢ cualquiera, el conjunto F−{Fᵢ} podría ser satisfacible o insatisfacible."],a:1,e:"Añadir una fórmula puede quitar todos los modelos (ej.: `{p}` + `¬p`) o no quitarlos. Quitar fórmulas nunca quita modelos: F−{Fᵢ} sigue siendo satisfacible seguro.",w:{0:"Quitar fórmulas sólo puede añadir modelos: F−{Fᵢ} sigue siendo satisfacible.",2:"Contraejemplo: `{p}` es satisfacible, pero `{p, ¬p}` no.",3:"Quitar fórmulas nunca estropea la satisfacibilidad: será satisfacible siempre."}},
 {t:4,q:"Dada la fórmula bien formada `ε = ¬((r → ¬q) ∧ ¬p)`, realiza su forma normal conjuntiva (FNC) y selecciona la respuesta correcta:",o:["FNC: `ε = (r ∨ ¬p) ∧ (¬p ∨ ¬q)` y es una contradicción.","FNC: `ε = (r ∨ ¬p) ∧ (p ∨ q)` y es una tautología.","FNC: `ε = (r ∨ ¬p) ∧ (p ∨ ¬q)` y es contingente.","FNC: `ε = (r ∨ p) ∧ (p ∨ q)` y es contingente."],a:3,e:"`¬((¬r ∨ ¬q) ∧ ¬p)` → De Morgan: `¬(¬r ∨ ¬q) ∨ ¬¬p` → `(r ∧ q) ∨ p` → distributiva: `(r ∨ p) ∧ (q ∨ p)`. Es V con p=V y F con p=F, r=F: contingente."},
 {t:3,q:"Un sistema deductivo es completo:",o:["Siempre y cuando también sea un sistema de razonamiento sólido.","Si se demuestra que `{α₁,…,αₙ} ⊢ β`, se puede comprobar que `{α₁,…,αₙ} ⊨ β`.","Si se comprueba que `{α₁,…,αₙ} ⊨ β`, se puede demostrar que `{α₁,…,αₙ} ⊢ β`.","Si β es una contradicción, entonces se puede demostrar que β es un teorema."],a:2,e:"Completo: todo lo que es válido semánticamente (⊨) se puede demostrar sintácticamente (⊢).",w:{1:"Eso es la SOLIDEZ (corrección): lo demostrado es válido.",0:"Solidez y completitud son propiedades independientes."}},
 {t:4,q:"¿Cuál de las siguientes técnicas SAT vistas en clase permite demostrar de manera directa que una fórmula dada es una tautología?",o:["DPLL","Resolución","Árboles Semánticos","Tableaux Semánticos"],a:2,e:"El árbol semántico se aplica directamente a la fórmula (sin pasarla a FNC): si todas las hojas son nodos ÉXITO, es una tautología. Resolución y tableaux sólo detectan insatisfacibilidad. Ojo: los apuntes también citan DPLL para el planteamiento directo, pero sólo tras pasar a FNC y si la regla de la tautología deja ∅; por eso la opción que trabaja «de manera directa» sobre la fórmula dada es el árbol semántico.",w:{1:"Resolución sólo garantiza insatisfacibilidad; no sirve directamente para tautologías.",3:"Para ver que Φ es tautología con tableaux hay que construir el de ¬Φ y ver que se cierra: no es directo."}},
 {t:2,q:"Dada la fórmula bien formada `(q → ¬p) ∨ (¬r → ¬p)`, ¿cuál de las siguientes fórmulas es equivalente a la fórmula dada?",o:["La fórmula equivalente es `p → (r ∨ ¬q)`","La fórmula equivalente es `¬p → (¬r ∨ ¬q)`","La fórmula equivalente es `(q → ¬p) ∨ ¬r`","La fórmula equivalente es `¬p ∨ (¬r → ¬p)`"],a:0,e:"`(¬q ∨ ¬p) ∨ (r ∨ ¬p)` ≡ `¬p ∨ ¬q ∨ r`. Y `p → (r ∨ ¬q)` ≡ `¬p ∨ r ∨ ¬q`: es la misma.",w:{1:"`¬p → (¬r ∨ ¬q)` ≡ `p ∨ ¬r ∨ ¬q`: cambia el signo de p y de r.",2:"Da `¬q ∨ ¬p ∨ ¬r`: r aparece negada.",3:"`¬p ∨ (r ∨ ¬p)` ≡ `¬p ∨ r`: se ha perdido el `¬q`."}},
 {t:2,q:"Consideremos el conjunto insatisfacible de fórmulas C = {C1, C2} con la siguiente evaluación:",tbl:{h:["p","q","C1","C2"],r:[["V","V","V","F"],["V","F","F","V"],["F","V","F","V"],["F","F","V","F"]]},o:["La evaluación de `C1 → C2` siempre es verdadera (tautología)","La evaluación de `C1 → ¬C2` siempre es falsa (contradicción)","La evaluación de `¬C1 → ¬C2` siempre es falsa (contradicción)","La evaluación de `¬C1 → C2` siempre es verdadera (tautología)"],a:3,e:"En la tabla, C2 vale siempre lo contrario que C1 (C2 ≡ ¬C1). Entonces `¬C1 → C2` ≡ `¬C1 → ¬C1`, que es siempre V.",w:{0:"Falla en la fila 1: V → F = F.",1:"`C1 → ¬C2` ≡ `C1 → C1`: es siempre V, no F.",2:"`¬C1 → ¬C2` ≡ `¬C1 → C1` ≡ C1: es contingente."}},
 {t:5,q:"Indica la respuesta correcta respecto a la Lógica Categórica:",o:["Nos permite expresar las relaciones entre categorías teniendo en cuenta la pertenencia de los elementos a cada categoría.","Nos permite expresar las operaciones entre objetos, no siempre teniendo en cuenta las categorías.","No nos permite expresar la relación entre el objeto y la categoría.","La respuesta a y c son correctas."],a:0,e:"La lógica categórica trabaja con categorías (clases) y las relaciones entre ellas: «todo S es P», «ningún S es P», «algún S es P», «algún S no es P», atendiendo a qué elementos pertenecen a cada categoría. Sí expresa la relación objeto-categoría (pertenencia), así que C es falsa y, con ella, D."},
 {t:5,q:"¿Es la fórmula `∀x (S(x) → ¬P(x))` alguna de las Proposiciones Categóricas en su Forma Normal?",o:["Es una Proposición Universal Afirmativa.","Es una Proposición Universal Negativa.","Es una Proposición Particular Afirmativa.","Es una Proposición Particular Negativa."],a:1,e:"Dice «ningún S es P» (todo lo que es S no es P). Las cuatro formas: universal afirmativa `∀x (S(x) → P(x))`, universal negativa `∀x (S(x) → ¬P(x))`, particular afirmativa `∃x (S(x) ∧ P(x))`, particular negativa `∃x (S(x) ∧ ¬P(x))`."},
 {t:2,q:"Si ε es una tautología y γ una contradicción, se puede afirmar que:",o:["`⊨ ε ∧ γ`","`⊨ ¬ε ∨ γ`","`⊨ ε ∧ ¬γ`","`⊨ ¬γ → ¬ε`"],a:2,e:"ε = V y ¬γ = V en todas las interpretaciones, así que `ε ∧ ¬γ` es una tautología.",w:{0:"V ∧ F = F siempre: es una contradicción.",1:"F ∨ F = F siempre.",3:"V → F = F siempre."}}
],
ex:[
 {kind:"DPLL",pts:0.75,q:ENUN.DPLL,f:"`ε = {t ∨ p, p ∨ q, ¬q ∨ r, ¬r ∨ s, ¬s ∨ ¬p}`",check:Object.assign({a:0},CHK_SAT),sol:{
   pre:["Forma clausal: `{{t, p}; {p, q}; {¬q, r}; {¬r, s}; {¬s, ¬p}}`."],
   steps:["Regla de la tautología: ninguna cláusula tiene un literal y su opuesto → no se aplica.","Propagación unitaria: no hay cláusulas unitarias.","Literal puro: `t` (no aparece `¬t`). Propagamos: `ξ(t) = {{p, q}; {¬q, r}; {¬r, s}; {¬s, ¬p}}`.","Ya no hay unitarias, ni literales puros, ni cláusulas subsumidas (inclusión) → regla de RAMIFICACIÓN por `p`.",[1,"Rama `p`: `ξ(t, p) = {{¬q, r}; {¬r, s}; {¬s}}`."],[1,"Unitaria `¬s`: `ξ(t, p, ¬s) = {{¬q, r}; {¬r}}`."],[1,"Unitaria `¬r`: `ξ(t, p, ¬s, ¬r) = {{¬q}}`."],[1,"Unitaria `¬q`: `ξ(t, p, ¬s, ¬r, ¬q) = ∅`."]],
   end:"Llegamos al conjunto vacío de cláusulas ∅ → SATISFACIBLE. Modelo: ν(t)=V, ν(p)=V, ν(s)=F, ν(r)=F, ν(q)=F. No hace falta explorar la rama `¬p`."}},
 {kind:"Tableaux",pts:2,q:ENUN.TAB,f:"`{¬(p → q), ¬(¬p ∧ ¬r), ¬p → s, ¬r} ⊨ ¬s`",check:Object.assign({a:1},CHK_VAL),sol:{
   pre:[REFUT],
   tree:{steps:["Raíz: `¬(p → q)`, `¬(¬p ∧ ¬r)`, `¬p → s`, `¬r`, `¬¬s`","Doble negación: `¬¬s` → `s`.","α-fórmula `¬(p → q)` → en el mismo nodo: `p`, `¬q`."],
     split:{why:"β-fórmula `¬(¬p ∧ ¬r)` → dos ramas: `¬¬p` | `¬¬r`",br:[
       {lab:"`¬¬p` → `p` (doble negación)",split:{why:"β-fórmula `¬p → s` → dos ramas: `¬¬p` | `s`",br:[
         {lab:"`¬¬p` → `p`",end:{t:"ABIERTA. Literales: `p`, `¬q`, `¬r`, `s`"}},
         {lab:"`s`",end:{t:"ABIERTA. Literales: `p`, `¬q`, `¬r`, `s`"}}]}},
       {lab:"`¬¬r` → `r` (doble negación)",end:{c:1,t:"CERRADA: `r` y `¬r`"}}]}},
   end:"El tableau queda ABIERTO → el razonamiento NO es válido. Contraejemplo (hoja abierta): ν(p)=V, ν(q)=F, ν(r)=F, ν(s)=V. Con ella las cuatro premisas valen V y la conclusión `¬s` vale F."}},
 {kind:"Resolución",pts:1.25,q:ENUN.RES,f:"`{p → (q → r), ¬(p → r)} ⊨ ¬q`",check:Object.assign({a:0},CHK_RES),sol:{
   pre:["Premisas a FNC: `p → (q → r)` ≡ `¬p ∨ ¬q ∨ r`; `¬(p → r)` ≡ `p ∧ ¬r` (dos cláusulas).","Conclusión negada (conjunto soporte): `¬¬q` ≡ `q`."],
   fit:[["1","{¬p, ¬q, r}","Premisa"],["2","{p}","Premisa"],["3","{¬r}","Premisa"],["4","{q}","Conjunto soporte (CS)"],["5","{¬p, r}","Rq(1, 4) · CS · Subsumida(1) · Puro q (4)"],["6","{r}","Rp(2, 5) · CS · Subsumida(5) · Puro p (2)"],["7","□","Rr(3, 6) · CS"]],
   end:"Hemos llegado a la cláusula vacía □ usando refutación → el razonamiento es VÁLIDO."}}
]},
/* ---------- EXAMEN 2 ---------- */
{title:"Simulacro 2",sub:"Mismo formato que el parcial, preguntas nuevas.",
test:[
 {t:1,q:"El principio de no contradicción establece que:",o:["Toda oración es verdadera o falsa, sin tercera opción: `p ∨ ¬p`","De una contradicción se puede obtener cualquier oración.","Una oración no puede ser verdadera y falsa a la vez: `¬(p ∧ ¬p)`","Dos oraciones contradictorias pueden ser verdaderas si son contingentes."],a:2,e:"No contradicción: un hecho y su contrario no pueden darse a la vez. `p ∧ ¬p` es siempre F, así que `¬(p ∧ ¬p)` es siempre V.",w:{0:"Eso es la ley del tercio excluido.",1:"Eso es la ley de inconsistencia `{β, ¬β} ⊨ α`."}},
 {t:2,q:"Si F es un conjunto insatisfacible de oraciones, entonces:",o:["Al añadir una oración Fᵢ cualquiera, F∪{Fᵢ} podría ser satisfacible.","Al añadir una oración Fᵢ cualquiera, F∪{Fᵢ} seguirá siendo insatisfacible.","Al quitar una oración Fᵢ cualquiera, F−{Fᵢ} seguirá siendo insatisfacible.","Al quitar una oración Fᵢ cualquiera, F−{Fᵢ} será siempre satisfacible."],a:1,e:"Añadir fórmulas sólo puede quitar modelos; si no había ninguno, sigue sin haberlo. Al quitar, en cambio, puede pasar cualquier cosa.",w:{2:"Contraejemplo: `{p, ¬p}` es insatisfacible, pero quitando `¬p` queda `{p}`, satisfacible.",3:"Contraejemplo: `{p, ¬p, q ∧ ¬q}` sin `p` sigue siendo insatisfacible."}},
 {t:4,q:"Dada la fbf `ε = ¬(p → (q ∧ ¬r))`, realiza su FNC y selecciona la respuesta correcta:",o:["FNC: `ε = (¬p ∨ ¬q) ∧ r` y es contingente.","FNC: `ε = p ∧ (¬q ∨ r)` y es una tautología.","FNC: `ε = p ∧ (¬q ∨ r)` y es contingente.","FNC: `ε = p ∧ ¬q ∧ r` y es una contradicción."],a:2,e:"`¬(¬p ∨ (q ∧ ¬r))` → De Morgan: `p ∧ ¬(q ∧ ¬r)` → De Morgan: `p ∧ (¬q ∨ r)`. Es V con p=V, q=F y F con p=F: contingente.",w:{1:"La FNC es correcta, pero con p=F vale F: no es tautología."}},
 {t:3,q:"Un sistema deductivo es sólido (correcto):",o:["Si se comprueba que `{α₁,…,αₙ} ⊨ β`, se puede demostrar que `{α₁,…,αₙ} ⊢ β`.","Si se demuestra que `{α₁,…,αₙ} ⊢ β`, se puede comprobar que `{α₁,…,αₙ} ⊨ β`.","Si en él se pueden demostrar β y ¬β.","Sólo si también es completo."],a:1,e:"Sólido: todo lo que se demuestra (⊢) es válido (⊨). Así se puede trabajar sintácticamente con rigor sin usar técnicas SAT.",w:{0:"Eso es la COMPLETITUD.",2:"Eso sería un sistema inconsistente."}},
 {t:4,q:"¿Cuál de las siguientes técnicas SAT NO puede aplicarse directamente para demostrar que una fórmula es una tautología?",o:["Tablas de verdad","Árboles semánticos","DPLL (tras pasar a FNC, con la regla de la tautología)","Tableaux semánticos"],a:3,e:"Los apuntes lo dicen expresamente: ni Resolución ni Tableaux sirven directamente para tautologías, porque sólo detectan insatisfacibilidad. Para ver que Φ es tautología con tableaux hay que hacer el de ¬Φ."},
 {t:2,q:"Dada la fbf `(p → q) ∧ (p → r)`, ¿cuál es equivalente?",o:["`(p ∧ q) → r`","`p → (q ∧ r)`","`(p → q) → r`","`p ∨ (¬q ∧ ¬r)`"],a:1,e:"`(¬p ∨ q) ∧ (¬p ∨ r)` ≡ `¬p ∨ (q ∧ r)` (distributiva al revés) ≡ `p → (q ∧ r)`.",w:{0:"`(p ∧ q) → r` ≡ `¬p ∨ ¬q ∨ r`: es otra fórmula.",3:"Tiene p sin negar y q, r negadas: es justo al revés."}},
 {t:2,q:"Sean C1 y C2 dos fórmulas con la siguiente evaluación:",tbl:{h:["p","q","C1","C2"],r:[["V","V","V","V"],["V","F","V","F"],["F","V","F","F"],["F","F","F","F"]]},o:["`{C1} ⊨ C2`","`{C2} ⊨ C1`","`C1 ≡ C2`","`C1 ∧ ¬C2` es una contradicción"],a:1,e:"En todas las filas donde C2 es V (sólo la 1.ª), C1 también es V: C1 es consecuencia de C2.",w:{0:"Fila 2: C1 = V y C2 = F. Es un contraejemplo.",2:"Valen distinto en la fila 2.",3:"En la fila 2, `C1 ∧ ¬C2` = V ∧ V = V."}},
 {t:5,q:"La proposición categórica «Algún S no es P» se formaliza como:",o:["`∃x (S(x) ∧ ¬P(x))`","`∃x (S(x) → ¬P(x))`","`∀x (S(x) → ¬P(x))`","`¬∃x (S(x) ∧ P(x))`"],a:0,e:"Es la particular negativa: existe algún elemento que es S y no es P. Con el existencial se usa ∧, no →.",w:{1:"Con ∃ y → la fórmula se cumple con cualquier elemento que no sea S: no dice lo que queremos.",2:"Eso es la universal negativa («ningún S es P»).",3:"Equivale a «ningún S es P» (universal negativa)."}},
 {t:3,q:"La lógica proposicional L0 es:",o:["Decidible","Semidecidible","Indecidible","Decidible sólo para fórmulas en FNC"],a:0,e:"Siempre hay un número finito de interpretaciones (2ⁿ), así que siempre se puede determinar consistencia e inconsistencia. La lógica de predicados L1 sólo es semidecidible."},
 {t:2,q:"Si ε es una contradicción y γ es cualquier fórmula, se puede afirmar que:",o:["`⊨ γ → ε`","`⊨ ε ∨ γ`","`⊨ ε ∧ γ`","`⊨ ε → γ`"],a:3,e:"ε es F en todas las interpretaciones; una implicación con antecedente F es siempre V. Por eso `ε → γ` es tautología, sea γ lo que sea.",w:{0:"`γ → ε` ≡ `¬γ`: depende de γ.",1:"`F ∨ γ` ≡ γ: depende de γ.",2:"F ∧ γ = F siempre."}}
],
ex:[
 {kind:"DPLL",pts:0.75,q:ENUN.DPLL,f:"`ε = {p ∨ q, ¬p ∨ r, ¬q ∨ r, ¬r ∨ s, ¬s ∨ ¬r}`",check:Object.assign({a:1},CHK_SAT),sol:{
   pre:["Forma clausal: `{{p, q}; {¬p, r}; {¬q, r}; {¬r, s}; {¬s, ¬r}}`."],
   steps:["Regla de la tautología: no se aplica.","Propagación unitaria: no hay cláusulas unitarias.","Literal puro: todos los átomos aparecen con los dos signos → no hay.","Inclusión: ninguna cláusula está contenida en otra.","RAMIFICACIÓN por `r`.",[1,"Rama `r`: `ξ(r) = {{p, q}; {s}; {¬s}}`."],[1,"Unitaria `s`: `ξ(r, s) = {{p, q}; □}` → aparece la cláusula vacía. Backtracking."],[1,"Rama `¬r`: `ξ(¬r) = {{p, q}; {¬p}; {¬q}}`."],[1,"Unitaria `¬p`: `ξ(¬r, ¬p) = {{q}; {¬q}}`."],[1,"Unitaria `q`: `ξ(¬r, ¬p, q) = {□}`."]],
   end:"Las dos ramas de la ramificación terminan en la cláusula vacía □ → el conjunto es INSATISFACIBLE (no hay modelo)."}},
 {kind:"Tableaux",pts:2,q:ENUN.TAB,f:"`{p → q ∨ r, ¬r, q → s, p} ⊨ s`",check:Object.assign({a:0},CHK_VAL),sol:{
   pre:[REFUT,"Por prioridad, `p → q ∨ r` se lee `p → (q ∨ r)`."],
   tree:{steps:["Raíz: `p → (q ∨ r)`, `¬r`, `q → s`, `p`, `¬s`"],
     split:{why:"β-fórmula `p → (q ∨ r)` → dos ramas: `¬p` | `q ∨ r`",br:[
       {lab:"`¬p`",end:{c:1,t:"CERRADA: `p` y `¬p`"}},
       {lab:"`q ∨ r`",split:{why:"β-fórmula `q ∨ r` → dos ramas: `q` | `r`",br:[
         {lab:"`q`",split:{why:"β-fórmula `q → s` → dos ramas: `¬q` | `s`",br:[
           {lab:"`¬q`",end:{c:1,t:"CERRADA: `q` y `¬q`"}},
           {lab:"`s`",end:{c:1,t:"CERRADA: `s` y `¬s`"}}]}},
         {lab:"`r`",end:{c:1,t:"CERRADA: `r` y `¬r`"}}]}}]}},
   end:"Todas las hojas están CERRADAS → la conjunción de premisas y conclusión negada es insatisfacible → el razonamiento es VÁLIDO."}},
 {kind:"Resolución",pts:1.25,q:ENUN.RES,f:"`{p ∨ q, p → r, q → s, ¬s} ⊨ r`",check:Object.assign({a:0},CHK_RES),sol:{
   pre:["Premisas a FNC: `p ∨ q`; `p → r` ≡ `¬p ∨ r`; `q → s` ≡ `¬q ∨ s`; `¬s`.","Conclusión negada (conjunto soporte): `¬r`."],
   fit:[["1","{p, q}","Premisa"],["2","{¬p, r}","Premisa"],["3","{¬q, s}","Premisa"],["4","{¬s}","Premisa"],["5","{¬r}","Conjunto soporte (CS)"],["6","{¬p}","Rr(2, 5) · CS · Subsumida(2) · Puro ¬r (5)"],["7","{q}","Rp(1, 6) · CS · Subsumida(1) · Puro ¬p (6)"],["8","{s}","Rq(3, 7) · CS · Subsumida(3) · Puro q (7)"],["9","□","Rs(4, 8) · CS"]],
   end:"Llegamos a la cláusula vacía □ → el razonamiento es VÁLIDO."}}
]},
/* ---------- EXAMEN 3 ---------- */
{title:"Simulacro 3",sub:"Mismo formato que el parcial, preguntas nuevas.",
test:[
 {t:1,q:"Un razonamiento es válido cuando:",o:["Las premisas y la conclusión son verdaderas.","La conclusión es una tautología.","Si las premisas fueran verdaderas, la conclusión lo sería necesariamente.","Las premisas son satisfacibles."],a:2,e:"Validez = es imposible que las premisas sean V y la conclusión F. No depende de si de hecho lo son.",w:{0:"Premisas y conclusión pueden ser verdaderas sin que la conclusión se siga de las premisas.",1:"No hace falta: sólo tiene que ser V cuando las premisas lo son."}},
 {t:2,q:"El conjunto F = {`p → q`, `p`, `¬q`} es:",o:["Satisfacible, con ν(p)=V y ν(q)=F","Satisfacible, con ν(p)=F","Insatisfacible","Un conjunto de contradicciones"],a:2,e:"`p` obliga a p=V y `¬q` a q=F; entonces `p → q` = V → F = F. No hay ninguna interpretación que haga V a las tres.",w:{0:"Con esa interpretación `p → q` vale F.",1:"Entonces la fórmula `p` vale F.",3:"Cada fórmula por separado es satisfacible; lo que es insatisfacible es el conjunto."}},
 {t:4,q:"Dada la fbf `ε = (p ↔ q) ∨ r`, realiza su FNC y selecciona la respuesta correcta:",o:["FNC: `ε = (¬p ∨ q) ∧ (p ∨ ¬q) ∧ r` y es contingente.","FNC: `ε = (p ∨ q ∨ r) ∧ (¬p ∨ ¬q ∨ r)` y es contingente.","FNC: `ε = (¬p ∨ q ∨ r) ∧ (p ∨ ¬q ∨ r)` y es una tautología.","FNC: `ε = (¬p ∨ q ∨ r) ∧ (p ∨ ¬q ∨ r)` y es contingente."],a:3,e:"`p ↔ q` ≡ `(¬p ∨ q) ∧ (¬q ∨ p)`; distributiva con `∨ r`: `(¬p ∨ q ∨ r) ∧ (p ∨ ¬q ∨ r)`. Es F con p=V, q=F, r=F: contingente.",w:{0:"La r tiene que repartirse en cada cláusula, no quedar aparte con ∧.",2:"Con p=V, q=F, r=F vale F: no es tautología."}},
 {t:3,q:"Una teoría es semidecidible cuando:",o:["Existen procedimientos para determinar la inconsistencia y sólo a veces la consistencia.","Existen procedimientos para determinar tanto la consistencia como la inconsistencia.","No es posible determinar ni la consistencia ni la inconsistencia.","Sólo es posible determinar la consistencia."],a:0,e:"Decidible: ambas. Semidecidible: la inconsistencia sí, la consistencia sólo a veces (es el caso de L1). Indecidible: ninguna.",w:{1:"Eso es decidible.",2:"Eso es indecidible."}},
 {t:4,q:"En el algoritmo DPLL, tras aplicar la regla de ramificación, una rama llega a la cláusula vacía □. Entonces:",o:["La fórmula es insatisfacible.","Hay que hacer backtracking y probar la otra rama.","La fórmula es una tautología.","Se elimina la cláusula vacía y se sigue propagando."],a:1,e:"Una rama con □ sólo cierra ESA rama. Sólo es insatisfacible si todas las ramas acaban en □.",w:{0:"Sólo si todas las ramas acaban en □ (o no se ha ramificado)."}},
 {t:2,q:"Dada la fbf `¬(p ∨ ¬q) → r`, ¿cuál es equivalente?",o:["`(¬p ∧ q) ∧ r`","`q → (p ∨ r)`","`¬p ∨ q ∨ r`","`q ∧ ¬p → ¬r`"],a:1,e:"`¬¬(p ∨ ¬q) ∨ r` ≡ `p ∨ ¬q ∨ r`. Y `q → (p ∨ r)` ≡ `¬q ∨ p ∨ r`: la misma.",w:{2:"Cambia los signos de p y q.",3:"Da `¬q ∨ p ∨ ¬r`: r aparece negada."}},
 {t:2,q:"La fórmula `(p → q) ∨ (q → p)` es:",o:["Contingente","Una contradicción","Una tautología","Insatisfacible"],a:2,e:"`¬p ∨ q ∨ ¬q ∨ p`: contiene `q ∨ ¬q`, así que es siempre V. Curioso pero cierto: de cualquier par de proposiciones, una implica a la otra.",w:{0:"No hay ninguna fila F: para que fuese F haría falta q=F (primera) y q=V (segunda) a la vez."}},
 {t:5,q:"«Ningún alumno está matriculado» corresponde a la forma normal categórica:",o:["Universal afirmativa","Universal negativa","Particular afirmativa","Particular negativa"],a:1,e:"«Ningún S es P»: `∀x (A(x) → ¬M(x))`, universal negativa. En un diagrama de Euler, los dos círculos no se tocan."},
 {t:2,q:"«Iré a la playa sólo si hace sol» (p: voy a la playa, q: hace sol) se formaliza como:",o:["`q → p`","`p ↔ q`","`¬q → p`","`p → q`"],a:3,e:"Lo que va detrás de «sólo si» es el consecuente: si he ido a la playa, es que hacía sol.",w:{0:"Esa sería «iré a la playa SI hace sol».",1:"Eso sería «si y sólo si»."}},
 {t:3,q:"Para validar `{α₁,…,αₙ} ⊨ β` por refutación hay que comprobar que:",o:["`α₁ ∧ … ∧ αₙ ∧ ¬β` es una contradicción.","`α₁ ∧ … ∧ αₙ → β` es una tautología.","`α₁ ∧ … ∧ αₙ ∧ β` es satisfacible.","`¬β` es una tautología."],a:0,e:"Refutación: premisas + conclusión negada; si es imposible que se cumplan a la vez, el razonamiento es válido.",w:{1:"Ese es el planteamiento DIRECTO (también correcto, pero es el otro)."}}
],
ex:[
 {kind:"DPLL",pts:0.75,q:ENUN.DPLL,f:"`ε = {p ∨ q ∨ r, ¬p ∨ ¬q, ¬p ∨ ¬r, ¬q ∨ ¬r, p ∨ ¬q}`",check:Object.assign({a:0},CHK_SAT),sol:{
   pre:["Forma clausal: `{{p, q, r}; {¬p, ¬q}; {¬p, ¬r}; {¬q, ¬r}; {p, ¬q}}`."],
   steps:["Regla de la tautología: no se aplica.","Propagación unitaria: no hay cláusulas unitarias.","Literal puro: no hay (p, q y r aparecen con los dos signos).","Inclusión: no hay cláusulas subsumidas.","RAMIFICACIÓN por `q`.",[1,"Rama `q`: `ξ(q) = {{¬p}; {¬p, ¬r}; {¬r}; {p}}`."],[1,"Unitaria `¬p`: `ξ(q, ¬p) = {{¬r}; □}` → cláusula vacía (de `{p}`). Backtracking."],[1,"Rama `¬q`: `ξ(¬q) = {{p, r}; {¬p, ¬r}}`."],[1,"No hay unitarias ni puros → nueva RAMIFICACIÓN por `p`."],[1,"Rama `p`: `ξ(¬q, p) = {{¬r}}`."],[1,"Unitaria `¬r`: `ξ(¬q, p, ¬r) = ∅`."]],
   end:"Llegamos a ∅ → SATISFACIBLE. Modelo: ν(q)=F, ν(p)=V, ν(r)=F. (Otro modelo válido: ν(q)=F, ν(p)=F, ν(r)=V.)"}},
 {kind:"Tableaux",pts:2,q:ENUN.TAB,f:"`{p → q, ¬(q ∧ r), r ∨ s} ⊨ ¬p`",check:Object.assign({a:1},CHK_VAL),sol:{
   pre:[REFUT],
   tree:{steps:["Raíz: `p → q`, `¬(q ∧ r)`, `r ∨ s`, `¬¬p`","Doble negación: `¬¬p` → `p`."],
     split:{why:"β-fórmula `p → q` → dos ramas: `¬p` | `q`",br:[
       {lab:"`¬p`",end:{c:1,t:"CERRADA: `p` y `¬p`"}},
       {lab:"`q`",split:{why:"β-fórmula `¬(q ∧ r)` → dos ramas: `¬q` | `¬r`",br:[
         {lab:"`¬q`",end:{c:1,t:"CERRADA: `q` y `¬q`"}},
         {lab:"`¬r`",split:{why:"β-fórmula `r ∨ s` → dos ramas: `r` | `s`",br:[
           {lab:"`r`",end:{c:1,t:"CERRADA: `r` y `¬r`"}},
           {lab:"`s`",end:{t:"ABIERTA. Literales: `p`, `q`, `¬r`, `s`"}}]}}]}}]}},
   end:"Queda una hoja ABIERTA → el razonamiento NO es válido. Contraejemplo: ν(p)=V, ν(q)=V, ν(r)=F, ν(s)=V (premisas V, conclusión `¬p` = F)."}},
 {kind:"Resolución",pts:1.25,q:ENUN.RES,f:"`{p → q, r → s, p ∨ r} ⊨ q ∨ s`",check:Object.assign({a:0},CHK_RES),sol:{
   pre:["Premisas a FNC: `¬p ∨ q`; `¬r ∨ s`; `p ∨ r`.","Conclusión negada: `¬(q ∨ s)` ≡ `¬q ∧ ¬s` → el conjunto soporte tiene DOS cláusulas: `{¬q}` y `{¬s}`."],
   fit:[["1","{¬p, q}","Premisa"],["2","{¬r, s}","Premisa"],["3","{p, r}","Premisa"],["4","{¬q}","Conjunto soporte (CS)"],["5","{¬s}","Conjunto soporte (CS)"],["6","{¬p}","Rq(1, 4) · CS · Subsumida(1) · Puro ¬q (4)"],["7","{¬r}","Rs(2, 5) · CS · Subsumida(2) · Puro ¬s (5)"],["8","{r}","Rp(3, 6) · CS · Subsumida(3) · Puro ¬p (6)"],["9","□","Rr(7, 8) · CS"]],
   end:"Llegamos a □ → el razonamiento es VÁLIDO (es el dilema constructivo)."}}
]},
/* ---------- EXAMEN 4 ---------- */
{title:"Simulacro 4",sub:"Mismo formato que el parcial, preguntas nuevas.",
test:[
 {t:1,q:"Los componentes de la lógica clásica son:",o:["Alfabeto, retórica, semántica y tablas de verdad.","Un lenguaje formal, una formalización, una semántica y un sistema de demostración axiomática.","Premisas, conclusión, contraejemplo y modelo.","Sintaxis, pragmática, retórica y semántica."],a:1,e:"1) Lenguaje formal (alfabeto + sintaxis → fbf), 2) formalización (del lenguaje natural al formal), 3) semántica (evaluación), 4) sistema de demostración axiomática (equivalencias e implicaciones lógicas)."},
 {t:2,q:"Si F es un conjunto satisfacible y α es una tautología, entonces F∪{α}:",o:["Podría volverse insatisfacible.","Pasa a ser una tautología.","Sigue siendo satisfacible.","Pasa a ser insatisfacible."],a:2,e:"La tautología es V en todas las interpretaciones, así que no quita ningún modelo: los modelos de F lo siguen siendo.",w:{0:"Eso pasa al añadir una fórmula cualquiera, pero una tautología nunca quita modelos.",1:"El conjunto sólo sería «tautológico» si todas sus fórmulas lo fueran."}},
 {t:4,q:"Dada la fbf `ε = (p → q) → r`, realiza su FNC y selecciona la respuesta correcta:",o:["FNC: `ε = (p ∨ r) ∧ (¬q ∨ r)` y es contingente.","FNC: `ε = ¬p ∨ q ∨ r` y es contingente.","FNC: `ε = (p ∨ r) ∧ (q ∨ r)` y es contingente.","FNC: `ε = (¬p ∨ r) ∧ (¬q ∨ r)` y es contingente."],a:0,e:"`¬(¬p ∨ q) ∨ r` → De Morgan: `(p ∧ ¬q) ∨ r` → distributiva: `(p ∨ r) ∧ (¬q ∨ r)`.",w:{1:"Eso sería la FNC de `p → (q → r)`. La → no es asociativa.",3:"Al negar `¬p ∨ q` queda `p ∧ ¬q`: p sin negar."}},
 {t:3,q:"El teorema de la deducción sintáctica permite afirmar que:",o:["Si `{α₁,…,αₙ} ⊢ β`, entonces `{α₁,…,αₙ₋₁} ⊢ αₙ → β`.","Si `{α₁,…,αₙ} ⊢ β`, entonces `⊨ β`.","Toda tautología es un axioma.","`⊢` y `⊨` son el mismo símbolo."],a:0,e:"Una premisa puede pasar a ser el antecedente de la conclusión. En la práctica: para demostrar `α → β`, se añade α como premisa y se deriva β."},
 {t:4,q:"Sobre el método de Resolución, ¿qué afirmación es correcta?",o:["Permite obtener un modelo de la fórmula.","Sirve para demostrar directamente que una fórmula es una tautología.","No necesita pasar la fórmula a forma clausal.","Si se obtiene la cláusula vacía □, el conjunto de cláusulas es insatisfacible."],a:3,e:"Resolución está pensada para la insatisfacibilidad: si aparece □, el conjunto es insatisfacible. No da interpretaciones y trabaja con forma clausal."},
 {t:2,q:"Dada la fbf `¬(p → q) ∨ ¬(q → p)`, ¿cuál es equivalente?",o:["`¬p ↔ ¬q`","`(p ∧ q) ∨ (¬p ∧ ¬q)`","`¬(p ↔ q)`","`¬p ∨ ¬q`"],a:2,e:"`(p ∧ ¬q) ∨ (q ∧ ¬p)`: es V justo cuando p y q valen distinto, es decir, `¬(p ↔ q)`.",w:{0:"`¬p ↔ ¬q` ≡ `p ↔ q`: justo lo contrario.",1:"Eso es `p ↔ q`."}},
 {t:2,q:"Sean α y β dos fórmulas con la siguiente evaluación:",tbl:{h:["p","q","α","β"],r:[["V","V","V","V"],["V","F","F","V"],["F","V","V","V"],["F","F","V","F"]]},o:["`α ∧ β` es una contradicción","`{α} ⊨ β`","`α ≡ β`","`α ∨ β` es una tautología"],a:3,e:"En cada fila, al menos una de las dos vale V (fila 2: β; fila 4: α), así que `α ∨ β` es siempre V. (α es `p → q` y β es `p ∨ q`.)",w:{0:"En la fila 1 ambas valen V.",1:"Fila 4: α = V y β = F.",2:"Valen distinto en las filas 2 y 4."}},
 {t:5,q:"Dado el conjunto A = {2, {3}, 3, {5}}, ¿cuál de estas afirmaciones es FALSA?",o:["`2 ∈ A`","`{2} ⊆ A`","`{2} ∈ A`","`{5} ∈ A`"],a:2,e:"Los elementos de A son 2, {3}, 3 y {5}. El conjunto {2} no es uno de ellos (∈ falso), aunque sí es un subconjunto porque 2 ∈ A (⊆ verdadero).",w:{1:"Es verdadera: todo elemento de {2} (el 2) pertenece a A.",3:"Es verdadera: {5} aparece tal cual como elemento de A."}},
 {t:2,q:"«Es necesario estudiar para aprobar» (p: estudio, q: apruebo) se formaliza como:",o:["`p → q`","`q → p`","`p ∧ q`","`p ↔ q`"],a:1,e:"Lo necesario va a la derecha: si apruebo, es que he estudiado. Estudiar no garantiza aprobar.",w:{0:"Eso diría que estudiar es SUFICIENTE para aprobar."}},
 {t:3,q:"Si el conjunto de premisas {α₁,…,αₙ} es insatisfacible, entonces:",o:["No se sigue ninguna conclusión.","Sólo se siguen tautologías.","`{α₁,…,αₙ} ⊨ β` para cualquier fórmula β.","`α₁ ∧ … ∧ αₙ → β` es una contradicción."],a:2,e:"No hay ninguna interpretación con todas las premisas V, así que nunca hay contraejemplo: se sigue cualquier β (ley de inconsistencia).",w:{3:"Al revés: con antecedente siempre F, la implicación es siempre V (tautología)."}}
],
ex:[
 {kind:"DPLL",pts:0.75,q:"Transforma la siguiente fórmula a forma clausal y aplica la técnica de DPLL, explicando las reglas que se van aplicando, para indicar si es satisfacible. En caso de serlo, indica un modelo.",f:"`φ = (p → q) ∧ (q → r ∨ s) ∧ (r → ¬p) ∧ p`",check:Object.assign({a:0},CHK_SAT),sol:{
   pre:["`p → q` ≡ `¬p ∨ q`; `q → (r ∨ s)` ≡ `¬q ∨ r ∨ s`; `r → ¬p` ≡ `¬r ∨ ¬p`.","Forma clausal: `{{¬p, q}; {¬q, r, s}; {¬r, ¬p}; {p}}`."],
   steps:["Regla de la tautología: no se aplica.","Unitaria `p`: `ξ(p) = {{q}; {¬q, r, s}; {¬r}}`.","Unitaria `q`: `ξ(p, q) = {{r, s}; {¬r}}`.","Unitaria `¬r`: `ξ(p, q, ¬r) = {{s}}`.","Unitaria `s`: `ξ(p, q, ¬r, s) = ∅`."],
   end:"Llegamos a ∅ sin necesidad de ramificar → SATISFACIBLE. Modelo: ν(p)=V, ν(q)=V, ν(r)=F, ν(s)=V."}},
 {kind:"Tableaux",pts:2,q:ENUN.TAB,f:"`{p ↔ q, q → r, ¬r} ⊨ ¬p`",check:Object.assign({a:0},CHK_VAL),sol:{
   pre:[REFUT],
   tree:{steps:["Raíz: `p ↔ q`, `q → r`, `¬r`, `¬¬p`","Doble negación: `¬¬p` → `p`.","α-fórmula `p ↔ q` → en el mismo nodo: `p → q`, `q → p`."],
     split:{why:"β-fórmula `p → q` → dos ramas: `¬p` | `q`",br:[
       {lab:"`¬p`",end:{c:1,t:"CERRADA: `p` y `¬p`"}},
       {lab:"`q`",split:{why:"β-fórmula `q → r` → dos ramas: `¬q` | `r`",br:[
         {lab:"`¬q`",end:{c:1,t:"CERRADA: `q` y `¬q`"}},
         {lab:"`r`",end:{c:1,t:"CERRADA: `r` y `¬r`"}}]}}]}},
   end:"Todas las hojas CERRADAS (no hace falta descomponer `q → p`) → el razonamiento es VÁLIDO."}},
 {kind:"Resolución",pts:1.25,q:ENUN.RES,f:"`{¬p ∨ q, ¬(q ∧ ¬r), ¬r ∨ s} ⊨ p → s`",check:Object.assign({a:0},CHK_RES),sol:{
   pre:["Premisas a FNC: `¬p ∨ q`; `¬(q ∧ ¬r)` ≡ `¬q ∨ r`; `¬r ∨ s`.","Conclusión negada: `¬(p → s)` ≡ `p ∧ ¬s` → conjunto soporte: `{p}` y `{¬s}`."],
   fit:[["1","{¬p, q}","Premisa"],["2","{¬q, r}","Premisa"],["3","{¬r, s}","Premisa"],["4","{p}","Conjunto soporte (CS)"],["5","{¬s}","Conjunto soporte (CS)"],["6","{q}","Rp(1, 4) · CS · Subsumida(1) · Puro p (4)"],["7","{r}","Rq(2, 6) · CS · Subsumida(2) · Puro q (6)"],["8","{s}","Rr(3, 7) · CS · Subsumida(3) · Puro r (7)"],["9","□","Rs(5, 8) · CS"]],
   end:"Llegamos a □ → el razonamiento es VÁLIDO."}}
]},
/* ---------- EXAMEN 5 ---------- */
{title:"Simulacro 5",sub:"Mismo formato que el parcial, preguntas nuevas.",
test:[
 {t:1,q:"Una proposición es:",o:["Cualquier oración del lenguaje natural.","Una pregunta cuya respuesta es sí o no.","Un enunciado con términos referenciales.","Una fórmula mal formada."],a:2,e:"Oración (entidad lingüística) → enunciado (declarativa con pretensión de verdad) → proposición (enunciado con términos referenciales).",w:{1:"Una pregunta no es declarativa: no es verdadera ni falsa."}},
 {t:2,q:"El conjunto F = {`p ∨ q`, `¬p`, `¬q ∨ r`} es:",o:["Insatisfacible","Satisfacible, con un único modelo: ν(p)=F, ν(q)=V, ν(r)=V","Satisfacible, con ν(p)=V","Una tautología"],a:1,e:"`¬p` obliga a p=F; entonces `p ∨ q` obliga a q=V; y `¬q ∨ r` obliga a r=V. Sólo queda una interpretación posible.",w:{2:"`¬p` sería F."}},
 {t:4,q:"Dada la fbf `ε = ¬(p ∨ q) ∨ (p ∧ r)`, realiza su FNC y selecciona la respuesta correcta:",o:["FNC: `ε = (¬p ∨ r) ∧ (p ∨ ¬q) ∧ (¬q ∨ r)` y es una tautología.","FNC: `ε = (¬p ∨ ¬q) ∧ (p ∨ r)` y es contingente.","FNC: `ε = (p ∨ q) ∧ (¬p ∨ ¬r)` y es contingente.","FNC: `ε = (¬p ∨ r) ∧ (p ∨ ¬q) ∧ (¬q ∨ r)` y es contingente."],a:3,e:"`(¬p ∧ ¬q) ∨ (p ∧ r)` → distributiva: `(¬p ∨ p) ∧ (¬p ∨ r) ∧ (¬q ∨ p) ∧ (¬q ∨ r)` → la cláusula `¬p ∨ p` es V y se elimina. Con p=V, r=F vale F: contingente.",w:{0:"La FNC es correcta, pero con p=V, r=F vale F."}},
 {t:3,q:"Una teoría es inconsistente si:",o:["En ella se puede demostrar una fórmula y su negación.","No tiene ningún teorema.","No es axiomatizable.","Es completa."],a:0,e:"Consistente: puede demostrarse β o ¬β, pero no las dos. Si se demuestran ambas, se sigue cualquier cosa."},
 {t:4,q:"Si TODOS los nodos hoja de un árbol semántico son nodos FALLO, la fórmula es:",o:["Una tautología","Satisfacible","Contingente","Insatisfacible (contradicción)"],a:3,e:"Ninguna interpretación la hace V. Resumen: algún éxito → satisfacible; todos éxito → tautología; algún fallo → falseable; todos fallo → contradicción."},
 {t:2,q:"¿Cuál de las siguientes fórmulas NO es equivalente a `p → q`?",o:["`¬q → ¬p`","`q → p`","`¬p ∨ q`","`¬(p ∧ ¬q)`"],a:1,e:"`q → p` es la recíproca: difiere con p=V, q=F (la original es F y la recíproca V). Las demás son contraposición, interdefinición y su forma con ∧.",w:{0:"Es la contrarrecíproca: sí es equivalente.",3:"`¬(p ∧ ¬q)` ≡ `¬p ∨ q`: sí es equivalente."}},
 {t:4,q:"En un tableau semántico, la fórmula `¬(p ↔ q)` es:",o:["Una α-fórmula con componentes `p → q` y `q → p`","Una β-fórmula con ramas `¬(p → q)` | `¬(q → p)`","Una β-fórmula con ramas `p` | `q`","Un literal"],a:1,e:"`¬(p ↔ q)` ≡ `¬((p → q) ∧ (q → p))` ≡ `¬(p → q) ∨ ¬(q → p)`: comportamiento disyuntivo, una componente en cada rama.",w:{0:"Esa es la descomposición de `p ↔ q` (sin negar)."}},
 {t:5,q:"«Todos los alumnos llegan puntuales» (A: alumno, P: llega puntual) se formaliza como:",o:["`∀x (A(x) ∧ P(x))`","`∃x (A(x) ∧ P(x))`","`∀x (A(x) → P(x))`","`∃x (A(x) → P(x))`"],a:2,e:"Universal afirmativa: todo lo que es alumno llega puntual. Con ∀ se usa →; con ∃, ∧.",w:{0:"Eso diría que TODO el universo son alumnos puntuales."}},
 {t:2,q:"¿Cuántas interpretaciones tiene la fórmula `(p → q) ∧ (r ∨ ¬s) ∧ p`?",o:["8","12","16","4"],a:2,e:"Tiene 4 átomos distintos (p, q, r, s) → 2⁴ = 16. Que p aparezca dos veces no cuenta doble."},
 {t:2,q:"Si ε es una tautología y γ es cualquier fórmula, se puede afirmar que:",o:["`⊨ γ → ε`","`⊨ ε → γ`","`⊨ ε ∧ γ`","`⊨ ¬ε ∨ γ`"],a:0,e:"El consecuente ε es siempre V, y una implicación con consecuente V es siempre V.",w:{1:"`V → γ` ≡ γ: depende de γ.",2:"`V ∧ γ` ≡ γ: depende de γ.",3:"`F ∨ γ` ≡ γ: depende de γ."}}
],
ex:[
 {kind:"DPLL",pts:0.75,q:ENUN.DPLL,f:"`ε = {p ∨ q, p ∨ q ∨ ¬r, ¬p ∨ r, ¬q ∨ ¬r, ¬p ∨ ¬q}`",check:Object.assign({a:0},CHK_SAT),sol:{
   pre:["Forma clausal: `{{p, q}; {p, q, ¬r}; {¬p, r}; {¬q, ¬r}; {¬p, ¬q}}`."],
   steps:["Regla de la tautología: no se aplica.","Propagación unitaria: no hay cláusulas unitarias.","Literal puro: no hay.","Regla de INCLUSIÓN: `{p, q} ⊆ {p, q, ¬r}` → eliminamos `{p, q, ¬r}`. Queda `{{p, q}; {¬p, r}; {¬q, ¬r}; {¬p, ¬q}}`.","Sigue sin haber unitarias ni puros → RAMIFICACIÓN por `p`.",[1,"Rama `p`: `ξ(p) = {{r}; {¬q, ¬r}; {¬q}}`."],[1,"Unitaria `r`: `ξ(p, r) = {{¬q}}`."],[1,"Unitaria `¬q`: `ξ(p, r, ¬q) = ∅`."]],
   end:"Llegamos a ∅ → SATISFACIBLE. Modelo: ν(p)=V, ν(r)=V, ν(q)=F."}},
 {kind:"Tableaux",pts:2,q:ENUN.TAB,f:"`{p → q ∨ r, ¬q, ¬(s ∧ r)} ⊨ ¬p`",check:Object.assign({a:1},CHK_VAL),sol:{
   pre:[REFUT,"Por prioridad, `p → q ∨ r` se lee `p → (q ∨ r)`."],
   tree:{steps:["Raíz: `p → (q ∨ r)`, `¬q`, `¬(s ∧ r)`, `¬¬p`","Doble negación: `¬¬p` → `p`."],
     split:{why:"β-fórmula `p → (q ∨ r)` → dos ramas: `¬p` | `q ∨ r`",br:[
       {lab:"`¬p`",end:{c:1,t:"CERRADA: `p` y `¬p`"}},
       {lab:"`q ∨ r`",split:{why:"β-fórmula `q ∨ r` → dos ramas: `q` | `r`",br:[
         {lab:"`q`",end:{c:1,t:"CERRADA: `q` y `¬q`"}},
         {lab:"`r`",split:{why:"β-fórmula `¬(s ∧ r)` → dos ramas: `¬s` | `¬r`",br:[
           {lab:"`¬s`",end:{t:"ABIERTA. Literales: `p`, `¬q`, `r`, `¬s`"}},
           {lab:"`¬r`",end:{c:1,t:"CERRADA: `r` y `¬r`"}}]}}]}}]}},
   end:"Queda una hoja ABIERTA → el razonamiento NO es válido. Contraejemplo: ν(p)=V, ν(q)=F, ν(r)=V, ν(s)=F."}},
 {kind:"Resolución",pts:1.25,q:ENUN.RES,f:"`{p → q, q → r, r → s, p ∨ t, t → s} ⊨ s`",check:Object.assign({a:0},CHK_RES),sol:{

   fit:[["1","{¬p, q}","Premisa"],["2","{¬q, r}","Premisa"],["3","{¬r, s}","Premisa"],["4","{p, t}","Premisa"],["5","{¬t, s}","Premisa"],["6","{¬s}","Conjunto soporte (CS)"],["7","{¬r}","Rs(3, 6) · CS · Subsumida(3)"],["8","{¬t}","Rs(5, 6) · CS · Subsumida(5) · Puro ¬s (6)"],["9","{¬q}","Rr(2, 7) · CS · Subsumida(2) · Puro ¬r (7)"],["10","{p}","Rt(4, 8) · CS · Subsumida(4) · Puro ¬t (8)"],["11","{¬p}","Rq(1, 9) · CS · Subsumida(1) · Puro ¬q (9)"],["12","□","Rp(10, 11) · CS"]],

]}
];

function fmtN(n){ return (Math.round(n*100)/100).toFixed(2).replace(".",","); }
function examParts(X){
  if(X.id===0) return {title:"Examen aleatorio",test:X.pick.test.map(([e,i])=>EXAMS[e].test[i]),ex:X.pick.ex.map(([e,i])=>EXAMS[e].ex[i])};
  const E=EXAMS[X.id-1]; return {title:E.title,test:E.test,ex:E.ex};
}
function startExam(id,fresh){
  if(!fresh&&S.exam&&!S.exam.done&&S.exam.id===id){ S.view="exam"; render(); window.scrollTo(0,0); return; }
  const X={id,ans:new Array(10).fill(null),res:[null,null,null],self:[null,null,null],done:false,t0:Date.now(),el:0};
  if(id===0){
    const all=[]; EXAMS.forEach((E,e)=>E.test.forEach((_,i)=>all.push([e,i])));
    X.pick={test:shuffle(all).slice(0,10),ex:[0,1,2].map(k=>[Math.floor(Math.random()*EXAMS.length),k])};
  }
  S.exam=X; S.view="exam"; render(); window.scrollTo(0,0);
}
function elapsed(){ const X=S.exam; if(!X) return 0; return X.done? X.el : Date.now()-X.t0; }
function clock(ms){ const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60; return (h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(ss).padStart(2,"0"); }
setInterval(()=>{ if(S.view==="exam"){ const t=document.getElementById("timer"); if(t) t.textContent="⏱ "+clock(elapsed()); } },1000);

function tblHTML(t){ return `<div class="tw" style="align-self:center"><table class="t qtbl"><thead><tr>${t.h.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${t.r.map(r=>`<tr>${r.map(c=>`<td class="tv ${c==="V"?"tv-v":"tv-f"}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; }
function gridHTML(X,P,graded){
  return `<div class="ansgrid" aria-label="Cuadro de respuestas">${P.test.map((q,k)=>{
    const a=X.ans[k]; let cls="v";
    if(graded) cls+= a==null?" blank":a===q.a?" ok":" bad";
    return `<a href="#eq${k}"><span class="n">${k+1}</span><span class="${cls}">${a==null?(graded?"–":""):LETTERS[a]}</span></a>`;
  }).join("")}</div>`;
}
function examLabel(X){ return X.id===0?"Examen aleatorio":X.id===1?"Examen 1 · real":"Examen "+X.id; }

function examView(){
  const X=S.exam, P=examParts(X);
  const answered=X.ans.filter(a=>a!=null).length;
  app.innerHTML=`
  <div class="qhead"><div><span class="eyebrow">${examLabel(X)} · Fundamentos Lógicos de la Informática</span><h2>${esc(P.title)}</h2></div>
    <div class="qtools"><span class="timer" id="timer">⏱ ${clock(elapsed())}</span><button class="btn ghost" id="exquit">Salir</button></div></div>
  <p class="callout rules"><b>Test de teoría (6 puntos):</b> cada acierto vale 0,6 y cada fallo resta 0,2; en blanco no resta. Pulsa otra vez una respuesta para dejarla en blanco.<br><b>Ejercicios (4 puntos):</b> resuélvelos en papel. Al entregar verás la solución paso a paso y te puntuarás tú.<br><span class="muted">Si sales, tus respuestas se guardan y puedes continuar luego.</span></p>
  <section class="sheet" style="gap:14px">
    <h3>Test de teoría</h3>
    <div id="grid">${gridHTML(X,P,false)}</div>
    ${P.test.map((q,k)=>`<article class="qcard" id="eq${k}">
      <p class="qtext"><span class="qn">${k+1}.</span>${fx(q.q)}</p>${q.tbl?tblHTML(q.tbl):""}
      <div class="opts">${q.o.map((o,j)=>`<button class="opt${X.ans[k]===j?" sel":""}" aria-pressed="${X.ans[k]===j}" data-q="${k}" data-k="${j}"><span class="k">${LETTERS[j]}</span><span class="t">${fx(o)}</span></button>`).join("")}</div>
    </article>`).join("")}
    <h3 style="margin-top:12px">Ejercicios de teoría</h3>
    ${P.ex.map((e,k)=>`<article class="qcard">
      <div class="exh"><span class="eyebrow">Ejercicio ${k+1} · ${e.kind}</span><span class="pts">${fmtN(e.pts)} puntos</span></div>
      <p style="margin:0">${fx(e.q)}</p><p class="bigf">${fx(e.f)}</p>
      <p class="muted" style="margin:0">Hazlo en papel. Cuando acabes, marca el resultado que te ha salido:</p>
      <div class="opts row">${e.check.o.map((o,j)=>`<button class="opt${X.res[k]===j?" sel":""}" aria-pressed="${X.res[k]===j}" data-x="${k}" data-k="${j}"><span class="k">${LETTERS[j]}</span><span class="t">${fx(o)}</span></button>`).join("")}</div>
    </article>`).join("")}
  </section>
  <div class="actions"><span class="muted" id="count">${answered} de 10 preguntas respondidas</span><button class="btn" id="submit">Entregar examen</button></div>`;
  app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.q, j=+b.dataset.k; X.ans[k]= X.ans[k]===j? null : j;
    b.parentElement.querySelectorAll(".opt").forEach(o=>{const on=X.ans[k]===+o.dataset.k; o.classList.toggle("sel",on); o.setAttribute("aria-pressed",on);});
    document.getElementById("grid").innerHTML=gridHTML(X,P,false);
    document.getElementById("count").textContent=X.ans.filter(a=>a!=null).length+" de 10 preguntas respondidas";
  });
  app.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.x, j=+b.dataset.k; X.res[k]= X.res[k]===j? null : j;
    b.parentElement.querySelectorAll(".opt").forEach(o=>{const on=X.res[k]===+o.dataset.k; o.classList.toggle("sel",on); o.setAttribute("aria-pressed",on);});
  });
  document.getElementById("exquit").onclick=()=>{ S.view="home"; render(); window.scrollTo(0,0); };
  document.getElementById("submit").onclick=()=>{ X.el=Date.now()-X.t0; X.done=true; S.view="examres"; render(); window.scrollTo(0,0); };
}

function examGrade(){
  const X=S.exam, P=examParts(X); let ok=0,bad=0,blank=0;
  P.test.forEach((q,k)=>{const a=X.ans[k]; if(a==null) blank++; else if(a===q.a) ok++; else bad++;});
  const test=Math.max(0,ok*0.6-bad*0.2);
  let exs=0,pending=0; P.ex.forEach((e,k)=>{const s=X.self[k]; if(s==null) pending++; else exs+=s*e.pts;});
  return {ok,bad,blank,test,exs,pending,total:test+exs};
}
function branchHTML(b){
  return `<div class="br">${b.lab?`<div class="blab">${fx(b.lab)}</div>`:""}${(b.steps||[]).map(s=>`<div class="bstep">${fx(s)}</div>`).join("")}${b.split?`<div class="bsplit">${fx(b.split.why)}</div><div class="kids">${b.split.br.map(branchHTML).join("")}</div>`:""}${b.end?`<div class="bend ${b.end.c?"closed":"open"}">${b.end.c?"✘ ":"○ "}${fx(b.end.t)}</div>`:""}</div>`;
}
function solHTML(e){
  const s=e.sol; let h=`<div class="solbox"><h4>Solución paso a paso</h4>`;
  if(s.pre) h+=`<ul class="solpre">${s.pre.map(x=>`<li>${fx(x)}</li>`).join("")}</ul>`;
  if(s.steps){ let first=true; h+=`<ol class="steps">${s.steps.map(x=>{ if(Array.isArray(x)){ const lab=x[1].startsWith("Rama")?" first":""; return `<li class="lv1${lab}">${fx(x[1])}</li>`; } return `<li>${fx(x)}</li>`; }).join("")}</ol>`; }
  if(s.tree) h+=`<div class="tree">${branchHTML(s.tree)}</div>`;
  if(s.fit) h+=`<div class="tw"><table class="t fit"><thead><tr><th>#</th><th>Cláusula</th><th>Justificación</th></tr></thead><tbody>${s.fit.map(([n,c,j])=>`<tr><td>${n}</td><td><code class="f">${paint(esc(c))}</code></td><td>${fx(j).replace(/\bR([a-z])\(/g,"R<sub>$1</sub>(")}</td></tr>`).join("")}</tbody></table></div>`;
  h+=`<p class="callout">${fx(s.end)}</p></div>`;
  return h;
}

function examResults(){
  const X=S.exam, P=examParts(X), g=examGrade();
  if(g.pending===0){ const key="fli-exam-best-"+X.id, prev=store(key); if(prev==null||g.total>prev) store(key,Math.round(g.total*100)/100); }
  const msg = g.pending? "Examen entregado: puntúa tus ejercicios abajo" : g.total>=9?"Sobresaliente. Estás listo.":g.total>=7?"Notable. Repasa los fallos y listo.":g.total>=5?"Aprobado. Repasa los fallos para ir más seguro.":"Suspenso por ahora: revisa las explicaciones y vuelve a intentarlo.";
  const testHTML=P.test.map((q,k)=>{
    const a=X.ans[k], st=a==null?"blank":a===q.a?"ok":"bad";
    const verdict=st==="ok"?"✔ Correcta · +0,6":st==="bad"?`✘ Incorrecta · −0,2 · la correcta es la ${LETTERS[q.a]}`:`– En blanco · 0 · la correcta es la ${LETTERS[q.a]}`;
    return `<article class="qcard" id="eq${k}">
      <span class="tag kbd">Pregunta ${k+1} · Tema ${q.t}</span>
      <p class="qtext"><span class="qn">${k+1}.</span>${fx(q.q)}</p>${q.tbl?tblHTML(q.tbl):""}
      <div class="opts">${q.o.map((o,j)=>`<button class="opt ${j===q.a?"correct":j===a?"wrong":"dim"}" disabled><span class="k">${LETTERS[j]}</span><span class="t">${fx(o)}</span></button>`).join("")}</div>
      <p class="verdict-line ${st}" style="margin:0">${verdict}</p>
      <p style="margin:0">${fx(q.e)}</p>
      ${a!=null&&a!==q.a&&q.w&&q.w[a]?`<p class="muted" style="margin:0"><b>Por qué la ${LETTERS[a]} no:</b> ${fx(q.w[a])}</p>`:""}
    </article>`;
  }).join("");
  const exHTML=P.ex.map((e,k)=>{
    const r=X.res[k], okr=r===e.check.a;
    const levels=[[1,`Todo bien · ${fmtN(e.pts)}`],[0.5,`Resultado bien, pero con fallos en el procedimiento · ${fmtN(e.pts/2)}`],[0,"Mal o en blanco · 0"]];
    return `<article class="qcard">
      <div class="exh"><span class="eyebrow">Ejercicio ${k+1} · ${e.kind}</span><span class="pts">${fmtN(e.pts)} puntos</span></div>
      <p style="margin:0">${fx(e.q)}</p><p class="bigf">${fx(e.f)}</p>
      <p class="verdict-line ${r==null?"blank":okr?"ok":"bad"}" style="margin:0">${r==null?"No marcaste resultado. ":okr?"✔ Tu resultado es correcto: ":"✘ Tu resultado no es correcto. "}${r==null||!okr?"Resultado correcto: ":""}${esc(e.check.o[e.check.a])}</p>
      ${solHTML(e)}
      <div class="selfg"><b>¿Cuánto te pondrías?</b><span class="muted" style="font-size:14px">Compara con la solución: ¿has nombrado cada regla aplicada (tautología, unitaria, literal puro, inclusión, ramificación · α/β · subsumida/puro) y has dado el modelo o el contraejemplo cuando tocaba? Si el resultado final está mal, no te pongas más de la mitad.</span>
        <div class="opts">${levels.map(([v,l])=>`<button class="opt${X.self[k]===v?" sel":""}" aria-pressed="${X.self[k]===v}" data-self="${k}" data-v="${v}"><span class="k">${v===1?"✔":v===0.5?"½":"✘"}</span><span class="t">${l}</span></button>`).join("")}</div></div>
    </article>`;
  }).join("");
  app.innerHTML=`
  <div class="qhead"><div><span class="eyebrow">${examLabel(X)} · corrección</span><h2>${msg}</h2></div></div>
  <section class="score">
    <div class="big">${g.pending?fmtN(g.test+g.exs):fmtN(g.total)}<small> / 10</small></div>
    <div class="stats">
      <div><b>${fmtN(g.test)}</b><span>Test / 6</span></div>
      <div><b>${g.pending?`<span class="pending">${3-g.pending} de 3</span>`:fmtN(g.exs)}</b><span>${g.pending?"Ejercicios puntuados":"Ejercicios / 4"}</span></div>
      <div><b>${g.ok}·${g.bad}·${g.blank}</b><span>Aciertos · fallos · blanco</span></div>
      <div><b>${clock(elapsed())}</b><span>Tiempo</span></div>
    </div>
    <p class="muted" style="margin:0;font-size:14px;flex-basis:100%">${g.pending?"La nota es provisional hasta que puntúes los 3 ejercicios.":"Test: aciertos × 0,6 − fallos × 0,2. Ejercicios: tu autoevaluación."}</p>
  </section>
  ${gridHTML(X,P,true)}
  <div class="actions" style="justify-content:flex-start">
    <button class="btn" id="exagain">${X.id===0?"Otro examen aleatorio":"Repetir este examen"}</button>
    <button class="btn ghost" id="excheat">Repasar con las chuletas</button>
    <button class="btn ghost" id="exhome">Volver al inicio</button>
  </div>
  <section class="sheet" style="gap:14px"><h3>Parte 1 · Test de teoría</h3>${testHTML}<h3 style="margin-top:12px">Parte 2 · Ejercicios</h3>${exHTML}</section>`;
  app.querySelectorAll("[data-self]").forEach(b=>b.onclick=()=>{ const y=window.scrollY; X.self[+b.dataset.self]=+b.dataset.v; examResults(); window.scrollTo(0,y); });
  document.getElementById("exagain").onclick=()=>startExam(X.id,true);
  document.getElementById("excheat").onclick=()=>openSheets("examres");
  document.getElementById("exhome").onclick=()=>{ S.view="home"; render(); window.scrollTo(0,0); };
}

r(--s-7);\n  padding-block: var(--s-7) var(--s-8);\n}\n\n/* ---------- índice ---------- */\n.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--s-5)); align-self: start; max-height: calc(100vh - 3rem); overflow-y: auto; padding-right: var(--s-2); }\n.side-brand { font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; margin: 0 0 var(--s-4); display: flex; align-items: center; gap: var(--s-2); }\n.side-brand .sym { font-family: var(--f-mono); color: var(--accent); font-weight: 600; }\n.toc-toggle { display: none; }\n.toc-label { font-family: var(--f-display); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: var(--s-5) 0 var(--s-2); }\n.toc ol { list-style: none; margin: 0; padding: 0; }\n.toc-temas > li { margin-bottom: var(--s-3); }\n.toc a { text-decoration: none; color: var(--ink); }\n.toc-tema, .toc-sols a { display: grid; grid-template-columns: 1.6rem 1fr auto; align-items: baseline; gap: var(--s-2); padding: var(--s-1) var(--s-2); border-radius: 6px; font-family: var(--f-display); font-weight: 700; font-size: 0.95rem; line-height: 1.3; }\n.toc-tema:hover, .toc-sols a:hover { background: var(--accent-soft); }\n.toc .tn { font-family: var(--f-mono); color: var(--accent); font-weight: 600; font-size: 0.85rem; }\n.toc a.active { background: var(--accent-soft); }\n.prog { font-family: var(--f-mono); font-size: 0.72rem; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }\n.prog.complete { color: var(--true); font-weight: 600; }\n.toc-topics { margin: 2px 0 0 calc(1.6rem + var(--s-2)) !important; border-left: 1px solid var(--rule); }\n.toc-topics a { display: flex; gap: var(--s-2); padding: 2px var(--s-2) 2px var(--s-3); font-size: 0.86rem; color: var(--muted); line-height: 1.35; }\n.toc-topics a:hover { color: var(--accent); }\n.toc-topics .tnum { font-family: var(--f-mono); font-size: 0.75rem; flex: none; padding-top: 2px; }\n.toc-topics a.integ-link { color: var(--ink); font-style: italic; }\n.reset { margin-top: var(--s-5); font: 500 0.8rem var(--f-display); background: none; border: 1px solid var(--rule); color: var(--muted); border-radius: 999px; padding: var(--s-1) var(--s-3); cursor: pointer; }\n.reset:hover { border-color: var(--false); color: var(--false); }\n.reset.confirm { border-color: var(--false); color: var(--false); background: var(--false-soft); }\n\n/* ---------- cabecera ---------- */\nmain { min-width: 0; }\n.hero { padding-bottom: var(--s-6); border-bottom: 1px solid var(--rule); margin-bottom: var(--s-6); }\n.eyebrow { font-family: var(--f-display); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin: 0 0 var(--s-2); }\nh1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.2rem, 5vw, 3.4rem); line-height: 1.02; letter-spacing: -0.03em; margin: 0 0 var(--s-4); text-wrap: balance; }\nh1 .ops { font-family: var(--f-mono); font-weight: 400; color: var(--accent); font-size: 0.55em; letter-spacing: 0; vertical-align: 0.35em; margin-left: 0.2em; white-space: nowrap; }\n.lead { font-size: 1.15rem; max-width: 62ch; margin: 0 0 var(--s-5); color: var(--ink); }\n.stats { list-style: none; padding: 0; margin: 0 0 var(--s-6); display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-5); }\n.stats li { display: flex; align-items: baseline; gap: var(--s-2); }\n.stat-n { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums; }\n.stat-l { font-family: var(--f-display); font-size: 0.85rem; color: var(--muted); }\n.stats li.total .stat-n { color: var(--accent); }\n.stats li.total { padding-right: var(--s-5); border-right: 1px solid var(--rule); }\n\n.conv { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s-4); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: var(--s-5); }\n.conv h2 { font-family: var(--f-display); font-size: 1rem; font-weight: 700; margin: 0; letter-spacing: -0.005em; }\n.ladder { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2); font-family: var(--f-mono); }\n.ladder .op { border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 2px 10px; font-size: 1rem; }\n.ladder .op small { display: block; font-family: var(--f-display); font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-align: center; }\n.ladder .gt { color: var(--muted); }\n.ladder .note { font-family: var(--f-body); font-size: 0.9rem; color: var(--muted); flex-basis: 100%; }\n.conv ul { margin: 0; padding-left: 1.2em; font-size: 0.95rem; }\n.conv li { margin-bottom: var(--s-1); }\n.conv .reco { margin: 0; font-size: 0.95rem; padding-top: var(--s-3); border-top: 1px dashed var(--rule); color: var(--muted); }\n\n/* ---------- temas ---------- */\n.tema { margin-bottom: var(--s-8); }\n.tema-head { margin-bottom: var(--s-5); }\n.tema-head h2 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.7rem, 3.4vw, 2.3rem); line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 var(--s-3); text-wrap: balance; }\n.tema-head .lede { color: var(--muted); max-width: 62ch; margin: 0; }\n.topic { margin-top: var(--s-6); display: flex; flex-direction: column; gap: var(--s-4); scroll-margin-top: var(--s-5); }\n.topic h3 { font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; line-height: 1.25; margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s-2) var(--s-3); text-wrap: balance; }\n.topic h3 .tnum { font-family: var(--f-mono); font-size: 0.9rem; font-weight: 600; color: var(--accent); }\n.topic h3 .tag { font-family: var(--f-display); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; }\n.topic-note { margin: 0; color: var(--muted); font-size: 0.97rem; max-width: 68ch; }\n.topic.integ { background: var(--accent-soft); border-radius: calc(var(--radius) + 4px); padding: var(--s-5); margin-left: calc(-1 * var(--s-5)); margin-right: calc(-1 * var(--s-5)); }\n\n/* ---------- tarjetas ---------- */\n.card { scroll-margin-top: var(--s-5); min-width: 0; }\n.card.ex { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: var(--s-4) var(--s-5) var(--s-5); transition: border-color .2s, opacity .2s; }\n.card.ex.is-done { border-color: var(--true); }\n.card.ex.is-done .card-body { opacity: 0.62; }\n.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--s-2) var(--s-4); margin-bottom: var(--s-2); }\n.card-num { font-family: var(--f-mono); font-size: 0.82rem; font-weight: 600; letter-spacing: 0.02em; color: var(--accent); }\n.card-tools { display: flex; align-items: center; gap: var(--s-4); font-family: var(--f-display); font-size: 0.82rem; }\n.done { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; user-select: none; }\n.done input { width: 1rem; height: 1rem; accent-color: var(--true); margin: 0; cursor: pointer; }\n.is-done .done { color: var(--true); font-weight: 600; }\n.jump { text-decoration: none; font-weight: 600; white-space: nowrap; }\n.jump:hover { text-decoration: underline; }\n.card-body > :first-child { margin-top: 0; }\n.card-body > :last-child { margin-bottom: 0; }\n.card-body p { margin: 0 0 var(--s-3); max-width: 70ch; }\n.card-body ol, .card-body ul { margin: 0 0 var(--s-3); padding-left: 1.5em; }\n.card-body li { margin-bottom: 2px; }\n.card-body li::marker { font-family: var(--f-mono); font-size: 0.85em; color: var(--muted); }\n.card:target { animation: flash 1.6s ease-out; }\n@keyframes flash { 0% { box-shadow: 0 0 0 4px var(--accent); } 100% { box-shadow: 0 0 0 4px transparent; } }\n\n.card.sol { padding-block: var(--s- f\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#t-2-6\">\u003cspan class=\"tnum\">2.6\u003c/span>Equivalencia lógica\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#t-2-7\">\u003cspan class=\"tnum\">2.7\u003c/span>Implicación lógica y consecuencia lógica\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#t-2-8\" class=\"integ-link\">\u003cspan class=\"tnum\">2.8\u003c/span>Integradores\u003c/a>\u003c/li>\u003c/ol>\u003c/li>\u003cli>\u003ca class=\"toc-tema\" href=\"#tema-3\">\u003cspan class=\"tn\">3\u003c/span>\u003cspan class=\"tname\">Razonamientos\u003c/span>\u003cspan class=\"prog\" data-prog=\"3\">0/17\u003c/span>\u003c/a>\u003col class=\"toc-topics\">\u003cli>\u003ca href=\"#t-3-1\">\u003cspan class=\"tnum\">3.1\u003c/span>Razonamiento válido\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#t-3-2\">\u003cspan class=\"tnum\">3.2\u003c/span>Sistema deductivo\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#t-3-3\">\u003cspan class=\"tnum\">3.3\u003c/span>Teorema de la deducción sintáctica\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#t-3-4\">\u003cspan class=\"tnum\">3.4\u003c/span>Solidez, completitud, teorías, consistencia y decidibilidad\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#t-3-5\" class=\"integ-link\">\u003cspan class=\"tnum\">3.5\u003c/span>Integradores\u003c/a>\u003c/li>\u003c/ol>\u003c/li>\u003cli>\u003ca class=\"toc-tema\" href=\"#tema-4\">\u003cspan class=\"tn\">4\u003c/span>\u003cspan class=\"tname\">Problema SAT en L0\u003c/span>\u003cspan class=\"prog\" data-prog=\"4\">0/27\u003c/span>\u003c/a>\u003col class=\"toc-topics\">\u003cli>\u003ca href=\"#t-4-1\">\u003cspan class=\"tnum\">4.1\u003c/span>El problema SAT, complejidad y clasificación de técnicas\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#t-4-2\">\u003cspan class=\"tnum\">4.2\u003c/span>Forma Normal Conjuntiva\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#t-4-3\">\u003cspan class=\"tnum\">4.3\u003c/span>Propagación de literales\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#t-4-4\">\u003cspan class=\"tnum\">4.4\u003c/span>Algoritmo DPLL\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#t-4-5\">\u003cspan class=\"tnum\">4.5\u003c/span>Método de resolución\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#t-4-6\">\u003cspan class=\"tnum\">4.6\u003c/span>Árboles semánticos\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#t-4-7\">\u003cspan class=\"tnum\">4.7\u003c/span>Tableaux semánticos\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#t-4-8\" class=\"integ-link\">\u003cspan class=\"tnum\">4.8\u003c/span>Integradores\u003c/a>\u003c/li>\u003c/ol>\u003c/li>\u003c/ol>\u003cp class=\"toc-label\">Soluciones\u003c/p>\u003col class=\"toc-sols\">\u003cli>\u003ca href=\"#sol-1\">\u003cspan class=\"tn\">1\u003c/span>\u003cspan class=\"tname\">Introducción a la lógica\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#sol-2\">\u003cspan class=\"tn\">2\u003c/span>\u003cspan class=\"tname\">Lógica proposicional (L0)\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#sol-3\">\u003cspan class=\"tn\">3\u003c/span>\u003cspan class=\"tname\">Razonamientos\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#sol-4\">\u003cspan class=\"tn\">4\u003c/span>\u003cspan class=\"tname\">Problema SAT en L0\u003c/span>\u003c/a>\u003c/li>\u003c/ol>\u003c/nav>\n    \u003cbutton class=\"reset\" id=\"reset\" type=\"button\">Reiniciar progreso\u003c/button>\n  \u003c/aside>\n\n  \u003cmain>\n    \u003cheader class=\"hero\">\n      \u003cp class=\"eyebrow\">Fundamentos Lógicos de la Informática · 1.º GII\u003c/p>\n      \u003ch1>Ejercicios por tema \u003cspan class=\"ops\">¬ ∧ ∨ → ↔\u003c/span>\u003c/h1>\n      \u003cp class=\"lead\">La guía tiene ejercicios nuevos de los temas 1 a 4, separados por tópico, y un bloque integrador al final de cada tema. Las soluciones están al final, divididas por tema y con la misma numeración (por ejemplo, el ejercicio 2.6.3 se resuelve en «Soluciones Tema 2»).\u003c/p>\n      \u003cul class=\"stats\">\n        \u003cli class=\"total\">\u003cspan class=\"stat-n\">94\u003c/span>\u003cspan class=\"stat-l\">ejercicios\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"stat-n\">17\u003c/span>\u003cspan class=\"stat-l\">Tema 1\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"stat-n\">33\u003c/span>\u003cspan class=\"stat-l\">Tema 2\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"stat-n\">17\u003c/span>\u003cspan class=\"stat-l\">Tema 3\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"stat-n\">27\u003c/span>\u003cspan class=\"stat-l\">Tema 4\u003c/span>\u003c/li>\n        \u003cli>\u003cspan class=\"stat-n\" id=\"done-total\">0\u003c/span>\u003cspan class=\"stat-l\">hechos\u003c/span>\u003c/li>\n      \u003c/ul>\n      \u003cdiv class=\"conv\">\n        \u003ch2>Convenciones de la asignatura\u003c/h2>\n        \u003cdiv class=\"ladder\" aria-label=\"Prioridad de las conectivas\">\n          \u003cspan class=\"op\">( )\u003csmall>1º\u003c/small>\u003c/span>\u003cspan class=\"gt\">›\u003c/span>\n          \u003cspan class=\"op\">¬\u003csmall>2º\u003c/small>\u003c/span>\u003cspan class=\"gt\">›\u003c/span>\n          \u003cspan class=\"op\">∧ ∨\u003csmall>3º\u003c/small>\u003c/span>\u003cspan class=\"gt\">›\u003c/span>\n          \u003cspan class=\"op\">→ ↔\u003csmall>4º\u003c/small>\u003c/span>\n          \u003cspan class=\"note\">Con igual prioridad se agrupa de izquierda a derecha: p → q → r se lee (p → q) → r.\u003c/span>\n        \u003c/div>\n        \u003cul>\n\n\u003cli>Orden de filas de las tablas: la primera variable alterna VVVVFFFF, la segunda VVFFVVFF y la última VFVFVFVF.\u003c/li>\n\u003cli>≡ (equivalencia lógica), ⊨ (consecuencia lógica) y ⊢ (derivación) son símbolos del metalenguaje; ↔ y → son conectivas.\u003c/li>\n\u003cli>□ es la cláusula vacía (insatisfacible) y ∅ el conjunto vacío de cláusulas (satisfacible).\u003c/li>\n\u003cli>Reglas de inferencia por sus siglas: MP (modus ponens), MT (modus tollens), SH (silogismo hipotético), SD (silogismo disyuntivo), Simp (simplificación), Comb (combinación), Ad (adición), Casos (prueba por casos).\u003c/li>\n\u003c/ul>\n        \u003cp class=\"reco\">Recomendación: haz cada bloque sin mirar las soluciones y corrige al terminar el bloque, no ejercicio por ejercicio. Los enunciados usan el mismo estilo que la hoja de ejercicios de teoría.\u003c/p>\n      \u003c/div>\n    \u003c/header>\n\n    \u003csection class=\"tema exs\" id=\"tema-1\">\u003cheader class=\"tema-head\">\u003cp class=\"eyebrow\">Tema 1\u003c/p>\u003ch2>Introducción: ¿qué es la lógica?\u003c/h2>\u003cp class=\"lede\">Tres tópicos: la lógica como cálculo, de qué predica la lógica (oración, enunciado, proposición) y los conceptos fundamentales (historia, principios, McCarthy y los 4 componentes).\u003c/p>\u003c/header>\u003csection class=\"topic\" id=\"t-1-1\">\u003ch3>\u003cspan class=\"tnum\">1.1\u003c/span>\u003cspan>La lógica como cálculo (reglas de formación y transformación)\u003c/span>\u003c/h3>\u003cp class=\"topic-note\">Usa el cálculo de juguete de clase. Primitivos: A, A′, A″, …; B, B′, B″, … y la operación X. Reglas de formación: RF1 una A con cualquier nº de apóstrofes es ebf; RF2 ídem con B; RF3 ebf de A, seguida de X, seguida de ebf de B, es ebf; RF4 ebf de B, X, ebf de A, es ebf. Reglas de transformación: RT1 AⁿXBᵐ ⇒ BᵐXAⁿ; RT2 BⁿXAᵐ ⇒ AᵐXBⁿ; RT3 AⁿXBᵐ ⇒ AⁿXBᵏ (cambia los apóstrofes de la B); RT4 BⁿXAᵐ ⇒ BⁿXAᵏ (cambia los apóstrofes de la A).\u003c/p>\u003carticle class=\"card ex\" data-tema=\"1\" id=\"e-1-1-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 1.1.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-1-1-1\">\u003cinput data-key=\"1.1.1\" id=\"d-1-1-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-1-1-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Indica cuáles de estas expresiones son ebf y con qué regla:\u003c/p>\u003col>\n\u003cli>A″\u003c/li>\n\u003cli>A′ X B″\u003c/li>\n\u003cli>B X A‴\u003c/li>\n\u003cli>A X A′\u003c/li>\n\u003cli>X B′\u003c/li>\n\u003cli>B′ X\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"1\" id=\"e-1-1-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 1.1.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-1-1-2\">\u003cinput data-key=\"1.1.2\" id=\"d-1-1-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-1-1-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Partiendo de A′ X B, obtén B″ X A‴. Indica la regla usada en cada paso.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"1\" id=\"e-1-1-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 1.1.3\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-1-1-3\">\u003cinput data-key=\"1.1.3\" id=\"d-1-1-3\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-1-1-3\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Partiendo de A X B, obtén A‴ X B. Ninguna regla cambia directamente los apóstrofes del primer elemento: ¿cómo lo consigues?\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"1\" id=\"e-1-1-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 1.1.4\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-1-1-4\">\u003cinput data-key=\"1.1.4\" id=\"d-1-1-4\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-1-1-4\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>¿Es posible obtener una expresión del tipo AⁿXAᵐ partiendo de A X B? Justifica tu respuesta a partir de las reglas.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"1\" id=\"e-1-1-5\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 1.1.5\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-1-1-5\">\u003cinput data-key=\"1.1.5\" id=\"d-1-1-5\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-1-1-5\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Con la interpretación A = padre, A′ = hijo, A″ = nieto; B = madre, B′ = hija, B″ = nieta; X = querer:\u003c/p>\u003col>\n\u003cli>Traduce al castellano B″ X A′.\u003c/li>\n\u003cli>Escribe en el cálculo «el nieto quiere a la madre».\u003c/li>\n\u003cli>¿Por qué, al añadir esta interpretación, deja de ser «un simple cálculo»?\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"t-1-2\">\u003ch3>\u003cspan class=\"tnum\">1.2\u003c/span>\u003cspan>¿De qué predica la lógica? Oración, enunciado y proposición\u003c/span>\u003c/h3>\u003carticle class=\"card ex\" data-tema=\"1\" id=\"e-1-2-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 1.2.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-1-2-1\">\u003cinput data-key=\"1.2.1\" id=\"d-1-2-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-1-2-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Clasifica cada expresión como: no es oración, oración (no enunciado), enunciado/proposición. Justifica brevemente.\u003c/p>\u003col>\n\u003cli>¿Qué hora es?\u003c/li>\n\u003cli>¡Cierra la ventana!\u003c/li>\n\u003cli>Madrid es la capital de España.\u003c/li>\n\u003cli>Ojalá apruebe FLI.\u003c/li>\n\u003cli>Mesa.\u003c/li>\n\u003cli>7 es un número primo.\u003c/li>\n\u003cli>x es mayor que 3.\u003c/li>\n\u003cli>El ordenador de la sala 2 está encendido.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"1\" id=\"e-1-2-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 1.2.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-1-2-2\">\u003cinput data-key=\"1.2.2\" id=\"d-1-2-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-1-2-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Un compañero propone este diccionario para formalizar un texto. Señala qué átomos están mal definidos y corrígelos.\u003c/p>\u003cul>\n\u003cli>p: «no llueve»\u003c/li>\n\u003cli>q: «casa»\u003c/li>\n\u003cli>r: «¿vienes a clase?»\u003c/li>\n\u003cli>s: «el examen es el lunes»\u003c/li>\n\u003cli>t: «llueve y hace frío»\u003c/li>\n\u003c/ul>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"1\" id=\"e-1-2-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 1.2.3\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-1-2-3\">\u003cinput data-key=\"1.2.3\" id=\"d-1-2-3\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-1-2-3\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Explica con tus palabras la diferencia entre «enunciado» y «proposición» y pon un ejemplo de enunciado que no sea una proposición según la definición de clase.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"topic\" id=\"t-1-3\">\u003ch3>\u003cspan class=\"tnum\">1.3\u003c/span>\u003cspan>Conceptos fundamentales: historia, principios, McCarthy y componentes\u003c/span>\u003c/h3>\u003carticle class=\"card ex\" data-tema=\"1\" id=\"e-1-3-1\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 1.3.1\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-1-3-1\">\u003cinput data-key=\"1.3.1\" id=\"d-1-3-1\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-1-3-1\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Ordena cronológicamente las cuatro etapas de la lógica y asocia a cada una su autor o hito y el tipo de lógica que aparece: Frege (1879), computación, Aristóteles, Boole (1847).\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"1\" id=\"e-1-3-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 1.3.2\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-1-3-2\">\u003cinput data-key=\"1.3.2\" id=\"d-1-3-2\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-1-3-2\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Indica qué principio de la lógica clásica expresa cada frase y formalízala en L0 (p: «está lloviendo», q: «la puerta está abierta»):\u003c/p>\u003col>\n\u003cli>«Está lloviendo o no está lloviendo.»\u003c/li>\n\u003cli>«No puede ser que la puerta esté abierta y no lo esté a la vez.»\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card ex\" data-tema=\"1\" id=\"e-1-3-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Ejercicio 1.3.3\u003c/span>\u003cspan class=\"card-tools\">\u003clabel class=\"done\" for=\"d-1-3-3\">\u003cinput data-key=\"1.3.3\" id=\"d-1-3-3\" type=\"checkbox\"/>\u003cspan>Hecho\u003c/span>\u003c/label>\u003ca class=\"jump\" href=\"#s-1-3-3\">Ver solución →\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Asocia cada descripción con su compromiso de McCarthy (meta-ontológico, ontológico, epistemológico, lógico, implementación):\u003c/p>\u003col>\n\u003cli>Qué objetos y hechos son relevantes en el modelo.\u003c/li>\n\u003cli>Cuánto puede expresar el lenguaje respecto a lo que queremos saber.\u003c/li>\n\u003cli>La relación entre el mundo y el modelo que construimos.\u003c/li>\n\u003cli>Si los hechos y las deducciones del modelo son verdaderos.\u003c/li>\n\u003cli>Eficacia física del sistema respecto a los niveles anteriores.\u003c/li>\n\u003c/ol>\u003c
