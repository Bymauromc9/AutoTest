"jump\" href=\"#e-4-8-1\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>FNC: (¬p ∨ q) ∧ (¬q ∨ r) ∧ (¬r ∨ ¬p) ∧ (p ∨ q) (interdefinición en las tres implicaciones). Forma clausal {{¬p, q}; {¬q, r}; {¬r, ¬p}; {p, q}}.\u003c/li>\n\u003cli>DPLL: sin tautologías, unitarias, puros ni subsumidas. Ramificación por p.\u003cul>\n\u003cli>Rama p: ξ(p) = {{q}; {¬q, r}; {¬r}} → unitaria q: {{r}; {¬r}} → unitaria r → □. Backtracking.\u003c/li>\n\u003cli>Rama ¬p: ξ(¬p) = {{¬q, r}; {q}} → unitaria q: {{r}} → unitaria r: ∅. SATISFACIBLE, modelo ν(p) = F, ν(q) = V, ν(r) = V.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Árbol semántico:\u003cul>\n\u003cli>Rama p: (V → q) ∧ (q → r) ∧ (r → F) ∧ V ≡ q ∧ (q → r) ∧ ¬r. Rama q: r ∧ ¬r ≡ F, \u003cspan class=\"mark bad\">FALLO\u003c/span>. Rama ¬q: F, \u003cspan class=\"mark bad\">FALLO\u003c/span>.\u003c/li>\n\u003cli>Rama ¬p: (F → q) ∧ (q → r) ∧ (r → V) ∧ (F ∨ q) ≡ (q → r) ∧ q. Rama q: r; rama r \u003cspan class=\"mark ok\">ÉXITO\u003c/span>, rama ¬r \u003cspan class=\"mark bad\">FALLO\u003c/span>. Rama ¬q: F, \u003cspan class=\"mark bad\">FALLO\u003c/span>.\u003c/li>\n\u003cli>Un único \u003cspan class=\"mark ok\">ÉXITO\u003c/span>: p = F, q = V, r = V. Satisfacible, no tautología.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Tableau: dos α → {p → q, q → r, r → ¬p, p ∨ q}. β p ∨ q:\u003cul>\n\u003cli>Rama p: β r → ¬p da ¬p (\u003cspan class=\"mark bad\">×\u003c/span>) o ¬r; con ¬r, β q → r da r (\u003cspan class=\"mark bad\">×\u003c/span>) o ¬q; con ¬q, β p → q da ¬p (\u003cspan class=\"mark bad\">×\u003c/span>) o q (\u003cspan class=\"mark bad\">×\u003c/span>). Rama p cerrada.\u003c/li>\n\u003cli>Rama q: β q → r da ¬q (\u003cspan class=\"mark bad\">×\u003c/span>) o r; con r, β r → ¬p da ¬r (\u003cspan class=\"mark bad\">×\u003c/span>) o ¬p; con {q, r, ¬p}, β p → q da ¬p \u003cspan class=\"mark ok\">✓\u003c/span> o q \u003cspan class=\"mark ok\">✓\u003c/span>. Hojas abiertas {q, r, ¬p}.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Las tres técnicas dan el mismo y único modelo: ν(p) = F, ν(q) = V, ν(r) = V.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-8-2\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.8.2\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-8-2\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Formalización: {a → b, b → ¬c, c ∨ a} ⊨ ¬c → b. Cláusulas: {¬a, b}, {¬b, ¬c}, {c, a}. Conclusión negada: ¬(¬c → b) ≡ ¬c ∧ ¬b, CS = {{¬c}; {¬b}}.\u003c/p>\u003cul>\n\u003cli>Resolución con CS: 1. {¬a, b}; 2. {¬b, ¬c}; 3. {c, a}; 4. {¬c} CS; 5. {¬b} CS; 6. {a} R_c(3, 4) CS, Subsumida(3); 7. {¬a} R_b(1, 5) CS, Subsumida(1); 8. □ Rₐ(6, 7) CS.\u003c/li>\n\u003cli>DPLL: unitaria ¬c → {{¬a, b}; {a}; {¬b}}; unitaria a → {{b}; {¬b}}; unitaria b → □. Sin ramificar: insatisfacible.\u003c/li>\n\u003cli>Árbol semántico sobre (¬a ∨ b) ∧ (¬b ∨ ¬c) ∧ (c ∨ a) ∧ ¬c ∧ ¬b: rama c \u003cspan class=\"mark bad\">FALLO\u003c/span> (por ¬c). Rama ¬c: (¬a ∨ b) ∧ a ∧ ¬b; rama a: b ∧ ¬b ≡ F, \u003cspan class=\"mark bad\">FALLO\u003c/span>; rama ¬a: F, \u003cspan class=\"mark bad\">FALLO\u003c/span>. Todas \u003cspan class=\"mark bad\">FALLO\u003c/span>.\u003c/li>\n\u003cli>Tableau: raíz {a → b, b → ¬c, c ∨ a, ¬(¬c → b)}; α → ¬c, ¬b. β c ∨ a: rama c \u003cspan class=\"mark bad\">×\u003c/span> (con ¬c); rama a: β a → b, ¬a \u003cspan class=\"mark bad\">×\u003c/span> (con a), b \u003cspan class=\"mark bad\">×\u003c/span> (con ¬b). Cerrado (no hace falta descomponer b → ¬c).\u003c/li>\n\u003c/ul>\u003cp>Las cuatro técnicas coinciden: \u003cspan class=\"chip ok\">VÁLIDO\u003c/span>.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-8-3\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.8.3\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-8-3\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>Cláusulas: {¬p, q}, {p, r}; conclusión negada ¬(q ∧ r) ≡ ¬q ∨ ¬r: {¬q, ¬r}.\u003c/p>\u003cul>\n\u003cli>DPLL: sin unitarias ni puros. Rama p: ξ(p) = {{q}; {¬q, ¬r}} → unitaria q → {{¬r}} → unitaria ¬r → ∅. Satisfacible: contraejemplo ν(p) = V, ν(q) = V, ν(r) = F. La rama ¬p da {{r}; {¬q, ¬r}} → r → {{¬q}} → ¬q → ∅: segundo contraejemplo ν(p) = F, ν(q) = F, ν(r) = V.\u003c/li>\n\u003cli>Tableau: raíz {p → q, ¬p → r, ¬(q ∧ r)}. β ¬(q ∧ r):\u003cul>\n\u003cli>Rama ¬q: β p → q da q (\u003cspan class=\"mark bad\">×\u003c/span>) o ¬p; con ¬p, β ¬p → r da ¬¬p (α: p, \u003cspan class=\"mark bad\">×\u003c/span>) o r \u003cspan class=\"mark ok\">✓\u003c/span>. Hoja {¬q, ¬p, r}.\u003c/li>\n\u003cli>Rama ¬r: β ¬p → r da r (\u003cspan class=\"mark bad\">×\u003c/span>) o ¬¬p (α: p); con p, β p → q da ¬p (\u003cspan class=\"mark bad\">×\u003c/span>) o q \u003cspan class=\"mark ok\">✓\u003c/span>. Hoja {¬r, p, q}.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\u003cp>\u003cspan class=\"chip bad\">NO VÁLIDO\u003c/span>, con contraejemplos (p, q, r) = (V, V, F) y (F, F, V). La resolución sólo puede demostrar insatisfacibilidad: si no sale □ sabemos que no es válido, pero no obtenemos ninguna interpretación.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-8-4\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.8.4\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-8-4\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003col>\n\u003cli>Al menos una: {l1, l2, l3}. Como mucho una: {¬l1, ¬l2}, {¬l1, ¬l3}, {¬l2, ¬l3}. L1 → L2: {¬l1, l2}.\u003c/li>\n\u003cli>DPLL: sin tautologías, unitarias, puros ni subsumidas. Ramificación por l1.\u003cul>\n\u003cli>Rama l1: {{¬l2}; {¬l3}; {¬l2, ¬l3}; {l2}} → unitaria ¬l2 → aparece □ (por {l2}). Backtracking.\u003c/li>\n\u003cli>Rama ¬l1: {{l2, l3}; {¬l2, ¬l3}}. Ramificación por l2: rama l2 → {{¬l3}} → ¬l3 → ∅, modelo (l1, l2, l3) = (F, V, F). Para obtener todos, rama ¬l2 → {{l3}} → l3 → ∅, modelo (F, F, V).\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>L1 nunca puede estar encendida; puede estarlo L2 sola o L3 sola.\u003c/li>\n\u003c/ol>\u003c/div>\u003c/article>\u003carticle class=\"card sol\" data-tema=\"4\" id=\"s-4-8-5\">\u003cdiv class=\"card-head\">\u003cspan class=\"card-num\">Solución 4.8.5\u003c/span>\u003cspan class=\"card-tools\">\u003ca class=\"jump\" href=\"#e-4-8-5\">← Enunciado\u003c/a>\u003c/span>\u003c/div>\u003cdiv class=\"card-body\">\u003cp>a) Árbol semántico (o tabla de verdad): tautología si todas las hojas son \u003cspan class=\"mark ok\">ÉXITO\u003c/span>; con tableau habría que hacerlo sobre ¬α. b) DPLL: trabaja sobre cláusulas y devuelve un modelo sin explorar todas las interpretaciones. c) Resolución con estrategia de conjunto soporte. d) Árbol semántico (cada \u003cspan class=\"mark ok\">ÉXITO\u003c/span> da interpretaciones) o tableau (cada hoja abierta da un modelo); la tabla también sirve, pero cuesta 2ⁿ filas.\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003c/section>\n\n    \u003cp class=\"foot\">Ejercicios elaborados a partir de los apuntes y la hoja de teoría de FLI (temas 1–4). Tablas, equivalencias, modelos y validez comprobados por computadora. Las marcas de «Hecho» se guardan sólo en este navegador.\u003c/p>\n  \u003c/main>\n\u003c/div>\n\n\u003cscript>\n(function () {\n  var KEY = 'fli-ejercicios-hechos';\n  var done = {};\n  try { done = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { done = {}; }\n  function save() { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} }\n\n  var boxes = Array.prototype.slice.call(document.querySelectorAll('.card.ex input[type=checkbox]'));\n  function refresh() {\n    var per = {}, tot = {}, all = 0;\n    boxes.forEach(function (b) {\n      var card = b.closest('.card');\n      var t = card.getAttribute('data-tema');\n      tot[t] = (tot[t] || 0) + 1;\n      card.classList.toggle('is-done', b.checked);\n      if (b.checked) { per[t] = (per[t] || 0) + 1; all++; }\n    });\n    document.querySelectorAll('[data-prog]').forEach(function (el) {\n      var t = el.getAttribute('data-prog'), n = per[t] || 0;\n      el.textContent = n + '/' + tot[t];\n      el.classList.toggle('complete', n === tot[t]);\n    });\n    var dt = document.getElementById('done-total'); if (dt) dt.textContent = all;\n  }\n  boxes.forEach(function (b) {\n    b.checked = !!done[b.getAttribute('data-key')];\n    b.addEventListener('change', function () {\n      if (b.checked) done[b.getAttribute('data-key')] = 1; else delete done[b.getAttribute('data-key')];\n      save(); refresh();\n    });\n  });\n  refresh();\n\n  var reset = document.getElementById('reset'), armed = false, timer;\n  reset.addEventListener('click', function () {\n    if (!armed) {\n      armed = true; reset.classList.add('confirm'); reset.textContent = 'Pulsa otra vez para borrar';\n      timer = setTimeout(function () { armed = false; reset.classList.remove('confirm'); reset.textContent = 'Reiniciar progreso'; }, 3000);\n      return;\n    }\n    clearTimeout(timer); armed = false; done = {}; save();\n    boxes.forEach(function (b) { b.checked = false; }); refresh();\n    reset.classList.remove('confirm'); reset.textContent = 'Progreso borrado';\n    setTimeout(function () { reset.textContent = 'Reiniciar progreso'; }, 1800);\n  });\n\n  var side = document.getElementById('side'), tog = document.getElementById('toc-toggle');\n  tog.addEventListener('click', function () {\n    var open = side.classList.toggle('open');\n    tog.setAttribute('aria-expanded', open ? 'true' : 'false');\n    tog.textContent = open ? 'Cerrar' : 'Índice';\n  });\n  side.querySelectorAll('.toc a').forEach(function (a) {\n    a.addEventListener('click', function () {\n      if (window.matchMedia('(max-width: 900px)').matches) { side.classList.remove('open'); tog.setAttribute('aria-expanded', 'false'); tog.textContent = 'Índice'; }\n    });\n  });\n\n  // resaltar el tema visible en el índice\n  if ('IntersectionObserver' in window) {\n    var links = {};\n    document.querySelectorAll('.toc-tema, .toc-sols a').forEach(function (a) { links[a.getAttribute('href').slice(1)] = a; });\n    var io = new IntersectionObserver(function (entries) {\n      entries.forEach(function (en) {\n        if (en.isIntersecting) {\n          Object.keys(links).forEach(function (k) { links[k].classList.remove('active'); });\n          var l = links[en.target.id]; if (l) l.classList.add('active');\n        }\n      });\n    }, { rootMargin: '-30% 0px -65% 0px' });\n    document.querySelectorAll('section.tema').forEach(function (s) { io.observe(s); });\n  }\n})();\n\u003c/script>\n\u003c/body>\u003c/html>\n",eq:"\u003c!doctype html>\n\u003chtml lang=\"es\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Equivalencias de L0\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap\">\n\u003cstyle>\n/* Layout: columna estrecha; la fórmula es la protagonista, en grande; el progreso es una columna V/F como en una tabla de verdad */\n:root{\n  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#15202C; --muted:#5A6573; --line:#D7DDE4;\n  --accent:#27467A; --accent-soft:#E4EAF4; --ok:#1D7544; --ok-soft:#E1F2E8; --bad:#B42318; --bad-soft:#FBE7E5; --warn:#8A5A00; --warn-soft:#FBF0D9;\n  --f-display:\"Bricolage Grotesque\",\"Segoe UI\",system-ui,sans-serif;\n  --f-body:\"Source Sans 3\",\"Segoe UI\",system-ui,-apple-system,sans-serif;\n  --f-mono:\"JetBrains Mono\",\"DejaVu Sans Mono\",\"Cambria Math\",\"Segoe UI Symbol\",ui-monospace,monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#10151B; --surface:#18202A; --ink:#E5EAF0; --muted:#9BA7B4; --line:#2B3642;\n  --accent:#93B4E6; --accent-soft:#1F2C3E; --ok:#5CC98C; --ok-soft:#163323; --bad:#F2786D; --bad-soft:#3A1C1A; --warn:#E8B85C; --warn-soft:#352914; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#10151B; --surface:#18202A; --ink:#E5EAF0; --muted:#9BA7B4; --line:#2B3642;\n  --accent:#93B4E6; --accent-soft:#1F2C3E; --ok:#5CC98C; --ok-soft:#163323; --bad:#F2786D; --bad-soft:#3A1C1A; --warn:#E8B85C; --warn-soft:#352914; color-scheme:dark}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}\n.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}\nh1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}\nh1{font-size:clamp(30px,6vw,44px);font-weight:800}\nh2{font-size:22px;font-weight:800}\nh3{font-size:17px;font-weight:600}\np{margin:0}\n.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}\n.muted{color:var(--muted)}\n.f{font-family:var(--f-mono);font-weight:500;white-space:nowrap}\nbutton{font:inherit;color:inherit;cursor:pointer}\nbutton:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\n.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);padding:9px 16px;border-radius:7px;font-weight:700;font-size:15px;white-space:nowrap}\n.btn.ghost{background:transparent;color:var(--accent)}\n.btn:hover{filter:brightness(1.08)}\n.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px clamp(14px,4vw,24px);display:flex;flex-direction:column;gap:14px}\n.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}\n.settings label{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted)}\nselect{font:inherit;font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}\n.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}\n.best{font-family:var(--f-mono);font-size:13px;color:var(--muted)}\n.cheat{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 12px;align-items:center;font-family:var(--f-mono);font-size:16px;overflow-x:auto}\n.cheat .eq{color:var(--muted)}\n.cheat .l{text-align:right}\n.cheat div{white-space:nowrap}\n/* quiz */\n.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}\n.column{display:flex;flex-wrap:wrap;gap:3px}\n.cell{width:24px;height:24px;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:3px;color:var(--muted);background:var(--surface)}\n.cell.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}\n.cell.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}\n.cell.now{outline:2px solid var(--accent);outline-offset:1px;color:var(--accent)}\n.prompt{font-size:15px;color:var(--muted)}\n.stem{font-family:var(--f-mono);font-weight:700;font-size:clamp(24px,6vw,36px);text-align:center;padding:14px 4px;overflow-x:auto;white-space:nowrap}\n.stem .q{color:var(--accent)}\n.opts{display:flex;flex-direction:column;gap:9px}\n.opts.two{flex-direction:row}\n.opts.two .opt{flex:1;justify-content:center}\n.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}\n.opt .k{font-family:var(--f-mono);font-weight:700;font-size:14px;min-width:26px;height:26px;display:grid;place-items:center;border-radius:5px;background:var(--accent-soft);color:var(--accent)}\n.opt .t{font-family:var(--f-mono);font-size:19px;font-weight:500;min-width:0;overflow-x:auto}\n.opts.two .opt .t{font-family:var(--f-body);font-weight:700}\n.opt:hover:not(:disabled){border-color:var(--accent)}\n.opt:disabled{cursor:default}\n.opt.correct{border-color:var(--ok);background:var(--ok-soft)} .opt.correct .k{background:var(--ok);color:var(--surface)}\n.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:var(--surface)}\n.opt.dim{opacity:.55}\n.feedback{border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:9px}\n.feedback.ok{background:var(--ok-soft);border:1px solid var(--ok)}\n.feedback.bad{background:var(--bad-soft);border:1px solid var(--bad)}\n.verdict{font-family:var(--f-display);font-weight:800;font-size:18px}\n.feedback.ok .verdict{color:var(--ok)} .feedback.bad .verdict{color:var(--bad)}\n.rule{font-family:var(--f-mono);font-size:18px;font-weight:700;overflow-x:auto;white-space:nowrap}\n.chain{font-family:var(--f-mono);font-size:15px;display:flex;flex-direction:column;gap:2px;overflow-x:auto}\n.chain div{white-space:nowrap}\n.tt-wrap{overflow-x:auto}\ntable.tt{border-collapse:collapse;font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;background:var(--surface)}\ntable.tt th,table.tt td{border:1px solid var(--line);padding:4px 10px;text-align:center;white-space:nowrap}\ntable.tt th{background:var(--accent-soft);font-weight:700}\ntable.tt tr.diff td{background:var(--bad-soft)}\ntable.tt td.v{color:var(--ok);font-weight:700} table.tt td.fz{color:var(--bad);font-weight:700}\n.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;padding:0;font-size:15px;align-self:flex-start}\n.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}\n.kbd{font-family:var(--f-mono);font-size:12px;color:var(--muted)}\n/* resultados */\n.score{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end}\n.big{font-family:var(--f-display);font-weight:800;font-size:60px;line-height:1;font-variant-numeric:tabular-nums}\n.big small{font-size:22px;color:var(--muted)}\n.stats{display:flex;gap:22px;font-variant-numeric:tabular-nums}\n.stats div{display:flex;flex-direction:column}\n.stats b{font-family:var(--f-display);font-size:22px}\n.stats span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}\n.ritem{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}\n.ritem .yours{color:var(--bad)} .ritem .right{color:var(--ok);font-weight:600}\n@media (max-width:520px){ body{font-size:16px} .opt .t{font-size:17px} .big{font-size:50px} }\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"wrap\" id=\"app\">\u003c/div>\n\n\u003cscript>\n/* =================== MOTOR LÓGICO =================== */\n// Prioridad: ¬  >  ∧ ∨  >  → ↔  (a igual prioridad, de izquierda a derecha)\nfunction tokenize(s){\n  const out=[]; for(const ch of s.replace(/\\s+/g,\"\")){\n    if(\"αβγ\".includes(ch)) out.push({t:\"var\",v:ch});\n    else if(ch===\"V\"||ch===\"F\") out.push({t:\"const\",v:ch===\"V\"});\n    else out.push({t:\"op\",v:ch});\n  } return out;\n}\nfunction parse(s){\n  const tk=tokenize(s); let i=0;\n  const peek=()=>tk[i], eat=()=>tk[i++];\n  function atom(){ const x=eat(); if(!x) throw Error(\"fin inesperado: \"+s);\n    if(x.t===\"var\") return {t:\"var\",n:x.v};\n    if(x.t===\"const\") return {t:\"const\",v:x.v};\n    if(x.v===\"¬\") return {t:\"not\",a:atom()};\n    if(x.v===\"(\"){ const e=imp(); const c=eat(); if(!c||c.v!==\")\") throw Error(\"falta ) en \"+s); return e; }\n    throw Error(\"símbolo inesperado \"+x.v+\" en \"+s);\n  }\n  function andor(){ let l=atom(); while(peek()&&(peek().v===\"∧\"||peek().v===\"∨\")){const op=eat().v; l={t:\"bin\",op,l,r:atom()};} return l; }\n  function imp(){ let l=andor(); while(peek()&&(peek().v===\"→\"||peek().v===\"↔\")){const op=eat().v; l={t:\"bin\",op,l,r:andor()};} return l; }\n  const e=imp(); if(i!==tk.length) throw Error(\"sobra texto en \"+s); return e;\n}\nfunction ev(n,a){\n  switch(n.t){case\"var\":return a[n.n];case\"const\":return n.v;case\"not\":return !ev(n.a,a);\n  default:{const l=ev(n.l,a),r=ev(n.r,a);\n    return n.op===\"∧\"?l&&r:n.op===\"∨\"?l||r:n.op===\"→\"?(!l||r):(l===r);}}\n}\nfunction varsOf(...ss){ const set=new Set(); ss.forEach(s=>{for(const ch of s) if(\"αβγ\".includes(ch)) set.add(ch);}); return [...set].sort((x,y)=>\"αβγ\".indexOf(x)-\"αβγ\".indexOf(y)); }\nfunction rows(vars){ const n=vars.length, out=[]; for(let k=0;k\u003c(1\u003c\u003cn);k++){ const a={}; vars.forEach((v,j)=>{a[v]=!((k>>(n-1-j))&1);}); out.push(a);} return out; }\nconst CACHE={}; const P=s=>CACHE[s]||(CACHE[s]=parse(s));\nfunction equiv(f,g){ const vs=varsOf(f,g); return rows(vs).every(a=>ev(P(f),a)===ev(P(g),a)); }\nfunction counterex(f,g){ const vs=varsOf(f,g); for(const a of rows(vs)) if(ev(P(f),a)!==ev(P(g),a)) return {a,vs,fv:ev(P(f),a),gv:ev(P(g),a)}; return null; }\nconst VF=b=>b?\"V\":\"F\";\n\n/* =================== BANCO DE EQUIVALENCIAS ===================\n   L ≡ R. dR: fórmulas que NO son equivalentes (se usan como distractores cuando se pide R);\n   dL: distractores cuando se da R y se pide L. d: derivación paso a paso (opcional). */\nconst EQ=[\n {L:\"α→β\",R:\"¬α∨β\",dR:[\"α∨¬β\",\"¬α∧β\",\"α∨β\",\"¬(α∨β)\"],dL:[\"β→α\",\"¬α→¬β\",\"α∧¬β\"]},\n {L:\"α→β\",R:\"¬(α∧¬β)\",dR:[\"¬(¬α∧β)\",\"¬α∧β\",\"¬(α∧β)\"],dL:[\"β→α\",\"¬α→¬β\",\"α→¬β\"],d:[\"¬(α∧¬β)\",\"¬α∨¬¬β\",\"¬α∨β\",\"α→β\"]},\n {L:\"α→β\",R:\"¬β→¬α\",dR:[\"¬α→¬β\",\"β→α\",\"¬β∧¬α\"],dL:[\"β→α\",\"¬α→¬β\",\"α∧β\"],d:[\"¬β→¬α\",\"¬¬β∨¬α\",\"β∨¬α\",\"¬α∨β\",\"α→β\"]},\n {L:\"¬(α→β)\",R:\"α∧¬β\",dR:[\"¬α→¬β\",\"¬α∧β\",\"¬α∨¬β\"],dL:[\"¬α→¬β\",\"¬(β→α)\",\"¬(α∧β)\"],d:[\"¬(α→β)\",\"¬(¬α∨β)\",\"¬¬α∧¬β\",\"α∧¬β\"]},\n {L:\"α∨β\",R:\"¬α→β\",dR:[\"α→β\",\"¬α→¬β\",\"¬(α→β)\"],dL:[\"α∧β\",\"¬α∨β\",\"α→β\"],d:[\"¬α→β\",\"¬¬α∨β\",\"α∨β\"]},\n {L:\"α↔β\",R:\"(α→β)∧(β→α)\",dR:[\"(α→β)∨(β→α)\",\"(α→β)∧(¬β→¬α)\",\"(α→β)∧β\"],dL:[\"α→β\",\"β→α\",\"¬α↔β\"]},\n {L:\"α↔β\",R:\"(¬α∨β)∧(α∨¬β)\",dR:[\"(¬α∨β)∧(¬α∨¬β)\",\"(¬α∧β)∨(α∧¬β)\",\"(¬α∨β)∨(α∨¬β)\"],dL:[\"¬(α↔β)\",\"α→β\",\"α∧β\"],d:[\"α↔β\",\"(α→β)∧(β→α)\",\"(¬α∨β)∧(¬β∨α)\",\"(¬α∨β)∧(α∨¬β)\"]},\n {L:\"α↔β\",R:\"(α∧β)∨(¬α∧¬β)\",dR:[\"(α∧β)∨(α∧¬β)\",\"(α∨β)∧(¬α∨¬β)\",\"(α∧¬β)∨(¬α∧β)\"],dL:[\"α→β\",\"¬(α↔β)\",\"α∨β\"]},\n {L:\"¬(α↔β)\",R:\"(α∧¬β)∨(¬α∧β)\",dR:[\"(α∧β)∨(¬α∧¬β)\",\"¬α↔¬β\",\"(α∧¬β)∧(¬α∧β)\"],dL:[\"α↔β\",\"¬α↔¬β\",\"¬(α→β)\"]},\n {L:\"¬(α↔β)\",R:\"¬α↔β\",dR:[\"¬α↔¬β\",\"α↔β\",\"¬α→β\"],dL:[\"α↔β\",\"¬α↔¬β\",\"¬(α→β)\"]},\n {L:\"¬(α∨β)\",R:\"¬α∧¬β\",dR:[\"¬α∨¬β\",\"α∧β\",\"¬α∨β\"],dL:[\"¬(α∧β)\",\"¬α∨¬β\",\"¬α∨β\"]},\n {L:\"¬(α∧β)\",R:\"¬α∨¬β\",dR:[\"¬α∧¬β\",\"¬α∧β\",\"α∨β\"],dL:[\"¬(α∨β)\",\"¬α∧¬β\",\"α∧¬β\"]},\n {L:\"(α∧β)→γ\",R:\"α→(β→γ)\",dR:[\"(α→β)→γ\",\"(α→γ)∧(β→γ)\",\"α∧(β→γ)\"],dL:[\"(α∨β)→γ\",\"(α→β)→γ\",\"α∧(β→γ)\"],d:[\"α→(β→γ)\",\"¬α∨(¬β∨γ)\",\"(¬α∨¬β)∨γ\",\"¬(α∧β)∨γ\",\"(α∧β)→γ\"]},\n {L:\"(α∨β)→γ\",R:\"(α→γ)∧(β→γ)\",dR:[\"(α→γ)∨(β→γ)\",\"(α∧β)→γ\",\"α∨(β→γ)\"],dL:[\"(α∧β)→γ\",\"α→(β→γ)\",\"(α→β)→γ\"],d:[\"(α∨β)→γ\",\"¬(α∨β)∨γ\",\"(¬α∧¬β)∨γ\",\"(¬α∨γ)∧(¬β∨γ)\",\"(α→γ)∧(β→γ)\"]},\n {L:\"(α∧β)→γ\",R:\"(α→γ)∨(β→γ)\",dR:[\"(α→γ)∧(β→γ)\",\"(α∨β)→γ\",\"α→(β∧γ)\"],dL:[\"(α∨β)→γ\",\"(α→β)→γ\",\"α∧(β→γ)\"],d:[\"(α→γ)∨(β→γ)\",\"(¬α∨γ)∨(¬β∨γ)\",\"(¬α∨¬β)∨γ\",\"¬(α∧β)∨γ\",\"(α∧β)→γ\"]},\n {L:\"α→(β∧γ)\",R:\"(α→β)∧(α→γ)\",dR:[\"(α→β)∨(α→γ)\",\"(α∧β)→γ\",\"(α→β)∧γ\"],dL:[\"(α∧β)→γ\",\"α→(β∨γ)\",\"(α→β)→γ\"],d:[\"α→(β∧γ)\",\"¬α∨(β∧γ)\",\"(¬α∨β)∧(¬α∨γ)\",\"(α→β)∧(α→γ)\"]},\n {L:\"α→(β∨γ)\",R:\"(α→β)∨γ\",dR:[\"(α→β)∧γ\",\"(α∨β)→γ\",\"(α→β)∧(α→γ)\"],dL:[\"α→(β∧γ)\",\"(α∨β)→γ\",\"α∧(β∨γ)\"],d:[\"(α→β)∨γ\",\"(¬α∨β)∨γ\",\"¬α∨(β∨γ)\",\"α→(β∨γ)\"]},\n {L:\"α→(β→γ)\",R:\"β→(α→γ)\",dR:[\"(α→β)→γ\",\"γ→(β→α)\",\"(β→α)→γ\"],dL:[\"(α→β)→γ\",\"γ→(β→α)\",\"(β→α)→γ\"],d:[\"α→(β→γ)\",\"(α∧β)→γ\",\"(β∧α)→γ\",\"β→(α→γ)\"]},\n {L:\"α∧(β∨γ)\",R:\"(α∧β)∨(α∧γ)\",dR:[\"(α∨β)∧(α∨γ)\",\"(α∧β)∨γ\",\"(α∧β)∧(α∧γ)\"],dL:[\"α∨(β∧γ)\",\"(α∧β)∨γ\",\"α∧(β∧γ)\"]},\n {L:\"α∨(β∧γ)\",R:\"(α∨β)∧(α∨γ)\",dR:[\"(α∧β)∨(α∧γ)\",\"(α∨β)∧γ\",\"(α∨β)∨(α∨γ)\"],dL:[\"α∧(β∨γ)\",\"(α∨β)∧γ\",\"α∨(β∨γ)\"]},\n {L:\"α∧(β∧γ)\",R:\"(α∧β)∧γ\",dR:[\"(α∧β)∨γ\",\"(α∨β)∧γ\",\"α∧(β∨γ)\"],dL:[\"α∨(β∧γ)\",\"α∧(β∨γ)\",\"α∨(β∨γ)\"]},\n {L:\"α∨(β∨γ)\",R:\"(α∨β)∨γ\",dR:[\"(α∨β)∧γ\",\"(α∧β)∨γ\",\"α∨(β∧γ)\"],dL:[\"α∧(β∨γ)\",\"α∨(β∧γ)\",\"α∧(β∧γ)\"]},\n {L:\"α∧β\",R:\"β∧α\",dR:[\"β∨α\",\"¬β∧¬α\",\"β→α\"],dL:[\"α∨β\",\"α→β\",\"¬α∧¬β\"]},\n {L:\"α∨β\",R:\"β∨α\",dR:[\"β∧α\",\"¬β∨¬α\",\"¬β→¬α\"],dL:[\"α∧β\",\"α→β\",\"¬α∨¬β\"]},\n {L:\"α∧¬α\",R:\"F\",dR:[\"V\",\"α\",\"¬α\"],dL:[\"α∨¬α\",\"α→¬α\",\"α↔α\"]},\n {L:\"α∨¬α\",R:\"V\",dR:[\"F\",\"α\",\"¬α\"],dL:[\"α∧¬α\",\"¬α→α\",\"α↔¬α\"]},\n {L:\"¬¬α\",R:\"α\",dR:[\"¬α\",\"V\",\"F\"],dL:[\"¬α\",\"α∧¬α\",\"α∨¬α\"]},\n {L:\"α∧α\",R:\"α\",dR:[\"V\",\"¬α\",\"F\"],dL:[\"α∧¬α\",\"α∨¬α\",\"¬α∨¬α\"]},\n {L:\"α∨α\",R:\"α\",dR:[\"V\",\"¬α\",\"F\"],dL:[\"α∨¬α\",\"¬α∧¬α\",\"α∧¬α\"]},\n {L:\"α∧V\",R:\"α\",dR:[\"V\",\"F\",\"¬α\"],dL:[\"α∨V\",\"α∧F\",\"¬α∧V\"]},\n {L:\"α∨F\",R:\"α\",dR:[\"F\",\"V\",\"¬α\"],dL:[\"α∧F\",\"α∨V\",\"¬α∨F\"]},\n {L:\"α∧F\",R:\"F\",dR:[\"α\",\"V\",\"¬α\"],dL:[\"α∨F\",\"α∧V\",\"α∨¬α\"]},\n {L:\"α∨V\",R:\"V\",dR:[\"α\",\"F\",\"¬α\"],dL:[\"α∧V\",\"α∨F\",\"α∧¬α\"]},\n {L:\"α∧(α∨β)\",R:\"α\",dR:[\"β\",\"α∧β\",\"α∨β\"],dL:[\"α∨β\",\"α∧β\",\"β∧(α∨β)\"],d:[\"α∧(α∨β)\",\"(α∨F)∧(α∨β)\",\"α∨(F∧β)\",\"α∨F\",\"α\"]},\n {L:\"α∨(α∧β)\",R:\"α\",dR:[\"β\",\"α∧β\",\"α∨β\"],dL:[\"α∨β\",\"α∧β\",\"β∨(α∧β)\"],d:[\"α∨(α∧β)\",\"(α∧V)∨(α∧β)\",\"α∧(V∨β)\",\"α∧V\",\"α\"]},\n {L:\"α→¬α\",R:\"¬α\",dR:[\"α\",\"F\",\"V\"],dL:[\"¬α→α\",\"α→α\",\"α∧¬α\"],d:[\"α→¬α\",\"¬α∨¬α\",\"¬α\"]},\n {L:\"¬α→α\",R:\"α\",dR:[\"¬α\",\"V\",\"F\"],dL:[\"α→¬α\",\"α→α\",\"α∨¬α\"],d:[\"¬α→α\",\"¬¬α∨α\",\"α∨α\",\"α\"]},\n {L:\"α→α\",R:\"V\",dR:[\"F\",\"α\",\"¬α\"],dL:[\"α→¬α\",\"α∧¬α\",\"¬α→α\"]}\n];\n// Parejas que NO son equivalentes (errores típicos) para el modo «¿Son equivalentes?»\nconst FALSE_PAIRS=[[\"α→β\",\"β→α\"],[\"α→β\",\"¬α→¬β\"],[\"¬(α→β)\",\"¬α→¬β\"],[\"¬(α∧β)\",\"¬α∧¬β\"],[\"¬(α∨β)\",\"¬α∨¬β\"],[\"(α→β)→γ\",\"α→(β→γ)\"],\n [\"(α∨β)→γ\",\"(α→γ)∨(β→γ)\"],[\"(α∧β)→γ\",\"(α→γ)∧(β→γ)\"],[\"α∨(β∧γ)\",\"(α∨β)∧γ\"],[\"α∧(β∨γ)\",\"(α∧β)∨γ\"],[\"¬(α↔β)\",\"¬α↔¬β\"],[\"α→β\",\"α∨¬β\"],\n [\"α↔β\",\"(α→β)∨(β→α)\"],[\"¬(α→β)\",\"¬α∧β\"],[\"α∨β\",\"α→β\"],[\"(α∧β)→γ\",\"α∧(β→γ)\"],[\"α↔β\",\"(α∧β)∨(α∧¬β)\"],[\"α∧(α∨β)\",\"α∧β\"],[\"¬α→β\",\"α→¬β\"],[\"α→¬α\",\"F\"]];\n\n/* Validación del banco al cargar (descarta cualquier distractor que resultase equivalente) */\nEQ.forEach(e=>{\n  if(!equiv(e.L,e.R)) console.error(\"NO equivalente:\",e.L,e.R);\n  e.dR=e.dR.filter(x=>!equiv(x,e.R)); e.dL=e.dL.filter(x=>!equiv(x,e.L));\n  if(e.d) for(let k=1;k\u003ce.d.length;k++) if(!equiv(e.d[k-1],e.d[k])) console.error(\"paso no equivalente\",e.d[k-1],e.d[k]);\n});\nFALSE_PAIRS.forEach(p=>{ if(equiv(p[0],p[1])) console.error(\"pareja falsa que sí es equivalente\",p); });\n\n/* =================== ESTADO =================== */\nconst S={view:\"home\",qs:[],i:0,ans:[],n:\"20\",mode:\"mix\",showTT:false,showCheat:false};\nfunction store(k,v){try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k,JSON.stringify(v)); }catch(e){return null;}}\nconst saved=store(\"eq-settings\"); if(saved){S.n=saved.n||S.n; S.mode=saved.mode||S.mode;}\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};\nconst pick=a=>a[Math.floor(Math.random()*a.length)];\nconst LET=[\"A\",\"B\",\"C\",\"D\"];\nconst esc=s=>String(s).replace(/&/g,\"&amp;\").replace(/\u003c/g,\"&lt;\");\nconst F=s=>`\u003cspan class=\"f\">${esc(s)}\u003c/span>`;\n\nfunction makeChoice(e){\n  const dir=Math.random()\u003c0.5?\"LR\":\"RL\";\n  const given=dir===\"LR\"?e.L:e.R, right=dir===\"LR\"?e.R:e.L, pool=dir===\"LR\"?e.dR:e.dL;\n  const ds=shuffle(pool.filter(x=>x!==right)).slice(0,3);\n  const opts=shuffle([right,...ds]);\n  return {type:\"choice\",given,right,opts,a:opts.indexOf(right),e};\n}\nfunction makeYN(){\n  if(Math.random()\u003c0.5){ const e=pick(EQ); const sw=Math.random()\u003c0.5; return {type:\"yn\",f:sw?e.R:e.L,g:sw?e.L:e.R,truth:true,e}; }\n  const p=pick(FALSE_PAIRS); const sw=Math.random()\u003c0.5; return {type:\"yn\",f:sw?p[1]:p[0],g:sw?p[0]:p[1],truth:false};\n}\nfunction build(){\n  const n=parseInt(S.n,10); const out=[]; let pool=shuffle(EQ), k=0; const seen=new Set();\n  while(out.length\u003cn){\n    let q;\n    const wantYN = S.mode===\"yn\" || (S.mode===\"mix\" && Math.random()\u003c0.35);\n    if(wantYN) q=makeYN(); else { if(k>=pool.length){pool=shuffle(EQ);k=0;} q=makeChoice(pool[k++]); }\n    const key=q.type===\"yn\"?q.f+\"|\"+q.g:q.given+\"|\"+q.right;\n    if(seen.has(key) && seen.size \u003c EQ.length+FALSE_PAIRS.length-2) continue;\n    seen.add(key); out.push(q);\n  }\n  return out;\n}\nfunction start(items){ S.qs=items||build(); S.i=0; S.ans=new Array(S.qs.length).fill(undefined); S.showTT=false; S.view=\"quiz\"; render(); window.scrollTo(0,0); }\nconst isOk=(q,a)=>q.type===\"choice\"? a===q.a : (a===0)===q.truth;\n\n/* =================== VISTAS =================== */\nconst app=document.getElementById(\"app\");\nfunction render(){ S.view===\"home\"?home():S.view===\"quiz\"?quiz():results(); }\n\nfunction cheatHTML(){\n  const seen=new Set(); const rowsH=[];\n  EQ.forEach(e=>{ const k=e.L+\"≡\"+e.R; if(seen.has(k))return; seen.add(k); rowsH.push(`\u003cdiv class=\"l\">${esc(e.L)}\u003c/div>\u003cdiv class=\"eq\">≡\u003c/div>\u003cdiv>${esc(e.R)}\u003c/div>`); });\n  return `\u003cdiv class=\"cheat\">${rowsH.join(\"\")}\u003c/div>`;\n}\nfunction home(){\n  const best=store(\"eq-best\");\n  app.innerHTML=`\n  \u003cheader style=\"display:flex;flex-direction:column;gap:8px\">\n    \u003cspan class=\"eyebrow\">FLI · Tema 2 · Equivalencia lógica\u003c/span>\n    \u003ch1>Equivalencias de L0\u003c/h1>\n    \u003cp class=\"muted\">Sólo fórmulas, sin nombres. Te doy una fórmula y eliges cuál es equivalente, o decides si dos fórmulas son equivalentes. Si fallas, te enseño una interpretación donde no coinciden y la tabla de verdad.\u003c/p>\n  \u003c/header>\n  \u003csection class=\"panel\">\n    \u003cdiv class=\"settings\">\n      \u003clabel for=\"mode\">Tipo de preguntas\n        \u003cselect id=\"mode\">\n          \u003coption value=\"mix\"${S.mode===\"mix\"?\" selected\":\"\"}>Mixto\u003c/option>\n          \u003coption value=\"choice\"${S.mode===\"choice\"?\" selected\":\"\"}>Elegir la equivalente\u003c/option>\n          \u003coption value=\"yn\"${S.mode===\"yn\"?\" selected\":\"\"}>¿Son equivalentes? (sí / no)\u003c/option>\n        \u003c/select>\u003c/label>\n      \u003clabel for=\"n\">Número de preguntas\n        \u003cselect id=\"n\">\n          ${[\"10\",\"20\",\"30\",\"40\"].map(v=>`\u003coption value=\"${v}\"${S.n===v?\" selected\":\"\"}>${v}\u003c/option>`).join(\"\")}\n        \u003c/select>\u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"row\">\u003cbutton class=\"btn\" id=\"go\">Empezar\u003c/button>\n      \u003cspan class=\"best\">${EQ.length} equivalencias en el banco${best!=null?` · mejor nota \u003cb>${best.toFixed(1)}\u003c/b>`:\"\"}\u003c/span>\u003c/div>\n  \u003c/section>\n  \u003csection class=\"panel\">\n    \u003cdiv class=\"row\" style=\"justify-content:space-between\">\u003ch3>Repasar todas antes de empezar\u003c/h3>\n      \u003cbutton class=\"btn ghost\" id=\"cheatbtn\">${S.showCheat?\"Ocultar\":\"Mostrar\"}\u003c/button>\u003c/div>\n    ${S.showCheat?cheatHTML():`\u003cp class=\"muted\" style=\"font-size:15px\">Todas las equivalencias del banco, una por línea. Ocúltalas antes de hacer el test.\u003c/p>`}\n  \u003c/section>\n  \u003cp class=\"kbd\">Atajos: 1–4 o A–D para responder (S / N en sí-no) · Intro para seguir · T para la tabla de verdad.\u003c/p>`;\n  document.getElementById(\"go\").onclick=()=>start();\n  document.getElementById(\"mode\").onchange=e=>{S.mode=e.target.value;store(\"eq-settings\",{n:S.n,mode:S.mode});};\n  document.getElementById(\"n\").onchange=e=>{S.n=e.target.value;store(\"eq-settings\",{n:S.n,mode:S.mode});};\n  document.getElementById(\"cheatbtn\").onclick=()=>{S.showCheat=!S.showCheat;home();};\n}\n\nfunction column(){\n  return S.qs.map((q,k)=>{const a=S.ans[k];let c=\"cell\",t=k+1;\n    if(a!==undefined){ if(isOk(q,a)){c+=\" ok\";t=\"V\";} else {c+=\" bad\";t=\"F\";} }\n    if(k===S.i&&S.view===\"quiz\") c+=\" now\"; return `\u003cspan class=\"${c}\">${t}\u003c/span>`;}).join(\"\");\n}\nfunction ttHTML(cols){ // cols: [{label, f}]\n  const vs=varsOf(...cols.map(c=>c.f)); const R=rows(vs);\n  const head=vs.map(v=>`\u003cth>${v}\u003c/th>`).join(\"\")+cols.map(c=>`\u003cth>${esc(c.label||c.f)}\u003c/th>`).join(\"\");\n  const body=R.map(a=>{ const vals=cols.map(c=>ev(P(c.f),a)); const diff=vals.some(v=>v!==vals[0]);\n    return `\u003ctr class=\"${diff?\"diff\":\"\"}\">${vs.map(v=>`\u003ctd>${VF(a[v])}\u003c/td>`).join(\"\")}${vals.map(v=>`\u003ctd class=\"${v?\"v\":\"fz\"}\">${VF(v)}\u003c/td>`).join(\"\")}\u003c/tr>`;}).join(\"\");\n  return `\u003cdiv class=\"tt-wrap\">\u003ctable class=\"tt\">\u003cthead>\u003ctr>${head}\u003c/tr>\u003c/thead>\u003ctbody>${body}\u003c/tbody>\u003c/table>\u003c/div>`;\n}\nfunction cxText(f,g){\n  const c=counterex(f,g); if(!c) return \"\";\n  const asg=c.vs.map(v=>`${v} = ${VF(c.a[v])}`).join(\", \");\n  return `\u003cp>Contraejemplo: con \u003cb>${esc(asg)}\u003c/b>, ${F(f)} vale \u003cb>${VF(c.fv)}\u003c/b> pero ${F(g)} vale \u003cb>${VF(c.gv)}\u003c/b>. Con una sola interpretación en la que difieran ya no son equivalentes.\u003c/p>`;\n}\nfunction chainHTML(e){\n  if(!e||!e.d) return \"\";\n  return `\u003cdiv class=\"chain\">${e.d.map((s,k)=>`\u003cdiv>${k?\"≡ \":\"&nbsp;&nbsp;\"}${esc(s)}\u003c/div>`).join(\"\")}\u003c/div>`;\n}\n\nfunction quiz(){\n  const q=S.qs[S.i], a=S.ans[S.i], done=a!==undefined, n=S.qs.length, last=S.i===n-1;\n  let stem, opts, fb=\"\", prompt;\n  if(q.type===\"choice\"){\n    prompt=\"¿Cuál de estas fórmulas es equivalente?\";\n    stem=`${esc(q.given)} \u003cspan class=\"q\">≡ ?\u003c/span>`;\n    opts=`\u003cdiv class=\"opts\">${q.opts.map((o,k)=>{let c=\"opt\"; if(done){ if(k===q.a)c+=\" correct\"; else if(k===a)c+=\" wrong\"; else c+=\" dim\"; }\n      return `\u003cbutton class=\"${c}\" data-k=\"${k}\" id=\"o${k}\"${done?\" disabled\":\"\"}>\u003cspan class=\"k\">${LET[k]}\u003c/span>\u003cspan class=\"t\">${esc(o)}\u003c/span>\u003c/button>`;}).join(\"\")}\u003c/div>`;\n    if(done){\n      const ok=a===q.a;\n      const cols=[{f:q.given},{f:q.right}]; if(!ok) cols.push({f:q.opts[a]});\n      fb=`\u003cdiv class=\"feedback ${ok?\"ok\":\"bad\"}\" role=\"status\">\n        \u003cspan class=\"verdict\">${ok?\"Correcto\":\"Incorrecto\"}\u003c/span>\n        \u003cdiv class=\"rule\">${esc(q.given)} ≡ ${esc(q.right)}\u003c/div>\n        ${!ok?cxText(q.given,q.opts[a]):\"\"}\n        ${q.e.d?`\u003cp class=\"muted\" style=\"font-size:15px\">Paso a paso:\u003c/p>${chainHTML(q.e)}`:\"\"}\n        \u003cbutton class=\"linkbtn\" id=\"tt\">${S.showTT?\"Ocultar\":\"Ver\"} tabla de verdad\u003c/button>\n        ${S.showTT?ttHTML(cols):\"\"}\n      \u003c/div>`;\n    }\n  } else {\n    prompt=\"¿Son lógicamente equivalentes?\";\n    stem=`${esc(q.f)} \u003cspan class=\"q\">≡?\u003c/span> ${esc(q.g)}`;\n    const labels=[\"Sí\",\"No\"], right=q.truth?0:1;\n    opts=`\u003cdiv class=\"opts two\">${labels.map((o,k)=>{let c=\"opt\"; if(done){ if(k===right)c+=\" correct\"; else if(k===a)c+=\" wrong\"; else c+=\" dim\"; }\n      return `\u003cbutton class=\"${c}\" data-k=\"${k}\" id=\"o${k}\"${done?\" disabled\":\"\"}>\u003cspan class=\"k\">${k?\"N\":\"S\"}\u003c/span>\u003cspan class=\"t\">${o}\u003c/span>\u003c/button>`;}).join(\"\")}\u003c/div>`;\n    if(done){\n      const ok=isOk(q,a);\n      fb=`\u003cdiv class=\"feedback ${ok?\"ok\":\"bad\"}\" role=\"status\">\n        \u003cspan class=\"verdict\">${ok?\"Correcto\":\"Incorrecto\"}: ${q.truth?\"sí son equivalentes\":\"no son equivalentes\"}\u003c/span>\n        ${q.truth?`\u003cdiv class=\"rule\">${esc(q.f)} ≡ ${esc(q.g)}\u003c/div>${q.e&&q.e.d?`\u003cp class=\"muted\" style=\"font-size:15px\">Paso a paso:\u003c/p>${chainHTML(q.e)}`:`\u003cp>Tienen la misma columna en todas las interpretaciones.\u003c/p>`}`\n                 :cxText(q.f,q.g)}\n        \u003cbutton class=\"linkbtn\" id=\"tt\">${S.showTT?\"Ocultar\":\"Ver\"} tabla de verdad\u003c/button>\n        ${S.showTT?ttHTML([{f:q.f},{f:q.g}]):\"\"}\n      \u003c/div>`;\n    }\n  }\n  app.innerHTML=`\n  \u003cdiv class=\"qhead\">\u003cdiv>\u003cspan class=\"eyebrow\">Equivalencias de L0\u003c/span>\u003ch2>Pregunta ${S.i+1} de ${n}\u003c/h2>\u003c/div>\u003cbutton class=\"btn ghost\" id=\"quit\">Salir\u003c/button>\u003c/div>\n  \u003cdiv class=\"column\">${column()}\u003c/div>\n  \u003carticle class=\"panel\">\n    \u003cp class=\"prompt\">${prompt}\u003c/p>\n    \u003cdiv class=\"stem\">${stem}\u003c/div>\n    ${opts}\n    ${fb}\n    ${done?`\u003cdiv class=\"actions\">\u003cspan class=\"kbd\">Intro: ${last?\"ver resultados\":\"siguiente\"} · T: tabla\u003c/span>\u003cbutton class=\"btn\" id=\"next\">${last?\"Ver resultados\":\"Siguiente\"}\u003c/button>\u003c/div>`:\"\"}\n  \u003c/article>`;\n  app.querySelectorAll(\".opt\").forEach(b=>b.onclick=()=>answer(parseInt(b.dataset.k,10)));\n  const t=document.getElementById(\"tt\"); if(t) t.onclick=()=>{S.showTT=!S.showTT;quiz();};\n  const nx=document.getElementById(\"next\"); if(nx){nx.onclick=next; nx.focus({preventScroll:true});}\n  document.getElementById(\"quit\").onclick=()=>{S.view=\"home\";render();};\n}\nfunction answer(k){ if(S.ans[S.i]!==undefined) return; S.ans[S.i]=k; quiz(); }\nfunction next(){ S.showTT=false; if(S.i\u003cS.qs.length-1){S.i++;quiz();window.scrollTo({top:0});} else finish(); }\nfunction finish(){ const g=grade(); const b=store(\"eq-best\"); if(b==null||g.nota>b) store(\"eq-best\",g.nota); S.view=\"results\"; render(); window.scrollTo(0,0); }\nfunction grade(){ let ok=0; S.qs.forEach((q,k)=>{ if(isOk(q,S.ans[k])) ok++; }); const n=S.qs.length; return {ok,bad:n-ok,n,nota:Math.round(ok/n*100)/10}; }\n\nfunction results(){\n  const g=grade();\n  const failed=S.qs.map((q,k)=>({q,k,a:S.ans[k]})).filter(x=>!isOk(x.q,x.a));\n  const msg=g.nota>=9?\"Las tienes dominadas.\":g.nota>=7?\"Muy bien. Repasa las falladas.\":g.nota>=5?\"Aprobado, pero repasa la lista.\":\"Vuelve a la lista de repaso y repite las falladas.\";\n  const rev=failed.length?failed.map(x=>{\n    if(x.q.type===\"choice\") return `\u003cdiv class=\"ritem\">\u003cspan class=\"kbd\">Pregunta ${x.k+1}\u003c/span>\n      \u003cp class=\"yours\">Elegiste: ${F(x.q.given+\" ≡ \"+x.q.opts[x.a])}\u003c/p>\n      \u003cp class=\"right\">Correcta: ${F(x.q.given+\" ≡ \"+x.q.right)}\u003c/p>${cxText(x.q.given,x.q.opts[x.a])}\u003c/div>`;\n    return `\u003cdiv class=\"ritem\">\u003cspan class=\"kbd\">Pregunta ${x.k+1}\u003c/span>\n      \u003cp>${F(x.q.f+\"  ≡?  \"+x.q.g)}\u003c/p>\n      \u003cp class=\"right\">${x.q.truth?\"Sí son equivalentes.\":\"No son equivalentes.\"}\u003c/p>${x.q.truth?\"\":cxText(x.q.f,x.q.g)}\u003c/div>`;\n  }).join(\"\"):`\u003cdiv class=\"panel\" style=\"border-color:var(--ok)\">\u003cb>Sin fallos.\u003c/b>\u003c/div>`;\n  app.innerHTML=`\n  \u003cdiv class=\"qhead\">\u003cdiv>\u003cspan class=\"eyebrow\">Resultados\u003c/span>\u003ch2>${msg}\u003c/h2>\u003c/div>\u003c/div>\n  \u003cdiv class=\"column\">${column()}\u003c/div>\n  \u003csection class=\"panel\">\u003cdiv class=\"score\">\u003cdiv class=\"big\">${g.nota.toFixed(1)}\u003csmall> / 10\u003c/small>\u003c/div>\n    \u003cdiv class=\"stats\">\u003cdiv>\u003cb>${g.ok}\u003c/b>\u003cspan>Aciertos\u003c/span>\u003c/div>\u003cdiv>\u003cb>${g.bad}\u003c/b>\u003cspan>Fallos\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n  \u003cdiv class=\"row\">\n    ${failed.length?`\u003cbutton class=\"btn\" id=\"retry\">Repetir las ${failed.length} falladas\u003c/button>`:\"\"}\n    \u003cbutton class=\"btn ghost\" id=\"again\">Nuevo test\u003c/button>\u003cbutton class=\"btn ghost\" id=\"home\">Inicio\u003c/button>\u003c/div>\n  \u003csection style=\"display:flex;flex-direction:column;gap:10px\">\u003ch3>Repaso de fallos\u003c/h3>${rev}\u003c/section>`;\n  const r=document.getElementById(\"retry\"); if(r) r.onclick=()=>start(failed.map(x=>{const q=Object.assign({},x.q); if(q.type===\"choice\"){q.opts=shuffle(q.opts);q.a=q.opts.indexOf(q.right);} return q;}));\n  document.getElementById(\"again\").onclick=()=>start();\n  document.getElementById(\"home\").onclick=()=>{S.view=\"home\";render();};\n}\n\ndocument.addEventListener(\"keydown\",e=>{\n  if(S.view!==\"quiz\"||e.altKey||e.ctrlKey||e.metaKey) return;\n  const q=S.qs[S.i], done=S.ans[S.i]!==undefined, k=e.key.toUpperCase();\n  if(!done){\n    if(q.type===\"choice\"){ let i=-1; if(/^[1-4]$/.test(k)) i=+k-1; else if(LET.includes(k)) i=LET.indexOf(k); if(i>=0&&i\u003cq.opts.length){e.preventDefault();answer(i);} }\n    else { if(k===\"S\"||k===\"1\"){e.preventDefault();answer(0);} else if(k===\"N\"||k===\"2\"){e.preventDefault();answer(1);} }\n  } else {\n    if(e.key===\"Enter\"){ const ae=document.activeElement; if(ae&&ae.tagName===\"BUTTON\"&&ae.id!==\"next\") return; e.preventDefault(); next(); }\n    else if(k===\"T\"){ e.preventDefault(); S.showTT=!S.showTT; quiz(); }\n  }\n});\nrender();\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n"};

/* ---------- Motor de fórmulas (herramientas de la guía) ---------- */
const CONV={
  teoria:{pr:{"∧":2,"∨":2,"→":1,"↔":1},ra:{},name:"Teoría (diapositivas): ¬ › ∧ ∨ › → ↔, a igual prioridad de izquierda a derecha"},
  guia:{pr:{"∧":4,"∨":3,"→":2,"↔":1},ra:{"→":1},name:"Guía de prácticas (Huth y Ryan): ¬ › ∧ › ∨ › → › ↔, la → agrupa por la derecha"}
};
const OPNAME={"¬":"negación","∧":"conjunción","∨":"disyunción","→":"condicional","↔":"bicondicional"};
function lparse(src,conv){
  const C=CONV[conv]||CONV.guia;
  const s=String(src).replace(/<->|<=>/g,"↔").replace(/->|=>/g,"→").replace(/[~!]/g,"¬").replace(/&/g,"∧").replace(/\|/g,"∨").replace(/[\[{]/g,"(").replace(/[\]}]/g,")");
  const tk=[];
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(/\s/.test(ch)) continue;
    if(/[a-z]/.test(ch)){ let v=ch; while(i+1<s.length&&/[0-9]/.test(s[i+1])) v+=s[++i]; tk.push({t:"at",v}); }
    else if(ch==="V"||ch==="F") tk.push({t:"k",v:ch});
    else if("¬∧∨→↔()".includes(ch)) tk.push({t:"op",v:ch});
    else if("⊢⊨≡".includes(ch)) throw new Error(`«${ch}» no es una conectiva: pertenece al metalenguaje y no puede ir dentro de una fbf.`);
    else throw new Error(`El símbolo «${ch}» no pertenece al alfabeto de L0.`);
  }
  if(!tk.length) throw new Error("Escribe una fórmula.");
  let i=0; const peek=()=>tk[i], eat=()=>tk[i++];
  function unary(){
    const t=eat();
    if(!t) throw new Error("Falta un operando al final de la fórmula.");
    if(t.t==="at") return {t:"at",v:t.v};
    if(t.t==="k") return {t:"k",v:t.v==="V"};
    if(t.v==="¬") return {t:"op",op:"¬",a:unary()};
    if(t.v==="("){ const e=expr(0); const c=eat(); if(!c||c.v!==")") throw new Error("Hay un paréntesis sin cerrar."); return e; }
    if(t.v===")") throw new Error("Sobra un paréntesis de cierre «)» o falta un operando antes de él.");
    throw new Error(`Falta un operando antes de «${t.v}»: es una conectiva binaria y necesita una fbf a cada lado.`);
  }
  function expr(minP){
    let l=unary();
    for(;;){
      const t=peek();
      if(!t) break;
      if(t.t!=="op"||t.v==="("||t.v==="¬"){ if(t.v===")") break; throw new Error(t.v==="¬"?"La negación es unaria: no puede unir dos fórmulas (falta una conectiva binaria).":"Hay dos fórmulas seguidas sin ninguna conectiva que las una."); }
      if(!(t.v in C.pr)) break;
      const p=C.pr[t.v]; if(p<minP) break;
      eat(); const r=expr(C.ra[t.v]?p:p+1); l={t:"op",op:t.v,l,r};
    }
    return l;
  }
  const e=expr(0);
  if(i<tk.length) throw new Error(tk[i].v===")"?"Sobra un paréntesis de cierre «)».":"La fórmula tiene texto sobrante.");
  return e;
}
function lshow(n,top){
  if(n.t==="at") return n.v; if(n.t==="k") return n.v?"V":"F";
  if(n.op==="¬") return "¬"+lshow(n.a);
  const s=lshow(n.l)+" "+n.op+" "+lshow(n.r); return top?s:"("+s+")";
}
function lev(n,a){ if(n.t==="at") return a[n.v]; if(n.t==="k") return n.v; if(n.op==="¬") return !lev(n.a,a); const l=lev(n.l,a),r=lev(n.r,a); return n.op==="∧"?l&&r:n.op==="∨"?l||r:n.op==="→"?(!l||r):l===r; }
function latoms(n,set){ set=set||new Set(); if(n.t==="at") set.add(n.v); else if(n.t==="op"){ if(n.op==="¬") latoms(n.a,set); else { latoms(n.l,set); latoms(n.r,set); } } return set; }
function lsubs(n,out){ out=out||[]; if(n.t==="op"){ if(n.op==="¬") lsubs(n.a,out); else { lsubs(n.l,out); lsubs(n.r,out); } const s=lshow(n,true); if(!out.some(x=>x.s===s)) out.push({s,n}); } return out; }
function lrows(vs){ const out=[]; for(let k=0;k<(1<<vs.length);k++){ const a={}; vs.forEach((v,j)=>{a[v]=!((k>>(vs.length-1-j))&1);}); out.push(a);} return out; }
const KCLS={"¬":"k-not","∧":"k-and","∨":"k-or","→":"k-imp","↔":"k-iff"};
function synHTML(n){
  if(n.t!=="op") return `<div class="nd"><span class="at">${n.t==="k"?(n.v?"V":"F"):esc(n.v)}</span></div>`;
  const kids=n.op==="¬"?[n.a]:[n.l,n.r];
  return `<div class="nd"><span class="op ${KCLS[n.op]}">${n.op}</span><span class="sub">${esc(lshow(n,true))}</span></div><div class="ch">${kids.map(synHTML).join("")}</div>`;
}
function ttTable(vs,cols,rowCls){
  const R=lrows(vs);
  return `<div class="tw"><table class="tt"><thead><tr>${vs.map(v=>`<th>${esc(v)}</th>`).join("")}${cols.map(c=>`<th${c.main?' class="main"':""}>${paint(esc(c.label))}</th>`).join("")}</tr></thead><tbody>${R.map(a=>{const vals=cols.map(c=>lev(c.n,a)); return `<tr class="${rowCls?rowCls(vals):""}">${vs.map(v=>`<td>${a[v]?"V":"F"}</td>`).join("")}${vals.map((x,j)=>`<td class="${x?"v":"fz"}${cols[j].main?" main":""}">${x?"V":"F"}</td>`).join("")}</tr>`;}).join("")}</tbody></table></div>`;
}
function analyzeHTML(src,conv){
  let n; try{ n=lparse(src,conv); }catch(e){ return `<p class="err">✘ No es una fbf. ${esc(e.message)}</p>`; }
  const vs=[...latoms(n)].sort(), subs=lsubs(n);
  const main=n.t==="op"?`${paint(n.op)} · ${OPNAME[n.op]}`:"ninguna: es una fórmula atómica";
  let vals=null, cls="";
  if(vs.length<=8){ vals=lrows(vs).map(a=>lev(n,a)); const t=vals.filter(Boolean).length; cls= t===vals.length?"<b>Tautología</b> (válida): verdadera en las "+t+" interpretaciones.":t===0?"<b>Contradicción</b> (insatisfacible): falsa en las "+vals.length+" interpretaciones.":`<b>Contingente</b>: satisfacible pero no válida (${t} de ${vals.length} filas verdaderas).`; }
  return `<p class="okv">✔ Es una fbf</p>
    <div class="tw" style="border:0;background:none"><table class="t"><tbody>
      <tr><td><b>Con todos los paréntesis</b></td><td>${F(lshow(n,true))}</td></tr>
      <tr><td><b>Conectiva principal</b></td><td>${main}</td></tr></tbody></table></div>
    <h4 style="margin:0">Árbol sintáctico</h4><div class="syn">${synHTML(n)}</div>

    <h4 style="margin:0">Tabla de verdad</h4>
    ${vs.length<=6?ttTable(vs,subs.map((x,k)=>({label:x.s,n:x.n,main:k===subs.length-1})).concat(subs.length?[]:[{label:lshow(n,true),n,main:true}])):`<p class="muted">Con ${vs.length} letras la tabla tendría ${2**vs.length} filas; sólo muestro la clasificación.</p>`}
    ${cls?`<p class="callout">${cls}</p>`:""}`;

function checkHTML(prems,concl,conv){
  const P=[]; let C;
  for(let k=0;k<prems.length;k++){ if(!prems[k].trim()) continue; try{ P.push({src:prems[k],n:lparse(prems[k],conv)}); }catch(e){ return `<p class="err">✘ La premisa ${k+1} no es una fbf. ${esc(e.message)}</p>`; } }
  try{ C={src:concl,n:lparse(concl,conv)}; }catch(e){ return `<p class="err">✘ La conclusión no es una fbf. ${esc(e.message)}</p>`; }
  const set=new Set(); P.forEach(p=>latoms(p.n,set)); latoms(C.n,set); const vs=[...set].sort();
  if(vs.length>7) return `<p class="err">Demasiadas letras (${vs.length}) para una tabla legible: usa como máximo 7.</p>`;
  const R=lrows(vs); let good=0, cx=null;
  R.forEach(a=>{ if(P.every(p=>lev(p.n,a))){ good++; if(!lev(C.n,a)&&!cx) cx=a; } });
  const sch=`{ ${P.map(p=>lshow(p.n,true)).join(", ")} } ⊨ ${lshow(C.n,true)}`;
  const cols=P.map((p,k)=>({label:lshow(p.n,true),n:p.n})).concat([{label:lshow(C.n,true),n:C.n,main:true}]);
  const np=P.length;
  return `<p>${F(sch)}</p>
    ${cx?`<p class="badv">✘ No válido</p><p>Contraejemplo: ${vs.map(v=>`${esc(v)} = ${cx[v]?"V":"F"}`).join(", ")}. Con esa interpretación todas las premisas son verdaderas y la conclusión es falsa, así que no existe ninguna demostración.</p>`
       :`<p class="okv">✔ Válido</p><p>No existe ninguna interpretación que haga verdaderas todas las premisas y falsa la conclusión, así que la deducción se puede demostrar.</p>`}
    <p class="muted">De las ${R.length} interpretaciones posibles, en ${good} se cumplen todas las premisas. En verde, las filas donde además se cumple la conclusión; en rojo, las que son contraejemplo.</p>
    ${ttTable(vs,cols,vals=>{ const allP=vals.slice(0,np).every(Boolean); return allP?(vals[np]?"good":"cx"):""; })}`;
}

"1"(){ return `
<div class="parthead"><span class="eyebrow">Parte 1</span><h2>El lenguaje L0: sintaxis</h2><p>Qué se puede escribir y qué no. Es la base de todo lo demás: si una expresión no es fórmula bien formada, no hay nada que calcular ni que demostrar.</p></div>
<section><h3>Qué es una proposición</h3>
<p>La lógica proposicional sólo trabaja con oraciones enunciativas: las que afirman o niegan algo y por tanto se pueden calificar de verdaderas o falsas. Las preguntas, las órdenes y los deseos quedan fuera.</p>
<p>Una proposición es una oración enunciativa que no puede descomponerse en partes que sean, a su vez, proposiciones. Si la puedes partir por un «y», un «o» o un «si… entonces», no es una proposición simple, sino una oración compuesta.</p>
${T(["Frase","¿Proposición?","Por qué"],[["Juan es alto","Sí","Afirma un hecho, es V o F"],["Llueve","Sí","Simple y con sentido completo"],["Llueve y hace frío","No","Se descompone en dos proposiciones"],["¿Qué hora es?","No","Interrogativa: no es ni verdadera ni falsa"],["Cierra la puerta","No","Exhortativa: no afirma ni niega nada"]],1)}
<p class="callout"><b class="big">Regla de oro: las proposiciones se definen en positivo.</b><br>Si la frase dice «no vino a la fiesta», la proposición es P: «vino a la fiesta» y tú escribes ${f("¬P")}. La negación la pones con la conectiva, nunca la escondes dentro de la letra. Si la metieras dentro, la fórmula sería sólo P y perderías la estructura: después no podrías aplicarle ninguna regla que hable de ¬, como la doble negación o la reducción al absurdo.</p>
</section>
<section><h3>El alfabeto</h3>
${T(["Pieza","Símbolos","Para qué sirve"],[["Constantes","V, F","Los dos valores de verdad"],["Átomos o letras proposicionales","p, q, r, s…","Uno por cada proposición simple"],["Conectivas",paint("¬ ∧ ∨ → ↔"),"Unen o modifican proposiciones"],["Auxiliares","( ) [ ] { }","Agrupan y deshacen ambigüedades"]],1)}
</section>
<section><h3>Fórmula bien formada (fbf)</h3>
<p>Una fbf es una expresión que pertenece de verdad al lenguaje. Se construye con cuatro reglas, aplicadas tantas veces como haga falta:</p>
<ol><li>Todo átomo es una fbf. También lo son las constantes V y F.</li><li>Si α es una fbf, entonces ${f("¬α")} es una fbf.</li><li>Si α y β son fbf, entonces ${f("(α ∧ β)")}, ${f("(α ∨ β)")}, ${f("(α → β)")} y ${f("(α ↔ β)")} son fbf.</li><li>Nada más es una fbf.</li></ol>
<p>Para comprobar si algo es fbf se aplica el proceso hacia abajo: miras la conectiva principal, dices qué regla la genera, y esa regla te exige que sus partes sean a su vez fbf. Repites hasta llegar a átomos, que lo son por definición. Así se contesta el ejercicio 1 de la relación.</p>
${T(["Expresión","¿fbf?","Motivo"],[[f("p → q ∨ r"),"Sí","La prioridad la lee como "+f("p → (q ∨ r)")],[f("¬¬p"),"Sí","La negación se puede encadenar"],[f("p ∧ ∨ q"),"No","Dos conectivas binarias seguidas: falta un operando"],[f("p ¬ q"),"No","La negación es unaria, no une dos fórmulas"],[f("(p ∧ q"),"No","Paréntesis sin cerrar"],[f("p ⊢ q"),"No","⊢ no es una conectiva: es metalenguaje"]],1)}
</section>
<section><h3>Prioridad de las conectivas</h3>
<p>Los paréntesis se pueden ahorrar porque las conectivas tienen un orden fijo. De mayor a menor fuerza, según la guía:</p>
<div class="chain"><span class="lv">1 ${paint("¬")}</span><span class="gt">›</span><span class="lv">2 ${paint("∧")}</span><span class="gt">›</span><span class="lv">3 ${paint("∨")}</span><span class="gt">›</span><span class="lv">4 ${paint("→")}</span><span class="gt">›</span><span class="lv">5 ${paint("↔")}</span></div>
<p>«Más fuerte» significa que agarra menos texto a su alrededor. La negación sólo afecta a lo mínimo que tenga a su derecha; el bicondicional parte la fórmula entera en dos mitades.</p>
${T(["Sin paréntesis","Se lee como","Conectiva principal"],[[f("¬p ∧ q"),f("(¬p) ∧ q"),paint("∧")],[f("¬(p ∧ q)"),f("¬(p ∧ q)"),paint("¬")],[f("p ∧ q ∨ r"),f("(p ∧ q) ∨ r"),paint("∨")],[f("p → q ∧ r"),f("p → (q ∧ r)"),paint("→")],[f("p ∨ q ↔ ¬r"),f("(p ∨ q) ↔ (¬r)"),paint("↔")]],1)}
<p class="callout"><b>Las dos cosas que se llaman «prioridad» y conviene no mezclar.</b> La <b>prioridad de agarre</b> es la escalera de arriba: dice dónde van los paréntesis implícitos, y la gana ¬. La <b>conectiva principal</b> o dominante es la última en aplicarse, la de agarre más débil dentro de esa fórmula concreta, y es la que da nombre a la fbf («esto es un condicional»). En ${f("¬p ∧ q → r")} la primera en calcularse es ¬ y la dominante es →: la fbf es un condicional.</p>
<p class="callout"><b>Cuando la misma conectiva se repite.</b> Según la guía, ∧ y ∨ se agrupan por la izquierda y → por la derecha: ${f("p → q → r")} es ${f("p → (q → r)")}. Los apuntes no fijan este detalle; es el convenio del libro de referencia (Huth y Ryan) y es lo que hace que el ejercicio 1.b tenga sentido. Aun así, cuando escribas tú una fórmula desde cero, pon el paréntesis: no cuesta nada y elimina la duda.</p>
<p class="callout warn"><b>Ojo, dos convenios distintos.</b> Las diapositivas de teoría (y el Autotest, y la relación de ejercicios de la pestaña de al lado) ponen ∧ y ∨ al mismo nivel, → y ↔ al mismo nivel, y agrupan de izquierda a derecha: ${f("p → q → r")} = ${f("(p → q) → r")}. La guía de prácticas sigue el convenio de Huth y Ryan. Sólo se notan en fórmulas como ${f("p ∨ q ∧ r")} o cadenas de →. En el examen, ante la duda, <b>pon paréntesis</b>. El analizador de abajo te deja elegir el convenio.</p>
</section>
<section><h3>El árbol sintáctico</h3>
<p>El árbol dibuja la estructura: en la raíz va la conectiva principal y en las hojas los átomos. Dos fórmulas representan la misma oración si y sólo si tienen el mismo árbol. Es la herramienta para contestar la segunda parte del ejercicio 1.</p>
</section>
${toolAnalyzer()}
<p class="callout"><b>Cómo usarlo para el ejercicio 1.</b> Analiza las dos fórmulas por separado y compara los árboles, no el texto. Si los árboles coinciden, representan la misma oración; si no, no. Mira también la línea «conectiva principal»: si una es un condicional y la otra una disyunción, ya está contestado.</p>`; },

"2"(){ return `
<div class="parthead"><span class="eyebrow">Parte 2</span><h2>Formalizar: del castellano a la fórmula</h2><p>La parte con más trampas de toda la asignatura, porque el lenguaje natural dice lo mismo de muchas maneras y a veces en otro orden.</p></div>
<section><h3>El método, en cuatro pasos</h3>
<p>Formalizar no es traducir palabra por palabra: es analizar qué dice la oración y escribirlo en el lenguaje formal. El orden de los pasos importa.</p>
<ol class="checklist"><li>Lee la frase entera y localiza las partes que son proposiciones simples.</li><li>Identifica el nexo y escribe su patrón general con α y β («No α a menos que β») junto a su forma lógica (${f("α → β")}). Este paso decide la conectiva y, en los condicionales, quién va delante de la flecha.</li><li>Escribe la signatura: una letra por proposición, siempre en sentido positivo y como oración completa con sujeto y verbo.</li><li>Sustituye α y β por lo que valgan en esta frase concreta y escribe la fbf.</li></ol>
<p class="callout"><b>Por qué el nexo va antes que la signatura.</b> Si escribes las letras primero, es muy fácil colocarlas en el orden en que aparecen en la frase. Pero en «No te vendo el coche ya que no me ofreces el dinero», la causa se dice la segunda y es la que va delante de la flecha. El patrón del nexo te da el orden correcto antes de que puedas equivocarte.</p>
<p><b>Las tres reglas que ahorran la mayoría de los errores:</b></p>
<ul><li><b>No añadas nada que la oración no diga.</b> Ni contexto, ni implicaciones que tú das por supuestas.</li><li><b>Mantén un criterio homogéneo:</b> si decides que «pero» es ∧, lo es en todo el ejercicio.</li><li><b>Parafrasea las frases dudosas:</b> dilas con otras palabras sin cambiar el sentido y verás cuál es la condición y cuál el resultado.</li></ul>
</section>
<section><h3>Un ejemplo completo</h3>
<p>«Mi coche no tiene tantos caballos como el tuyo, pero corre más.»</p>
${T(["Paso","Resultado","Nota"],[["1","P: «mi coche tiene tantos caballos como el tuyo»","proposición en positivo"],["2","Q: «mi coche corre más que el tuyo»","proposición en positivo"],["3",f("¬P ∧ Q"),"«no» + «pero»"]],1)}
<p>Fíjate en dos cosas: «pero» se traduce como conjunción, porque lógicamente afirma las dos partes, y la negación se saca fuera del átomo.</p>
</section>
<section><h3>El condicional, por dentro</h3>
<p>En ${f("P → Q")}, P es el antecedente (la condición) y Q el consecuente (el resultado). Ese orden no siempre coincide con el orden de las palabras en la frase. Las dos lecturas que hay que memorizar:</p>
${T(["Expresión","Se formaliza","Regla para recordarlo"],[["P es suficiente para Q",f("P → Q"),"Con P basta: lo suficiente va delante"],["P es necesario para Q",f("Q → P"),"Sin P no hay Q: lo necesario va detrás"]],1)}
</section>
<section><h3>Las trampas clásicas</h3>
${T(["Expresión","Formaliza","Por qué"],[["P si Q",f("Q → P"),"«si» marca la condición: Q es el antecedente aunque vaya detrás"],["P sólo si Q",f("P → Q"),"Q es lo imprescindible: si hay P, hay Q"],["P porque Q",f("Q → P"),"La causa es el antecedente, aunque se diga la segunda"],["No P a menos que Q",f("P → Q"),"El «no» ya está dentro del patrón: no se escribe otra vez"],["Ni P ni Q",f("¬P ∧ ¬Q"),"Niega las dos cosas a la vez, no una u otra"],["P pero Q",f("P ∧ Q"),"El contraste es pragmático; lógicamente afirma las dos"],["No sólo P sino también Q",f("P ∧ Q"),"El «no» es parte de la locución, no niega nada"],["Es necesario Q para P",f("P → Q"),"Sin Q no hay P"],["Es suficiente P para Q",f("P → Q"),"Con P basta para tener Q"]],1)}
<p class="callout warn"><b>El error que más se repite en toda la relación.</b> Hay nexos que ya llevan el «no» dentro del patrón. «No α a menos que β» equivale a ${f("α → β")}, sin ninguna negación en la solución. Si además escribes ¬, estás negando dos veces lo mismo.<br>Compáralo con «α sólo si β», que también da ${f("α → β")} pero donde un «no» que aparezca en la frase sí es una negación real que hay que escribir. En el ejercicio 3.c, «No voy al cine a menos que no llueva», hay dos «no» y sólo uno llega a la fórmula: ${f("p → ¬q")}.</p>

<section><h3>Diccionario de nexos</h3>
<p>La misma conectiva se esconde tras muchas expresiones. Cuando una expresión cumple la misma función lógica que «no», «y», «o», «si» o «si y sólo si», se formaliza con esa conectiva aunque suene distinta.</p>
<div class="tool" style="border-width:1px"><label for="dictq">Escribe para filtrar (por ejemplo «menos», «porque», «cuando»)<input type="text" id="dictq" autocomplete="off" placeholder="nexo…" style="font-family:var(--f-body)"></label><div class="dict" id="dictout">${dictHTML("")}</div></div>
